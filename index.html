// CHUNK C — FIREBASE CLOUD API (BROWSER ESM + PERMISSION RETRY + SALVAGE)
// =========================================================================
const KARACHI_DAY_FORMATTER = new Intl.DateTimeFormat('en-CA', {
  timeZone: TZ,
  year: 'numeric',
  month: '2-digit',
  day: '2-digit',
});

function dayKeyFor(ms) {
  return KARACHI_DAY_FORMATTER.format(new Date(ms));
}

function pairIdFor(a, b) {
  return a < b ? `${a}_${b}` : `${b}_${a}`;
}

function timestampToMs(t) {
  if (!t) return 0;
  if (typeof t.toMillis === 'function') return t.toMillis();
  if (typeof t.seconds === 'number') return t.seconds * 1000;
  return 0;
}

function capValue(v, max) {
  const raw = Number(v);
  const n = Number.isFinite(raw) ? Math.floor(raw) : 0;
  return Math.min(max, Math.max(0, n)) + 0;
}

function makeError(code, message) {
  return Object.assign(new Error(message), { code });
}

function requireUid() {
  const u = auth?.currentUser?.uid;
  if (!u) throw makeError('unauthenticated', 'Not signed in');
  return u;
}

function isPermissionDeniedError(err) {
  const code = err?.code || '';
  const msg = err instanceof Error ? err.message : String(err || '');
  return (
    code === 'permission-denied' ||
    code === 'unauthenticated' ||
    /permission-denied|Missing or insufficient permissions/i.test(`${code} ${msg}`)
  );
}

async function withAuthRetry(fn) {
  try {
    return await fn();
  } catch (err) {
    if (isPermissionDeniedError(err) && auth?.currentUser) {
      await auth.currentUser.getIdToken(true).catch(() => null);
      await new Promise((r) => setTimeout(r, 450));
      return await fn();
    }
    throw err;
  }
}

function reportAndRethrow(err, op, path, skipPermLog = false) {
  const code = err?.code || '';
  if (code !== 'aborted' && code !== 'already-exists' && code !== 'resource-exhausted') {
    if (!(skipPermLog && isPermissionDeniedError(err))) {
      const info = recordFirestoreError(err, op, path);
      console.error('Firestore Error: ', JSON.stringify(info));
    }
  }
  throw err;
}

async function runSessionTx(sid, onKicked, fn, checkSession = true, opPath = null, suppressPermLog = false) {
  const uid = requireUid();
  const { doc, runTransaction } = fbFs;
  const exec = () =>
    runTransaction(db, async (tx) => {
      if (checkSession) {
        const sesSnap = await tx.get(doc(db, 'players', uid, 'private', 'session'));
        if (sesSnap.exists() && sesSnap.data()?.sid !== sid) {
          onKicked();
          throw makeError('aborted', 'Another session is active');
        }
      }
      return fn(tx, uid);
    });

  try {
    return await exec();
  } catch (err) {
    if (isPermissionDeniedError(err) && auth?.currentUser) {
      await auth.currentUser.getIdToken(true).catch(() => null);
      await new Promise((r) => setTimeout(r, 450));
      try {
        return await exec();
      } catch (retryErr) {
        reportAndRethrow(retryErr, OperationType.WRITE, opPath || `players/${uid}`, suppressPermLog);
      }
    }
    reportAndRethrow(err, OperationType.WRITE, opPath || `players/${uid}`, suppressPermLog);
  }
}

function writeNotifInTx(tx, toUid, fromUid, type, text, tradeId) {
  const { collection, doc, serverTimestamp } = fbFs;
  const ref = doc(collection(db, 'players', toUid, 'notifications'));
  tx.set(ref, {
    type,
    text: text.slice(0, 200),
    tradeId: tradeId || null,
    read: false,
    from: fromUid,
    createdAt: serverTimestamp(),
  });
}

async function checkUsernameAvailability(username) {
  const { doc, getDoc } = fbFs;
  const lower = username.trim().toLowerCase();
  if (!/^[a-z0-9_]{3,16}$/.test(lower)) {
    return { available: false, reason: 'Invalid username' };
  }
  const path = `usernames/${lower}`;
  try {
    const snap = await withAuthRetry(() => getDoc(doc(db, 'usernames', lower)));
    return {
      available: !snap.exists(),
      reason: snap.exists() ? 'Already taken' : undefined,
    };
  } catch (err) {
    handleFirestoreError(err, OperationType.GET, path);
  }
}

async function createPlayerProfile(usernameRaw, countryCodeRaw, state, sid, onKicked) {
  const { doc, serverTimestamp } = fbFs;
  const username = usernameRaw.trim();
  const lower = username.toLowerCase();
  if (!/^[A-Za-z0-9_]{3,16}$/.test(username)) {
    throw makeError('invalid', 'Invalid username');
  }
  const cn = COUNTRIES.find((c) => c[0] === countryCodeRaw) || COUNTRIES[0];
  let out = { walletRev: 1 };

  await runSessionTx(
    sid,
    onKicked,
    async (tx, uid) => {
      const uRef = doc(db, 'usernames', lower);
      const sRef = doc(db, 'saves', uid);
      const pRef = doc(db, 'players', uid);
      const wRef = doc(db, 'players', uid, 'private', 'wallet');
      const [uSnap, sSnap, pSnap, wSnap] = await Promise.all([
        tx.get(uRef),
        tx.get(sRef),
        tx.get(pRef),
        tx.get(wRef),
      ]);
      if (uSnap.exists() && uSnap.data()?.uid !== uid) {
        throw makeError('already-exists', 'Username already taken');
      }

      const oldRaw = sSnap.exists() ? sSnap.data()?.save : undefined;
      const baseState = oldRaw ? migrateState(oldRaw) : state;
      const cleanedSave = cleanSavePayload(baseState);
      const cash = capValue(cleanedSave.cash, 1e13);
      const gems = capValue(cleanedSave.gems, 1e9);
      const stk = cleanStickersMap(cleanedSave.stk);
      const gdpVal = Math.max(1, Math.min(cash, capValue(calculateGdp(baseState), 1e13)));
      const levelVal = Math.max(1, Math.min(10000000, Math.floor(playerLevel(baseState))));
      const rankVal = Math.max(0, Math.min(MAX_RANK, Math.floor(Number(baseState.rank) || 0)));

      if (pSnap.exists()) {
        const existingRev =
          wSnap.exists() && Number.isFinite(Number(wSnap.data()?.rev))
            ? Math.max(0, Math.floor(Number(wSnap.data()?.rev)))
            : 0;
        const walletRev = wSnap.exists() ? Math.max(1, existingRev) : 1;
        if (!wSnap.exists()) {
          tx.set(wRef, {
            cash,
            gems,
            stk,
            rev: 1,
            sid,
            t: serverTimestamp(),
          });
        }
        if (!sSnap.exists()) {
          tx.set(sRef, { save: cleanedSave });
        }
        out = { restoredSave: oldRaw, walletRev };
        return;
      }

      if (!uSnap.exists()) {
        tx.set(uRef, { uid });
      }
      const activeSub = getActiveSubscription(baseState, Date.now());
      const prevRev =
        wSnap.exists() && Number.isFinite(Number(wSnap.data()?.rev))
          ? Math.max(0, Math.floor(Number(wSnap.data()?.rev)))
          : 0;
      const nextRev = Math.min(1e9, prevRev + 1);

      const profileDoc = {
        username,
        usernameLower: lower,
        countryCode: cn[0],
        countryName: cn[1],
        gdp: gdpVal,
        cash,
        gems,
        level: levelVal,
        rank: rankVal,
        lastSeen: serverTimestamp(),
        stats: sanitizeStats(undefined, { buildings: totalBuildings(baseState) }),
        createdAt: serverTimestamp(),
      };
      if (activeSub) {
        profileDoc.subTier = activeSub.def.id;
        profileDoc.subExp = Math.max(0, Math.min(1e13, Math.floor(activeSub.exp)));
      }
      tx.set(pRef, profileDoc);
      tx.set(wRef, {
        cash,
        gems,
        stk,
        rev: nextRev,
        sid,
        t: serverTimestamp(),
      });
      if (!oldRaw) {
        tx.set(sRef, { save: cleanedSave });
      }
      out = { restoredSave: oldRaw, walletRev: nextRev };
    },
    false,
    'players',
  );

  return out;
}

async function syncSaveToCloud(params) {
  const { doc, getDoc, serverTimestamp, setDoc, updateDoc } = fbFs;
  const { state, pubStats, completedTradesCount, rev, sid, onKicked } = params;
  const cash = capValue(state.cash, 1e13);
  const gems = capValue(state.gems, 1e9);
  const stk = cleanStickersMap(state.stk);
  const gdpVal = Math.max(1, Math.min(cash, capValue(calculateGdp(state), 1e13)));

  const buildProfileUpdate = (pData, activeSub) => {
    const existingStats = pData?.stats ?? pubStats;
    const mergedStats = sanitizeStats(existingStats, {
      buildings: totalBuildings(state),
      completedTrades: Math.max(
        existingStats?.completedTrades || 0,
        pubStats?.completedTrades || 0,
        completedTradesCount,
      ),
    });
    const payload = {
      gdp: gdpVal,
      cash,
      gems,
      level: capValue(playerLevel(state), 10000000) || 1,
      rank: capValue(state.rank, MAX_RANK),
      lastSeen: serverTimestamp(),
      stats: mergedStats,
    };
    if (activeSub) {
      payload.subTier = activeSub.def.id;
      payload.subExp = capValue(activeSub.exp, 1e13);
    } else if (pData?.subTier || pData?.subExp) {
      payload.subTier = '';
      payload.subExp = 0;
    }
    return payload;
  };

  let result;
  try {
    await runSessionTx(
      sid,
      onKicked,
      async (tx, uid) => {
        const wRef = doc(db, 'players', uid, 'private', 'wallet');
        const pRef = doc(db, 'players', uid);
        const [wSnap, pSnap] = await Promise.all([tx.get(wRef), tx.get(pRef)]);
        if (!pSnap.exists()) {
          throw makeError('failed-precondition', 'Player profile not initialized');
        }
        const wData = wSnap.exists() ? wSnap.data() : null;
        const curRev =
          wData && Number.isFinite(Number(wData.rev)) ? Math.max(0, Math.floor(Number(wData.rev))) : 0;
        const accepted = !wData || curRev === rev;

        if (accepted) {
          const nextRev = (curRev >= 1e9 ? 1e9 : curRev + 1) + 0;
          tx.set(wRef, {
            cash,
            gems,
            stk,
            rev: nextRev,
            sid,
            t: serverTimestamp(),
          });
          const activeSub = getActiveSubscription(state, Date.now());
          tx.update(pRef, buildProfileUpdate(pSnap.data(), activeSub));
          tx.set(doc(db, 'saves', uid), { save: cleanSavePayload(state) });
          result = {
            accepted: true,
            wallet: { cash, gems, stk, rev: nextRev },
          };
        } else {
          if (wData.sid && wData.sid !== sid) {
            onKicked();
            throw makeError('aborted', 'Another session is active');
          }
          result = {
            accepted: false,
            wallet: {
              cash: capValue(wData.cash, 1e13),
              gems: capValue(wData.gems, 1e9),
              stk: cleanStickersMap(wData.stk),
              rev: curRev,
            },
          };
        }
      },
      true,
      'saves (wallet + player + save)',
      true,
    );
    return result;
  } catch (err) {
    if (!isPermissionDeniedError(err)) {
      throw err;
    }

    const uid = requireUid();
    let firstFatalErr = null;
    let savedDocOk = false;
    let walletDocOk = false;
    let nextRev = Math.max(1, rev + 1);

    const sesRef = doc(db, 'players', uid, 'private', 'session');
    try {
      const sesSnap = await withAuthRetry(() => getDoc(sesRef));
      if (sesSnap.exists() && sesSnap.data()?.sid && sesSnap.data()?.sid !== sid) {
        onKicked();
        throw makeError('aborted', 'Another session is active');
      }
      if (!sesSnap.exists()) {
        await withAuthRetry(() => setDoc(sesRef, { sid, t: serverTimestamp() }));
      }
    } catch (sesErr) {
      if (sesErr?.code === 'aborted') throw sesErr;
      const info = recordFirestoreError(sesErr, OperationType.WRITE, `players/${uid}/private/session`);
      console.error('Firestore Error: ', JSON.stringify(info));
      if (!firstFatalErr) firstFatalErr = sesErr;
    }

    const sRef = doc(db, 'saves', uid);
    try {
      await withAuthRetry(() => setDoc(sRef, { save: cleanSavePayload(state) }));
      savedDocOk = true;
    } catch (saveErr) {
      const info = recordFirestoreError(saveErr, OperationType.WRITE, `saves/${uid}`);
      console.error('Firestore Error: ', JSON.stringify(info));
      if (!firstFatalErr) firstFatalErr = saveErr;
    }

    const wRef = doc(db, 'players', uid, 'private', 'wallet');
    try {
      const wSnap = await withAuthRetry(() => getDoc(wRef));
      const wData = wSnap.exists() ? wSnap.data() : null;
      const curRev =
        wData && Number.isFinite(Number(wData.rev)) ? Math.max(0, Math.floor(Number(wData.rev))) : 0;
      if (wData && curRev !== rev) {
        if (wData.sid && wData.sid !== sid) {
          onKicked();
          throw makeError('aborted', 'Another session is active');
        }
        return {
          accepted: false,
          wallet: {
            cash: capValue(wData.cash, 1e13),
            gems: capValue(wData.gems, 1e9),
            stk: cleanStickersMap(wData.stk),
            rev: curRev,
          },
        };
      }
      nextRev = Math.min(1e9, curRev + 1);
      await withAuthRetry(() =>
        setDoc(wRef, {
          cash,
          gems,
          stk,
          rev: nextRev,
          sid,
          t: serverTimestamp(),
        }),
      );
      walletDocOk = true;
    } catch (walletErr) {
      if (walletErr?.code === 'aborted') throw walletErr;
      const info = recordFirestoreError(walletErr, OperationType.WRITE, `players/${uid}/private/wallet`);
      console.error('Firestore Error: ', JSON.stringify(info));
      if (!firstFatalErr) firstFatalErr = walletErr;
    }

    const pRef = doc(db, 'players', uid);
    try {
      const pSnap = await withAuthRetry(() => getDoc(pRef));
      if (!pSnap.exists()) {
        throw makeError('failed-precondition', 'Player profile not initialized');
      }
      const activeSub = getActiveSubscription(state, Date.now());
      await withAuthRetry(() => updateDoc(pRef, buildProfileUpdate(pSnap.data(), activeSub)));
    } catch (playerErr) {
      if (playerErr?.code === 'failed-precondition') throw playerErr;
      const info = recordFirestoreError(playerErr, OperationType.UPDATE, `players/${uid}`);
      console.error('Firestore Error: ', JSON.stringify(info));
      if (!firstFatalErr) firstFatalErr = playerErr;
    }

    if (savedDocOk && walletDocOk) {
      if (firstFatalErr) {
        recordAppError({
          source: 'sync',
          message: 'Cloud save succeeded (leaderboard update hit a rules error — see details above).',
          path: `players/${uid}`,
        });
      }
      return {
        accepted: true,
        wallet: { cash, gems, stk, rev: nextRev },
      };
    }

    throw firstFatalErr || err;
  }
}

async function createGiftOffer(params) {
  const { collection, doc, serverTimestamp, Timestamp } = fbFs;
  const uid = requireUid();
  const serverOffsetMs = params.serverOffsetMs || 0;
  const oc = capValue(params.offerCash, 1e12);
  const og = capValue(params.offerGems, 1e9);
  const offerStk = cleanStickersMap(params.offerStk);
  const stkTotal = Object.values(offerStk).reduce((a, b) => a + b, 0);

  if (!/^[a-zA-Z0-9_-]{1,128}$/.test(params.toUid)) {
    throw makeError('invalid', 'Invalid recipient');
  }
  if (params.toUid === uid) throw makeError('invalid', "You can't send to yourself");
  if (oc + og + stkTotal <= 0) throw makeError('invalid', 'Add something to send first');

  const key = `${uid}_${dayKeyFor(Date.now() + serverOffsetMs)}`;
  const trRef = doc(collection(db, 'trades'));
  let remainingToday = 0;

  await runSessionTx(params.sid, params.onKicked, async (tx, me) => {
    const wRef = doc(db, 'players', me, 'private', 'wallet');
    const dlRef = doc(db, 'dailyLimits', key);
    const toRef = doc(db, 'players', params.toUid);
    const meRef = doc(db, 'players', me);

    const [wSnap, dlSnap, toSnap, meSnap] = await Promise.all([
      tx.get(wRef),
      tx.get(dlRef),
      tx.get(toRef),
      tx.get(meRef),
    ]);

    const curCount = dlSnap.exists() ? Number(dlSnap.data()?.count || 0) : 0;
    const wd = wSnap.exists() ? wSnap.data() : null;
    if (!wd) throw makeError('failed-precondition', 'Wallet not found');
    if (curCount >= DAILY_GIFT_MAX) {
      throw makeError('resource-exhausted', 'Daily gift limit reached');
    }
    if (!toSnap.exists() || !meSnap.exists()) {
      throw makeError('not-found', 'Player not found');
    }

    const wCash = capValue(wd.cash, 1e13);
    const wGems = capValue(wd.gems, 1e9);
    const wStk = cleanStickersMap(wd.stk);

    if (wCash < oc || wGems < og) {
      throw makeError('failed-precondition', "You don't have enough balance");
    }
    for (const [k, v] of Object.entries(offerStk)) {
      if (v > (wStk[k] || 0)) {
        throw makeError('failed-precondition', "You don't own enough of that sticker");
      }
    }

    const nextStk = { ...wStk };
    for (const [k, v] of Object.entries(offerStk)) {
      nextStk[k] -= v;
      if (nextStk[k] <= 0) delete nextStk[k];
    }

    const meData = meSnap.data();
    const toData = toSnap.data();
    const fromName = String(meData.username || 'Player').trim().slice(0, 16) || 'Player';
    const toName = String(toData.username || 'Player').trim().slice(0, 16) || 'Player';
    const prevRev = Number.isFinite(Number(wd.rev)) ? Math.max(0, Math.floor(Number(wd.rev))) : 0;

    tx.set(wRef, {
      cash: wCash - oc,
      gems: wGems - og,
      stk: nextStk,
      rev: Math.min(1e9, prevRev + 1),
      sid: params.sid,
      t: serverTimestamp(),
      tradeId: trRef.id,
    });

    const newCash = wCash - oc;
    const newGems = wGems - og;
    const prevStats = sanitizeStats(meData.stats);
    tx.update(meRef, {
      gdp: Math.max(1, newCash),
      cash: newCash,
      gems: newGems,
      level: Math.max(1, Math.min(10000000, Math.floor(Number(meData.level) || 1))),
      rank: Math.max(0, Math.min(MAX_RANK, Math.floor(Number(meData.rank) || 0))),
      lastSeen: serverTimestamp(),
      stats: sanitizeStats(prevStats, {
        tradesSent: prevStats.tradesSent + 1,
        cashTraded: prevStats.cashTraded + oc,
        gemsTraded: prevStats.gemsTraded + og,
      }),
    });

    tx.set(trRef, {
      from: me,
      to: params.toUid,
      fromName,
      toName,
      fromCountry: sanitizeCountryCode(meData.countryCode),
      toCountry: sanitizeCountryCode(toData.countryCode),
      participants: [me, params.toUid],
      offerCash: oc,
      offerGems: og,
      offerStk,
      reqCash: 0,
      reqGems: 0,
      reqStk: {},
      message: params.message.trim().slice(0, 140),
      status: 'pending',
      refunded: false,
      createdAt: serverTimestamp(),
      expiresAt: Timestamp.fromMillis(Date.now() + serverOffsetMs + 120000),
    });

    tx.set(dlRef, { count: curCount + 1, uid: me });
    writeNotifInTx(tx, params.toUid, me, 'new_offer', `${fromName} sent you a gift`, trRef.id);
    remainingToday = DAILY_GIFT_MAX - (curCount + 1);
  });

  return { remainingToday };
}

async function acceptGiftOffer(tradeId, sid, onKicked, serverOffsetMs = 0) {
  const { doc, serverTimestamp } = fbFs;
  let status = 'accepted';
  await runSessionTx(sid, onKicked, async (tx, me) => {
    const tRef = doc(db, 'trades', tradeId);
    const tSnap = await tx.get(tRef);
    const t = tSnap.data();
    if (!t) throw makeError('not-found', 'Offer not found');
    if (t.to !== me) throw makeError('permission-denied', 'Not your offer');
    if (t.status !== 'pending') {
      status = t.status;
      return;
    }
    if (timestampToMs(t.expiresAt) <= Date.now() + serverOffsetMs) {
      status = 'expired';
      return;
    }

    const wRef = doc(db, 'players', me, 'private', 'wallet');
    const meRef = doc(db, 'players', me);
    const [wSnap, meSnap] = await Promise.all([tx.get(wRef), tx.get(meRef)]);
    const w = wSnap.data();
    if (!w) throw makeError('failed-precondition', 'Wallet missing');

    const mStk = cleanStickersMap(w.stk);
    for (const [k, v] of Object.entries(t.offerStk || {})) {
      mStk[k] = (mStk[k] || 0) + Math.max(0, Math.floor(Number(v) || 0));
    }

    const newCash = Math.min(1e13, capValue(w.cash, 1e13) + capValue(t.offerCash, 1e12));
    const newGems = Math.min(1e9, capValue(w.gems, 1e9) + capValue(t.offerGems, 1e9));

    const prevRev = Number.isFinite(Number(w.rev)) ? Math.max(0, Math.floor(Number(w.rev))) : 0;
    tx.set(wRef, {
      cash: newCash,
      gems: newGems,
      stk: mStk,
      rev: Math.min(1e9, prevRev + 1),
      sid,
      t: serverTimestamp(),
      tradeId,
    });

    if (meSnap.exists()) {
      const md = meSnap.data();
      const prevStats = sanitizeStats(md.stats);
      tx.update(meRef, {
        gdp: Math.max(1, newCash),
        cash: newCash,
        gems: newGems,
        level: Math.max(1, Math.min(10000000, Math.floor(Number(md.level) || 1))),
        rank: Math.max(0, Math.min(MAX_RANK, Math.floor(Number(md.rank) || 0))),
        lastSeen: serverTimestamp(),
        stats: sanitizeStats(prevStats, {
          completedTrades: prevStats.completedTrades + 1,
          tradesReceived: prevStats.tradesReceived + 1,
          cashTraded: prevStats.cashTraded + capValue(t.offerCash, 1e12),
          gemsTraded: prevStats.gemsTraded + capValue(t.offerGems, 1e9),
        }),
      });
    }

    const receiverName = String(t.toName || 'Player').trim().slice(0, 16) || 'Player';
    tx.update(tRef, { status: 'accepted', resolvedAt: serverTimestamp() });
    writeNotifInTx(tx, t.from, me, 'accepted', `${receiverName} accepted your gift`, tradeId);
    status = 'accepted';
  });
  return { status };
}

async function rejectGiftOffer(tradeId, sid, onKicked, serverOffsetMs = 0) {
  const { doc, serverTimestamp } = fbFs;
  let status = 'rejected';
  await runSessionTx(sid, onKicked, async (tx, me) => {
    const tRef = doc(db, 'trades', tradeId);
    const t = (await tx.get(tRef)).data();
    if (!t) throw makeError('not-found', 'Offer not found');
    if (t.to !== me) throw makeError('permission-denied', 'Not your offer');
    if (t.status !== 'pending') {
      status = t.status;
      return;
    }
    if (timestampToMs(t.expiresAt) <= Date.now() + serverOffsetMs) {
      status = 'expired';
      return;
    }
    tx.update(tRef, { status: 'rejected', resolvedAt: serverTimestamp() });
    writeNotifInTx(tx, t.from, me, 'rejected', `${t.toName} declined your gift`, tradeId);
    status = 'rejected';
  });
  return { status };
}

async function endSenderOffer(tradeId, want, sid, onKicked, serverOffsetMs = 0) {
  const { doc, serverTimestamp } = fbFs;
  let status = want;
  await runSessionTx(sid, onKicked, async (tx, me) => {
    const tRef = doc(db, 'trades', tradeId);
    const t = (await tx.get(tRef)).data();
    if (!t || t.from !== me) {
      status = 'gone';
      return;
    }
    if (t.status !== 'pending') {
      status = t.status;
      return;
    }
    if (want === 'expired' && timestampToMs(t.expiresAt) > Date.now() + serverOffsetMs) {
      status = 'pending';
      return;
    }
    const wRef = doc(db, 'players', me, 'private', 'wallet');
    const w = (await tx.get(wRef)).data();
    if (!w) return;
    const refundStk = cleanStickersMap(w.stk);
    for (const [k, v] of Object.entries(t.offerStk || {})) {
      refundStk[k] = (refundStk[k] || 0) + Math.max(0, Math.floor(Number(v) || 0));
    }
    const prevRev = Number.isFinite(Number(w.rev)) ? Math.max(0, Math.floor(Number(w.rev))) : 0;
    const senderName = String(t.fromName || 'Player').trim().slice(0, 16) || 'Player';
    tx.update(tRef, { status: want, resolvedAt: serverTimestamp(), refunded: true });
    tx.set(wRef, {
      cash: Math.min(1e13, capValue(w.cash, 1e13) + capValue(t.offerCash, 1e12)),
      gems: Math.min(1e9, capValue(w.gems, 1e9) + capValue(t.offerGems, 1e9)),
      stk: refundStk,
      rev: Math.min(1e9, prevRev + 1),
      sid,
      t: serverTimestamp(),
      tradeId,
    });
    writeNotifInTx(
      tx,
      t.to,
      me,
      want,
      `${senderName}${want === 'expired' ? "'s gift expired" : ' cancelled the gift'}`,
      tradeId,
    );
    status = want;
  });
  return status;
}

async function reclaimUnrefundedOffer(tradeId, sid, onKicked) {
  const { doc, serverTimestamp } = fbFs;
  let status = 'refunded';
  await runSessionTx(sid, onKicked, async (tx, me) => {
    const tRef = doc(db, 'trades', tradeId);
    const t = (await tx.get(tRef)).data();
    if (!t || t.from !== me) {
      status = 'gone';
      return;
    }
    if (t.refunded) {
      status = 'already';
      return;
    }
    if (t.status !== 'rejected' && t.status !== 'expired') {
      status = 'invalid';
      return;
    }
    const wRef = doc(db, 'players', me, 'private', 'wallet');
    const w = (await tx.get(wRef)).data();
    if (!w) return;
    const refundStk = cleanStickersMap(w.stk);
    for (const [k, v] of Object.entries(t.offerStk || {})) {
      refundStk[k] = (refundStk[k] || 0) + Math.max(0, Math.floor(Number(v) || 0));
    }
    const prevRev = Number.isFinite(Number(w.rev)) ? Math.max(0, Math.floor(Number(w.rev))) : 0;
    tx.update(tRef, { refunded: true });
    tx.set(wRef, {
      cash: Math.min(1e13, capValue(w.cash, 1e13) + capValue(t.offerCash, 1e12)),
      gems: Math.min(1e9, capValue(w.gems, 1e9) + capValue(t.offerGems, 1e9)),
      stk: refundStk,
      rev: Math.min(1e9, prevRev + 1),
      sid,
      t: serverTimestamp(),
      tradeId,
    });
  });
  return status;
}

async function settleExpiredTrades(trades, uid, sid, onKicked, serverOffsetMs = 0) {
  const now = Date.now() + serverOffsetMs;
  for (const t of trades) {
    if (t.from === uid && t.status === 'pending' && t.expMs > 0 && t.expMs + 1500 <= now) {
      await endSenderOffer(t.id, 'expired', sid, onKicked, serverOffsetMs).catch((err) => {
        if (err?.code !== 'aborted') {
          recordFirestoreError(err, OperationType.UPDATE, `trades/${t.id}`);
        }
      });
    } else if (
      t.from === uid &&
      (t.status === 'rejected' || t.status === 'expired') &&
      !t.refunded
    ) {
      await reclaimUnrefundedOffer(t.id, sid, onKicked).catch((err) => {
        if (err?.code !== 'aborted') {
          recordFirestoreError(err, OperationType.UPDATE, `trades/${t.id}`);
        }
      });
    }
  }
}

async function searchPlayersByUsername(queryStr, myUid) {
  const { collection, getDocs, limit, query, where } = fbFs;
  const q = queryStr.trim().toLowerCase();
  if (q.length < 2) return [];
  const snap = await withAuthRetry(() =>
    getDocs(
      query(
        collection(db, 'players'),
        where('usernameLower', '>=', q),
        where('usernameLower', '<=', q + '\uf8ff'),
        limit(10),
      ),
    ),
  );
  return snap.docs
    .map((d) => ({ ...d.data(), id: d.id }))
    .filter((p) => p.id !== myUid);
}

async function sendDirectMessage(params) {
  const { addDoc, collection, serverTimestamp } = fbFs;
  if (!/^[a-zA-Z0-9_-]{1,128}$/.test(params.toUid)) {
    throw makeError('invalid', 'Invalid recipient');
  }
  if (params.fromUid === params.toUid) {
    throw makeError('invalid', "You can't message yourself");
  }
  const cleanText = params.text.trim().slice(0, 300);
  if (!cleanText || !/\S/.test(cleanText)) {
    throw makeError('invalid', 'Enter a message first');
  }
  const cleanName = params.fromName.trim().slice(0, 16) || 'Player';
  await withAuthRetry(() =>
    addDoc(collection(db, 'dms', pairIdFor(params.fromUid, params.toUid), 'messages'), {
      from: params.fromUid,
      text: cleanText,
      createdAt: serverTimestamp(),
    }),
  );
  if (params.notify) {
    await withAuthRetry(() =>
      addDoc(collection(db, 'players', params.toUid, 'notifications'), {
        type: 'dm',
        text: `${cleanName}: ${cleanText.slice(0, 60)}`,
        tradeId: null,
        read: false,

        fromName: cleanName,

        createdAt: serverTimestamp(),
      }),
    ).catch((err) => {
      recordFirestoreError(err, OperationType.CREATE, `players/${params.toUid}/notifications`);
    });
  }
}

async function createGovProject(uid, type, onId) {
  const { collection, doc, serverTimestamp, setDoc } = fbFs;
  const ref = doc(collection(db, 'players', uid, 'projects'));
  onId?.(ref.id);
  await withAuthRetry(() =>
    setDoc(ref, {
      uid,
      type,
      paid: 1,
      progressMs: 0,
      status: 'active',
      claimed: false,
      startedAt: serverTimestamp(),
      lastTickAt: serverTimestamp(),
    }),
  );
  return ref.id;
}

async function payGovProjectStage(uid, projectId, expectedPaid) {
  const { doc, runTransaction } = fbFs;
  const ref = doc(db, 'players', uid, 'projects', projectId);
  await withAuthRetry(() =>
    runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      const data = snap.data();
      if (!data || data.status !== 'active' || data.paid !== expectedPaid || expectedPaid >= PROJECT_STAGES) {
        throw new Error('Project state changed — please try again');
      }
      tx.update(ref, { paid: expectedPaid + 1 });
    }),
  );
}

async function tickGovProject(uid, projectId, nextProgressMs) {
  const { doc, runTransaction, serverTimestamp } = fbFs;
  const ref = doc(db, 'players', uid, 'projects', projectId);
  const clamped = Math.max(0, Math.min(2400000, Math.floor(nextProgressMs)));
  await withAuthRetry(() =>
    runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      const data = snap.data();
      if (!data || data.status !== 'active') return;
      const prev = Math.floor(Number(data.progressMs) || 0);
      if (clamped < prev) return;
      tx.update(ref, {
        progressMs: clamped,
        lastTickAt: serverTimestamp(),
      });
    }),
  );
}

async function finishGovProject(uid, projectId, status, finalProgressMs) {
  const { doc, runTransaction, serverTimestamp } = fbFs;
  const ref = doc(db, 'players', uid, 'projects', projectId);
  await withAuthRetry(() =>
    runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      const data = snap.data();
      if (!data || data.status !== 'active') return;
      if (status === 'done' && typeof finalProgressMs === 'number') {
        const prev = Math.floor(Number(data.progressMs) || 0);
        const clamped = Math.max(prev, Math.min(2400000, Math.floor(finalProgressMs)));
        tx.update(ref, {
          progressMs: clamped,
          lastTickAt: serverTimestamp(),
          status: 'done',
          resolvedAt: serverTimestamp(),
        });
      } else {
        tx.update(ref, {
          status,
          resolvedAt: serverTimestamp(),
        });
      }
    }),
  );
}

async function claimGovProject(uid, projectId) {
  const { doc, runTransaction } = fbFs;
  const ref = doc(db, 'players', uid, 'projects', projectId);
  return withAuthRetry(() =>
    runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      const d = snap.data();
      if (!d || d.claimed || (d.status !== 'done' && d.status !== 'failed')) return null;
      tx.update(ref, { claimed: true });
      return d.status;
    }),
  );
}

function normalizeProject(id, raw, fallbackNowMs = Date.now(), isPending = false) {
  const type = raw.type || 'school';
  const def = GX_PROJECT_TYPES[type] || GX_PROJECT_TYPES.school;
  const parsedSt = timestampToMs(raw.startedAt);
  const st = !isPending && parsedSt > 0 ? parsedSt : fallbackNowMs;
  return {
    id,
    uid: String(raw.uid || ''),
    type,
    t: def,
    paid: Math.max(1, Math.min(PROJECT_STAGES, Math.floor(Number(raw.paid) || 1))),
    progressMs: Math.max(0, Number(raw.progressMs) || 0),
    status: raw.status || 'active',
    claimed: Boolean(raw.claimed),
    st,
    dl: st + def.dl * 60000,
    rs: timestampToMs(raw.resolvedAt),
    pending: isPending,
  };
}

const SVG_NS = 'http://www.w3.org/2000/svg';

function setStyleProp(node, prop, val) {
  if (val == null || val === false) return;
  if (prop.startsWith('--')) {
    node.style.setProperty(prop, String(val));
  } else {
    node.style[prop] = typeof val === 'number' && !/^(opacity|zIndex|fontWeight|lineHeight|flexGrow|flexShrink|order)$/.test(prop)
      ? `${val}px`
      : String(val);
  }
}

function appendChildSafe(parent, child) {
  if (child == null || child === false || child === true) return;
  if (Array.isArray(child)) {
    for (const c of child) appendChildSafe(parent, c);
    return;
  }
  if (child instanceof Node) {
    parent.appendChild(child);
  } else {
    parent.appendChild(document.createTextNode(String(child)));
  }
}

function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'className' || k === 'class') {
        if (v) node.className = String(v);
      } else if (k === 'style' && typeof v === 'object') {
        for (const [sk, sv] of Object.entries(v)) setStyleProp(node, sk, sv);
      } else if (k === 'dataset' && typeof v === 'object') {
        for (const [dk, dv] of Object.entries(v)) {
          if (dv != null) node.dataset[dk] = String(dv);
        }
      } else if (k.startsWith('on') && typeof v === 'function') {
        node.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'disabled' || k === 'required' || k === 'checked' || k === 'open') {
        node[k] = Boolean(v);
      } else if (k === 'value') {
        node.value = String(v);
      } else if (v === true) {
        node.setAttribute(k, '');
      } else {
        node.setAttribute(k, String(v));
      }
    }
  }
  for (const c of children) appendChildSafe(node, c);
  return node;
}

function svgEl(tag, attrs, ...children) {
  const node = document.createElementNS(SVG_NS, tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'className' || k === 'class') {
        if (v) node.setAttribute('class', String(v));
      } else if (k === 'style' && typeof v === 'object') {
        for (const [sk, sv] of Object.entries(v)) setStyleProp(node, sk, sv);
      } else {
        node.setAttribute(k, String(v));
      }
    }
  }
  for (const c of children) appendChildSafe(node, c);
  return node;
}

function lucideEl(name, opts = {}) {
  const size = opts.size ?? 18;
  const strokeWidth = opts.strokeWidth ?? 2;
  const color = opts.color ?? 'currentColor';
  const attrs = {
    width: size,
    height: size,
    viewBox: '0 0 24 24',
    fill: 'none',
    stroke: color,
    'stroke-width': strokeWidth,
    'stroke-linecap': 'round',
    'stroke-linejoin': 'round',
    'aria-hidden': 'true',
  };
  if (opts.className) attrs.className = opts.className;
  if (opts.style) attrs.style = opts.style;
  const nodes = LUCIDE_NODES[name] || [];
  return svgEl(
    'svg',
    attrs,
    ...nodes.map(([childTag, childAttrs]) => svgEl(childTag, childAttrs)),
  );
}

  ];
  if (rank <= 3) {
    children.push(svgEl('path', {
      d: 'M11 18l5-6.5L21 18l-5 3.2L11 18z',
      fill: color, stroke: '#fff', 'stroke-opacity': '0.55', 'stroke-width': '1', 'stroke-linejoin': 'round',
    }));
  } else if (rank <= 6) {
    children.push(svgEl('path', {
      d: 'M16 9l2.1 4.2 4.6.7-3.3 3.2.8 4.6-4.2-2.2-4.2 2.2.8-4.6-3.3-3.2 4.6-.7L16 9z',
      fill: color, stroke: '#fff', 'stroke-opacity': '0.6', 'stroke-width': '0.9', 'stroke-linejoin': 'round',
    }));
  } else if (rank <= 9) {
    children.push(
      svgEl('circle', { cx: '16', cy: '15.5', r: '5', fill: color, 'fill-opacity': '0.3', stroke: color, 'stroke-width': '1.6' }),
      svgEl('path', { d: 'M16 10.5v10M11 15.5h10', stroke: '#fff', 'stroke-width': '1.4', 'stroke-linecap': 'round' }),
    );
  } else {
    children.push(svgEl('path', {
      d: 'M9.5 19.5l1.5-7 3.5 3 1.5-5 1.5 5 3.5-3 1.5 7h-13z',
      fill: color, stroke: '#fff', 'stroke-width': '1.2', 'stroke-linejoin': 'round',
    }));
  }
  return svgEl(
    'svg',
    { width: size, height: size, viewBox: '0 0 32 32', fill: 'none', className, 'aria-label': def.n },
    ...children,
  );
}

const failedFlagUrls = new Set();

function countryFlagEl(code, alt, opts = {}) {
  const large = Boolean(opts.large);
  const className = opts.className !== undefined ? opts.className : 'flagimg';
  const clean = sanitizeCountryCode(code);
  const src = clean ? (large ? flagLargeUrl(clean) : flagUrl(clean)) : '';

  const makeFallback = () =>
    h(
      'span',
      {
        className,
        title: alt || clean || 'Nation',
        style: {
          display: 'grid',
          placeItems: 'center',
          background: 'linear-gradient(135deg, #3b3180, #231a54)',
          color: '#d9d0ff',
          fontSize: '10px',
          fontWeight: '700',
          letterSpacing: '0.04em',
        },
      },
      clean || lucideEl('Globe', { size: 14 }),
    );

  if (!src || failedFlagUrls.has(src)) {
    return makeFallback();
  }

  const img = h('img', {
    className,
    src,
    alt: alt || clean,
    referrerPolicy: 'no-referrer',
  });
  img.addEventListener('error', () => {
    failedFlagUrls.add(src);
    if (img.parentNode) img.replaceWith(makeFallback());
  });
  return img;
}

// =========================================================================
// CITY3D CONTROLLER (PERSISTENT ISOMETRIC 3D CITY)
// =========================================================================
const CSZ = {
  farm: 32, solar: 32, water: 28, stadium: 32, airport: 34, port: 30, rail: 30, mine: 28,
  hosp: 24, univ: 26, pow: 26, fact: 28, tech: 22, bank: 22, data: 22, space: 20,
  hydro: 28, stock: 24, evplant: 28, fusion: 24,
  transit: 28, semicon: 24, logistics: 30, quantum: 22,
};

const CHM = {
  farm: 0.5, solar: 0.38, water: 0.6, stadium: 0.62, airport: 0.32, port: 0.52, rail: 0.5,
  mine: 0.58, hosp: 0.88, univ: 0.8, pow: 0.9, fact: 0.92, tech: 1.12, bank: 1.2, data: 1.1, space: 1.5,
  hydro: 0.65, stock: 1.15, evplant: 0.95, fusion: 1.45,
  transit: 0.62, semicon: 1.15, logistics: 0.82, quantum: 1.55,
};

const MAX_ACTIVE_PARTICLES = 8;

function formatCityRate(val) {
  if (val >= 1000) return formatNumber(val);
  if (val >= 100) return String(Math.round(val));
  return val.toFixed(1);
}

function createCity3D(onBuildingTap) {
  const drag = { active: false, sx: 0, o0: 0, t0: 0, off: 0 };
  let rotated = false;
  let dragging = false;
  let visible = false;
  let animEnabled = true;
  let lastBurstKey = 0;
  let prevLevels = {};
  let tipTimer = null;
  let coinTimer = null;
  let puffTimer = null;
  let activeParticles = 0;
  const particleTimers = new Set();
  const buildingEls = {};
  let currentState = null;

  const resetBtn = h(
    'button',
    {
      type: 'button',
      className: 'sky-reset',
      title: 'Reset camera angle',
      style: { display: 'none' },
      onClick: (e) => {
        e.stopPropagation();
        drag.off = 0;
        rotated = false;
        resetBtn.style.display = 'none';
        syncCityClass();
        applyRotation(-35);
      },
    },
    lucideEl('RefreshCw', { size: 11 }),
    h('span', null, 'Reset view'),
  );

  const cityEl = h(
    'div',
    { className: 'city sway' },
    h('i', { className: 'road', style: { left: '-124px', top: '-1px', width: '248px', height: '2px' } }),
    h('i', { className: 'road', style: { left: '-124px', top: '-43px', width: '248px', height: '2px' } }),
    h('i', { className: 'road', style: { left: '-124px', top: '41px', width: '248px', height: '2px' } }),
    h('i', { className: 'road', style: { top: '-108px', left: '21px', width: '2px', height: '216px' } }),
    h('i', { className: 'car', style: { left: '0px', top: '-2px', animation: 'carx 5.5s linear infinite' } }),
    h('i', { className: 'car cb', style: { left: '0px', top: '-44px', animation: 'carx 7.5s linear infinite reverse' } }),
    h('i', { className: 'car', style: { left: '22px', top: '0px', width: '4px', height: '8px', animation: 'cary 6.5s linear infinite' } }),
  );

  const totalRows = Math.ceil(BUILDINGS.length / 5);
  const gap = totalRows > 4 ? 38 : 42;

  BUILDINGS.forEach((d, i) => {
    const col = i % 5;
    const row = Math.floor(i / 5);
    const sz = CSZ[d.id] || 26;
    const cx = (col - 2) * gap;
    const cy = (row - (totalRows - 1) / 2) * gap;
    const x = Math.round(cx - sz / 2);
    const y = Math.round(cy - sz / 2);
    const em3 = h('b', { className: 'em3', style: { display: 'none' } }, buildingIconEl(d.id, 13, '#fff'));
    const bd = h(
      'div',
      {
        className: 'bd empty',
        dataset: { id: d.id },
        style: {
          '--x': `${x}px`,
          '--y': `${y}px`,
          '--s': `${sz}px`,
          '--h': '2px',
          '--c': d.c,
          '--i': String(i),
        },
      },
      h('i', { className: 'fT' }),
      h('i', { className: 'fS' }),
      h('i', { className: 'fN' }),
      h('i', { className: 'fE' }),
      h('i', { className: 'fW' }),
      em3,
    );
    bd._em3 = em3;
    buildingEls[d.id] = bd;
    cityEl.appendChild(bd);
  });

  const tipEl = h('div', { className: 'ctip', style: { left: '0px', top: '0px' } });
  const dimHintEl = h(
    'span',
    { className: 'dim-hint' },
    lucideEl('Hammer', { size: 13, color: '#ffc23d' }),
    h('span', null, 'Build your first farm below'),
  );

  const skyEl = h(
    'div',
    { className: 'sky', 'data-testid': 'city-3d' },
    resetBtn,
    cityEl,
    tipEl,
    dimHintEl,
  );

  function applyRotation(rz) {
    cityEl.style.setProperty('--rz', `${rz}deg`);
  }

  function syncCityClass() {
    cityEl.className = `city${animEnabled && !dragging && !rotated ? ' sway' : ''}`;
  }

  function spawnParticle(cls, bEl, text) {
    if (!bEl || activeParticles >= MAX_ACTIVE_PARTICLES) return;
    const k = document.createElement('b');
    k.className = cls;
    if (text) k.textContent = text;
    k.style.setProperty('--x', bEl.style.getPropertyValue('--x'));
    k.style.setProperty('--y', bEl.style.getPropertyValue('--y'));
    k.style.setProperty('--s', bEl.style.getPropertyValue('--s'));
    const ht = parseInt(bEl.style.getPropertyValue('--h') || '10', 10);
    k.style.setProperty('--z0', `${ht + 14}px`);
    cityEl.appendChild(k);
    activeParticles += 1;
    const tid = window.setTimeout(() => {
      particleTimers.delete(tid);
      k.remove();
      activeParticles = Math.max(0, activeParticles - 1);
    }, 2000);
    particleTimers.add(tid);
  }

  function syncIntervals() {
    if (coinTimer) {
      window.clearInterval(coinTimer);
      coinTimer = null;
    }
    if (puffTimer) {
      window.clearInterval(puffTimer);
      puffTimer = null;
    }
    if (!visible || !animEnabled) return;
    coinTimer = window.setInterval(() => {
      if (document.hidden || !currentState || document.body.classList.contains('modal-open')) return;
      const activeIds = Object.keys(currentState.b).filter((id) => (currentState.b[id] || 0) > 0);
      if (!activeIds.length) return;
      const pickId = activeIds[Math.floor(Math.random() * activeIds.length)];
      spawnParticle('coin', buildingEls[pickId] || null, '₨');
    }, 2200);
    puffTimer = window.setInterval(() => {
      if (document.hidden || !currentState || document.body.classList.contains('modal-open')) return;
      const emitterIds = ['fact', 'pow', 'mine'].filter((id) => (currentState.b[id] || 0) > 0);
      if (!emitterIds.length) return;
      const pickId = emitterIds[Math.floor(Math.random() * emitterIds.length)];
      if (Math.random() < 0.7) {
        spawnParticle('puff', buildingEls[pickId] || null);
      }
    }, 1500);
  }

  skyEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.sky-reset')) return;
    drag.active = true;
    drag.sx = e.clientX;
    drag.t0 = Date.now();
    drag.o0 = drag.off;
    dragging = true;
    syncCityClass();
    try {
      skyEl.setPointerCapture(e.pointerId);
    } catch {
      // ignore
    }
  });

  skyEl.addEventListener('pointermove', (e) => {
    if (!drag.active) return;
    drag.off = drag.o0 + (e.clientX - drag.sx) * 0.6;
    if (Math.abs(drag.off) > 4 && !rotated) {
      rotated = true;
      resetBtn.style.display = '';
      syncCityClass();
    }
    applyRotation(-35 + drag.off);
  });

  const onPointerEnd = (e) => {
    if (!drag.active) return;
    drag.active = false;
    dragging = false;
    syncCityClass();
    if (e.type !== 'pointerup' || Math.abs(e.clientX - drag.sx) > 7 || Date.now() - drag.t0 > 450) {
      return;
    }
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const b = el?.closest('.bd');
    if (!b || !currentState) return;
    const id = b.dataset.id;
    const def = BUILDINGS.find((x) => x.id === id);
    if (!def) return;
    const lvl = currentState.b[def.id] || 0;

    b.classList.remove('pop');
    requestAnimationFrame(() => b.classList.add('pop'));
    onBuildingTap(e.clientX, e.clientY);

    const r = skyEl.getBoundingClientRect();
    const mult = gxLevelMult(currentState, def.id);
    const text = `${def.n} · Lv ${lvl}${lvl ? ` · +${formatCityRate(def.inc * lvl * mult)}/s` : ' · not built'}`;
    tipEl.replaceChildren(
      buildingIconEl(def.id, 14, '#ffc23d'),
      h('span', null, text),
    );
    tipEl.style.left = `${Math.max(85, Math.min(r.width - 85, e.clientX - r.left))}px`;
    tipEl.style.top = `${Math.max(44, e.clientY - r.top)}px`;
    tipEl.classList.add('on');
    if (tipTimer) window.clearTimeout(tipTimer);
    tipTimer = window.setTimeout(() => {
      tipEl.classList.remove('on');
    }, 2200);
  };

  skyEl.addEventListener('pointerup', onPointerEnd);
  skyEl.addEventListener('pointercancel', onPointerEnd);

  return {
    el: skyEl,
    update(state, nextVisible, nextBurstKey) {
      currentState = state;
      const nextAnim = !!state.set.anim;
      const visChanged = visible !== nextVisible;
      const animChanged = animEnabled !== nextAnim;
      visible = nextVisible;
      animEnabled = nextAnim;
      skyEl.style.display = visible ? '' : 'none';

      if (visChanged || animChanged) {
        syncCityClass();
        applyRotation(-35 + drag.off);
        syncIntervals();
      }

      if (nextBurstKey > lastBurstKey) {
        lastBurstKey = nextBurstKey;
        if (visible && animEnabled) {
          const activeIds = Object.keys(state.b).filter((id) => (state.b[id] || 0) > 0).slice(0, 6);
          activeIds.forEach((id, idx) => {
            window.setTimeout(() => {
              spawnParticle('coin', buildingEls[id] || null, '₨');
            }, idx * 70);
          });
        }
      }

      const newlyBuilt = [];
      const nextPrev = {};
      for (const d of BUILDINGS) {
        const l = state.b[d.id] || 0;
        nextPrev[d.id] = l;
        if (prevLevels[d.id] !== undefined && l > prevLevels[d.id]) {
          newlyBuilt.push(d.id);
        }
        const bd = buildingEls[d.id];
        const ht = l ? Math.max(8, Math.round((8 + Math.min(l, 40) * 2.6) * (CHM[d.id] || 0.8))) : 2;
        bd.style.setProperty('--h', `${ht}px`);
        bd.classList.toggle('empty', !l);
        bd.classList.toggle('tall', ht > 62);
        bd._em3.style.display = l > 0 ? '' : 'none';
      }
      prevLevels = nextPrev;

      if (newlyBuilt.length > 0) {
        for (const id of newlyBuilt) buildingEls[id]?.classList.add('up');
        window.setTimeout(() => {
          for (const id of newlyBuilt) buildingEls[id]?.classList.remove('up');
        }, 850);
      }

      dimHintEl.style.display = totalBuildings(state) === 0 ? '' : 'none';
    },
  };
}

// GDP CHART CONTROLLER (CANVAS + HOVER CROSSHAIR + RANGE BUTTONS)
// =========================================================================
const CHART_SLICES = [12, 36, 60];

function createGdpChart() {
  let rangeIdx = 2;
  let hoverIdx = null;
  let lastHistory = [];
  let lastCurrentGdp = 0;

  const valEl = h('div', { className: 'gdpc-v' }, '₨ 0');
  const deltaIconEl = h('i', null, '▲ +0.0%');
  const deltaSpanEl = h('span', null, 'vs session start');
  const deltaEl = h('div', { className: 'gdpc-d up' }, deltaIconEl, deltaSpanEl);
  const canvasEl = h('canvas', { height: '220' });
  const emptyMsgEl = h('p', { className: 'dim gdpc-m' }, 'Collecting data. Your first points appear in a few seconds.');
  const rangeBtns = ['1 min', '3 min', '5 min'].map((lbl, idx) =>
    h(
      'button',
      {
        type: 'button',
        className: idx === rangeIdx ? 'on' : '',
        onClick: () => {
          rangeIdx = idx;
          hoverIdx = null;
          rangeBtns.forEach((b, bi) => {
            b.className = bi === rangeIdx ? 'on' : '';
          });
          draw();
        },
      },
      lbl,
    ),
  );

  const root = h(
    'div',
    { className: 'gdpc' },
    h('div', { className: 'gdpc-h' }, h('span', { className: 'gdpc-ic' }, lucideEl('TrendingUp', { size: 15 })), 'GDP history'),
    valEl,
    deltaEl,
    h('div', { className: 'gdpc-cv' }, canvasEl, emptyMsgEl),
    h('div', { className: 'gdpc-r' }, ...rangeBtns),
  );

  function draw() {
    const sliceLen = CHART_SLICES[rangeIdx];
    const slice = lastHistory.slice(-sliceLen);
    const hasData = slice.length >= 2;
    const first = hasData ? slice[0] : lastCurrentGdp;
    const last = hasData ? slice[slice.length - 1] : lastCurrentGdp;
    const pct = first ? ((last - first) / first) * 100 : 0;

    valEl.textContent = `₨ ${formatNumber(last)}`;
    deltaEl.className = `gdpc-d ${pct >= 0 ? 'up' : 'dn'}`;
    deltaIconEl.textContent = `${pct >= 0 ? '▲ +' : '▼ '}${pct.toFixed(1)}%`;
    deltaSpanEl.textContent = `vs ${['1 min ago', '3 min ago', 'session start'][rangeIdx]}`;
    emptyMsgEl.style.display = hasData ? 'none' : '';

    if (!hasData) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1.5);
    const W = canvasEl.clientWidth || 320;
    const H = 220;
    const targetW = Math.round(W * dpr);
    const targetH = Math.round(H * dpr);
    if (canvasEl.width !== targetW || canvasEl.height !== targetH) {
      canvasEl.width = targetW;
      canvasEl.height = targetH;
    }
    const ctx = canvasEl.getContext('2d');
    if (!ctx) return;

    const pl = 8 * dpr;
    const pr = 8 * dpr;
    const pt = 50 * dpr;
    const pb = 10 * dpr;
    const w = canvasEl.width;
    const ht = canvasEl.height;
    const lo = Math.min(...slice);
    const hi = Math.max(...slice);
    const sp = hi - lo || Math.max(1, hi * 0.02);
    const mn = lo - sp * 0.12;
    const mx = hi + sp * 0.12;
    const n = slice.length;

    const X = (i) => pl + (i / (n - 1)) * (w - pl - pr);
    const Y = (v) => pt + (1 - (v - mn) / (mx - mn)) * (ht - pt - pb);

    const drawPath = () => {
      ctx.beginPath();
      ctx.moveTo(X(0), Y(slice[0]));
      for (let i = 1; i < n; i++) {
        ctx.quadraticCurveTo(X(i - 1), Y(slice[i - 1]), (X(i - 1) + X(i)) / 2, (Y(slice[i - 1]) + Y(slice[i])) / 2);
      }
      ctx.lineTo(X(n - 1), Y(slice[n - 1]));
    };

    const s = hoverIdx != null ? Math.max(0, Math.min(n - 1, hoverIdx)) : n - 1;
    ctx.clearRect(0, 0, w, ht);
    const px = X(s);
    const py = Y(slice[s]);
    const bw = Math.max(22 * dpr, ((w - pl - pr) / (n - 1)) * 2);

    let g = ctx.createLinearGradient(0, py, 0, ht);
    g.addColorStop(0, 'rgba(255,160,50,.30)');
    g.addColorStop(1, 'rgba(255,160,50,.04)');
    ctx.fillStyle = g;
    ctx.fillRect(px - bw / 2, py, bw, ht - py);

    drawPath();
    ctx.lineTo(X(n - 1), ht);
    ctx.lineTo(X(0), ht);
    ctx.closePath();
    g = ctx.createLinearGradient(0, pt, 0, ht);
    g.addColorStop(0, 'rgba(255,177,61,.32)');
    g.addColorStop(1, 'rgba(255,177,61,0)');
    ctx.fillStyle = g;
    ctx.fill();

    ctx.setLineDash([5 * dpr, 5 * dpr]);
    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.lineWidth = dpr;
    ctx.beginPath();
    ctx.moveTo(0, py);
    ctx.lineTo(w, py);
    ctx.stroke();
    ctx.setLineDash([]);

    drawPath();
    ctx.strokeStyle = '#ffb13d';
    ctx.lineWidth = 2.2 * dpr;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,138,31,.3)';
    ctx.beginPath();
    ctx.arc(px, py, 9 * dpr, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff8a1f';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2 * dpr;
    ctx.beginPath();
    ctx.arc(px, py, 5 * dpr, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    const label = `₨ ${formatNumber(slice[s])}`;
    ctx.font = `700 ${12 * dpr}px Outfit, system-ui, sans-serif`;
    const tw = ctx.measureText(label).width + 20 * dpr;
    const th = 26 * dpr;
    const bx = Math.min(w - tw - 4 * dpr, Math.max(4 * dpr, px - tw / 2));
    let by = py - th - 14 * dpr;
    if (by < 2 * dpr) by = py + 16 * dpr;

    ctx.fillStyle = '#ff8a1f';
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') {
      ctx.roundRect(bx, by, tw, th, 8 * dpr);
    } else {
      ctx.rect(bx, by, tw, th);
    }
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + tw / 2, by + th / 2 + 0.5 * dpr);
  }

  const onPtr = (e) => {
    const slice = lastHistory.slice(-CHART_SLICES[rangeIdx]);
    if (slice.length < 2) return;
    const r = canvasEl.getBoundingClientRect();
    hoverIdx = Math.max(0, Math.min(slice.length - 1, Math.round(((e.clientX - r.left) / r.width) * (slice.length - 1))));
    draw();
  };
  canvasEl.addEventListener('pointermove', onPtr);
  canvasEl.addEventListener('pointerdown', onPtr);
  canvasEl.addEventListener('pointerleave', () => {
    hoverIdx = null;
    draw();
  });
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => draw());
    ro.observe(canvasEl);
  }

  return {
    el: root,
    update(history, currentGdp) {
      lastHistory = Array.isArray(history) ? history : [];
      lastCurrentGdp = currentGdp || 0;
      draw();
    },
  };
}

function formatDuration(ms) {
  if (ms <= 0) return '0s';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const hr = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (d) return `${d}d ${hr}h`;
  if (hr) return `${hr}h ${m}m`;
  if (m) return `${m}m ${s % 60}s`;
  return `${s}s`;
}

function conditionColor(c) {
  return c >= 70 ? '#3fe0b0' : c >= 40 ? '#ffc23d' : '#ff6fa5';
}

function formatSubRemaining(ms) {
  if (ms <= 0) return 'Expired';
  const totalMin = Math.floor(ms / 60000);
  const d = Math.floor(totalMin / 1440);
  const hr = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (d > 0) return `${d}d ${hr}h`;
  if (hr > 0) return `${hr}h ${m}m`;
  return `${m}m`;
}

function createBuildTab(handlers) {
  let cat = 'all';
  let qty = 1;
  let lastState = null;
  let lastOffset = 0;

  const discValueB = h('b', { className: 'ok' }, '');
  const discBanner = h(
    'div',
    { className: 'tradelim', style: { display: 'none' } },
    h('span', null, lucideEl('Sparkles', { size: 14, color: '#3fe0b0' }), ' Subscription Development Discount'),
    discValueB,
  );

  const CATEGORIES = [
    { id: 'all', label: 'All' },
    { id: 'industry', label: 'Industry' },
    { id: 'civic', label: 'Civic & Clean' },
    { id: 'tech', label: 'Tech & Finance' },
  ];
  const catBtns = {};
  const fchips = h(
    'div',
    { className: 'fchips', role: 'group', 'aria-label': 'Filter buildings by category' },
    ...CATEGORIES.map((c) => {
      const btn = h(
        'button',
        {
          type: 'button',
          className: `fchip ${cat === c.id ? 'on' : ''}`,
          onClick: () => {
            cat = c.id;
            syncCatButtons();
            rebuildRows();
            if (lastState) updateRows(lastState, lastOffset);
          },
        },
        c.label,
      );
      catBtns[c.id] = btn;
      return btn;
    }),
  );

  const qty1Btn = h('button', { type: 'button', className: 'on', onClick: () => setQty(1) }, '×1');
  const qty5Btn = h('button', { type: 'button', className: '', onClick: () => setQty(5) }, '×5');

  function setQty(nextQty) {
    qty = nextQty;
    qty1Btn.className = qty === 1 ? 'on' : '';
    qty5Btn.className = qty === 5 ? 'on' : '';
    if (lastState) updateRows(lastState, lastOffset);
  }

  function syncCatButtons() {
    for (const [id, btn] of Object.entries(catBtns)) {
      btn.className = `fchip ${cat === id ? 'on' : ''}`;
    }
  }

  const listEl = h('div', { className: 'list g2' });
  const rowRefs = {};

  function rebuildRows() {
    const visible = cat === 'all' ? BUILDINGS : BUILDINGS.filter((b) => b.cat === cat);
    const nodes = [];
    for (const d of visible) {
      if (!rowRefs[d.id]) {
        const lvSpan = h('span', { className: 'lv' }, 'Lv 0');
        const recSpan = h('span', { className: 'rec-badge', style: { display: 'none' } });
        const descP = h('p', null, '');
        const btnLabel = h('span', null, '');
        const buyBtn = h(
          'button',
          {
            type: 'button',
            className: 'btn sm no',
            onClick: (e) => handlers.onBuyBuilding(d.id, qty, e),
          },
          cashCoinEl(15),
          btnLabel,
        );
        const row = h(
          'div',
          { className: 'row', style: { '--c': d.c } },
          h('div', { className: 'em' }, buildingIconEl(d.id, 23)),
          h('div', null, h('h2', null, d.n, lvSpan, recSpan), descP),
          buyBtn,
        );
        rowRefs[d.id] = { d, row, lvSpan, recSpan, descP, buyBtn, btnLabel, lastRec: '' };
      }
      nodes.push(rowRefs[d.id].row);
    }
    listEl.replaceChildren(...nodes);
  }

  function updateRows(state, serverOffsetMs = 0) {
    const nowSrv = (state.t || Date.now()) + serverOffsetMs;
    const disc = getDevelopmentDiscount(state, nowSrv);
    if (disc > 0) {
      discBanner.style.display = '';
      discValueB.textContent = `−${Math.round(disc * 100)}% build cost`;
    } else {
      discBanner.style.display = 'none';
    }

    const recMap = getRecommendedBuildings(state, qty, nowSrv);
    const visible = cat === 'all' ? BUILDINGS : BUILDINGS.filter((b) => b.cat === cat);
    for (const d of visible) {
      const r = rowRefs[d.id];
      if (!r) continue;
      const count = state.b[d.id] || 0;
      const c = bulkBuildingCost(d, count, qty, disc);
      const upgLvl = state.gx?.lvl?.[d.id] || 1;
      const upgMult = GX_LEVEL_MULTS[upgLvl - 1] || 1;
      const canAfford = state.cash >= c;
      const recReason = recMap[d.id] || '';

      r.row.className = `row${recReason ? ' rec-card' : ''}`;
      r.lvSpan.textContent = `Lv ${count}`;
      if (recReason !== r.lastRec) {
        r.lastRec = recReason;
        if (recReason) {
          r.recSpan.style.display = '';
          r.recSpan.replaceChildren(lucideEl('Sparkles', { size: 10 }), h('span', null, `Recommended · ${recReason}`));
        } else {
          r.recSpan.style.display = 'none';
        }
      }
      const rate = d.inc * upgMult;
      const rateStr = rate >= 1000 ? formatNumber(rate) : rate >= 100 ? String(Math.round(rate)) : rate.toFixed(2);
      r.descP.textContent = `${d.d} · +${rateStr}/s each${upgLvl > 1 ? ` (×${upgMult})` : ''}`;
      r.buyBtn.className = `btn sm ${canAfford ? 'mint' : 'no'}`;
      r.buyBtn.disabled = !canAfford;
      r.btnLabel.textContent = `${qty > 1 ? `×${qty} ` : ''}₨ ${formatNumber(c)}`;
    }
  }

  rebuildRows();

  const root = h(
    'div',
    null,
    discBanner,
    h(
      'div',
      { className: 'filterbar' },
      fchips,
      h('div', { className: 'qty-toggle', role: 'group', 'aria-label': 'Build quantity' }, qty1Btn, qty5Btn),
    ),
    listEl,
  );

  return {
    el: root,
    update(state, serverOffsetMs = 0) {
      lastState = state;
      lastOffset = serverOffsetMs;
      updateRows(state, serverOffsetMs);
    },
  };
}

function createGovtTab(handlers) {
