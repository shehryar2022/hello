function createOnboardingModal(handlers) {
  let wasOpen = false;
  let username = '';
  let countryCode = COUNTRIES[0][0];
  let status = null;
  let busy = false;
  let checkTimer = null;
  let checkSeq = 0;

  const inputEl = h('input', {
    className: 'inp',
    maxLength: '16',
    placeholder: 'Username (e.g. Pak_Tycoon)',
    value: '',
    required: true,
    onInput: (e) => {
      username = e.target.value;
      scheduleUsernameCheck();
      syncView();
    },
  });

  const statusP = h('p', { style: { fontSize: '12px', margin: '0 0 8px', display: 'none' } }, '');
  const submitBtn = h('button', { type: 'submit', className: 'btn gold', disabled: true }, 'Start Ruling');
  const countryBtns = {};

  const cpick = h(
    'div',
    { className: 'cpick' },
    ...COUNTRIES.map(([code, name]) => {
      const btn = h(
        'button',
        {
          type: 'button',
          className: countryCode === code ? 'on' : '',
          onClick: () => {
            countryCode = code;
            syncView();
          },
        },
        countryFlagEl(code, code, { className: '' }),
        h('span', null, name),
      );
      countryBtns[code] = btn;
      return btn;
    }),
  );

  function scheduleUsernameCheck() {
    if (checkTimer) {
      window.clearTimeout(checkTimer);
      checkTimer = null;
    }
    const trimmed = username.trim();
    const mySeq = ++checkSeq;
    if (trimmed.length < 3) {
      status = trimmed ? { msg: 'Min 3 characters (letters, numbers, _)', ok: false } : null;
      return;
    }
    if (!/^[A-Za-z0-9_]{3,16}$/.test(trimmed)) {
      status = { msg: 'Only letters, numbers, and _ (3-16 chars)', ok: false };
      return;
    }
    checkTimer = window.setTimeout(async () => {
      checkTimer = null;
      try {
        const res = await handlers.onCheckUsername(trimmed);
        if (mySeq !== checkSeq) return;
        status = {
          msg: res.available ? 'Username available' : res.reason || 'Already taken',
          ok: Boolean(res.available),
        };
      } catch {
        if (mySeq !== checkSeq) return;
        status = null;
      }
      syncView();
    }, 300);
  }

  function syncView() {
    if (status) {
      statusP.style.display = '';
      statusP.className = status.ok ? 'ok' : 'bad';
      statusP.textContent = status.msg;
    } else {
      statusP.style.display = 'none';
      statusP.textContent = '';
    }
    for (const [code, btn] of Object.entries(countryBtns)) {
      btn.className = countryCode === code ? 'on' : '';
    }
    submitBtn.disabled = busy || !status?.ok;
    submitBtn.textContent = busy ? 'Creating…' : 'Start Ruling';
  }

  const formEl = h(
    'form',
    {
      onSubmit: async (e) => {
        e.preventDefault();
        if (busy) return;
        busy = true;
        syncView();
        try {
          await handlers.onSubmitProfile(username.trim(), countryCode);
        } finally {
          busy = false;
          syncView();
        }
      },
    },
    inputEl,
    statusP,
    cpick,
    h(
      'div',
      { className: 'acts', style: { marginTop: '10px' } },
      submitBtn,
      h('button', { type: 'button', className: 'lnk', onClick: () => handlers.onSignOut() }, 'Cancel & Sign out'),
    ),
  );

  const root = h(
    'div',
    { className: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Create Country', style: { display: 'none' } },
    h(
      'div',
      { className: 'card' },
      h('h2', null, lucideEl('Landmark', { size: 20, color: '#ffc23d' }), h('span', null, 'Establish Your Country')),
      h('p', null, 'Pick a unique leader username and national flag.'),
      formEl,
    ),
  );

  return {
    el: root,
    update(open, defaultCountryCode) {
      if (!open) {
        if (wasOpen) {
          wasOpen = false;
          if (checkTimer) {
            window.clearTimeout(checkTimer);
            checkTimer = null;
          }
          checkSeq += 1;
          username = '';
          inputEl.value = '';
          status = null;
          busy = false;
          root.style.display = 'none';
        }
        return;
      }
      if (!wasOpen) {
        wasOpen = true;
        countryCode = defaultCountryCode || COUNTRIES[0][0];
        root.style.display = '';
        syncView();
      }
    },
  };
}

function createDialogModal(handlers) {
  let lastDialogRef = null;
  const root = h('div', {
    className: 'modal',
    role: 'dialog',
    'aria-modal': 'true',
    style: { display: 'none' },
    onClick: () => handlers.onClose(),
  });

  return {
    el: root,
    update(dialog) {
      if (!dialog) {
        if (lastDialogRef !== null) {
          lastDialogRef = null;
          root.style.display = 'none';
          root.replaceChildren();
        }
        return;
      }
      if (dialog === lastDialogRef) return;
      lastDialogRef = dialog;
      root.style.display = '';

      const card = h(
        'div',
        { className: 'card', onClick: (e) => e.stopPropagation() },
        h('h2', null, dialog.title),
        h('div', { style: { margin: '10px 0 16px' } }, dialog.body),
        h(
          'div',
          { className: 'acts' },
          ...dialog.actions.map((a) =>
            h(
              'button',
              {
                type: 'button',
                className: `btn ${a.variant || ''}`,
                onClick: () => a.onClick(),
              },
              a.label,
            ),
          ),
        ),
      );
      root.replaceChildren(card);
    },
  };
}

function createGiftTableModal(handlers) {
  const SLOTS_MAX = 16;
  let lastSessionKey = '';
  let curParams = null;

  let cash = 0;
  let gems = 0;
  let stk = {};
  let message = '';
  let confirming = false;
  let busy = false;

  const root = h('div', {
    id: 'tov',
    role: 'dialog',
    'aria-modal': 'true',
    'aria-label': 'Gift Table',
    style: { display: 'none' },
    onClick: () => handlers.onClose(),
  });

  // Persistent DOM elements for smooth live updates without losing input focus
  const titleSpan = h('span', null, '');
  const reviewTag = h('span', { className: 'tag', style: { display: 'none' } }, '');
  const peerFlagSlot = h('div', { className: 'tr-flag' });
  const peerLabelEl = h('div', { className: 'tr-label' }, '');
  const peerNameEl = h('div', { className: 'tr-name' }, '');
  const peerBalEl = h('div', { className: 'tr-bal' }, '');

  const myFlagSlot = h('div', { className: 'ty-flag' });
  const myNameEl = h('div', { className: 'ty-nm' }, '');
  const myCashB = h('b', null, '₨ 0');
  const myGemsB = h('b', null, gemDiamondEl(13), ' 0');
  const youSection = h(
    'div',
    { className: 'ttyou' },
    myFlagSlot,
    h(
      'div',
      { className: 'ty-meta' },
      myNameEl,
      h('div', { className: 'ty-bal' }, h('span', null, 'Balance:'), myCashB, h('span', null, '·'), myGemsB),
    ),
  );

  const giftTitleH3 = h('h3', null, '');
  const slotsCountSmall = h('small', null, '0/16 slots');
  const payTotalLbl = h('div', { className: 'lbl' }, '');
  const payTotalVal = h('div', { id: 'tt-pay-total', className: 'amt empty' }, 'Nothing added yet');
  const slotsGrid = h('div', { className: 'slots' });

  const cashInput = h('input', {
    type: 'number',
    min: '0',
    className: 'inp',
    placeholder: 'Cash ₨',
    value: '',
    onInput: (e) => {
      if (!curParams) return;
      const maxCash = Math.max(0, Math.min(1e12, Math.floor(curParams.state.cash)));
      const n = Math.floor(Number(e.target.value) || 0);
      cash = Math.max(0, Math.min(maxCash, n));
      syncModalContents();
    },
  });

  const gemsInput = h('input', {
    type: 'number',
    min: '0',
    className: 'inp',
    placeholder: 'Diamonds',
    value: '',
    onInput: (e) => {
      if (!curParams) return;
      const maxGems = Math.max(0, Math.min(1e9, Math.floor(curParams.state.gems)));
      const n = Math.floor(Number(e.target.value) || 0);
      gems = Math.max(0, Math.min(maxGems, n));
      syncModalContents();
    },
  });

  const stkPickSlot = h('div', { className: 'stkpick', style: { display: 'none' } });
  const noteInput = h('input', {
    className: 'inp',
    maxLength: '140',
    placeholder: 'Optional note (max 140 chars)…',
    value: '',
    onInput: (e) => {
      message = e.target.value;
    },
  });

  const composeControls = h(
    'div',
    null,
    h(
      'div',
      { className: 'chips2' },
      h(
        'div',
        { className: 'chiprow' },
        h('button', { type: 'button', onClick: () => adjustCash(10_000) }, '+10K'),
        h('button', { type: 'button', onClick: () => adjustCash(100_000) }, '+100K'),
        h('button', { type: 'button', onClick: () => adjustCash(1_000_000) }, '+1M'),
        h('button', { type: 'button', className: 'max', onClick: () => setMaxCash() }, 'MAX ₨'),
      ),
      h(
        'div',
        { className: 'chiprow' },
        h('button', { type: 'button', onClick: () => adjustGems(1) }, '+1 ', gemDiamondEl(13)),
        h('button', { type: 'button', onClick: () => adjustGems(5) }, '+5 ', gemDiamondEl(13)),
        h('button', { type: 'button', onClick: () => adjustGems(25) }, '+25 ', gemDiamondEl(13)),
        h('button', { type: 'button', className: 'max', onClick: () => setMaxGems() }, 'MAX ', gemDiamondEl(13)),
      ),
    ),
    h('div', { className: 'ttin' }, cashInput, gemsInput),
    stkPickSlot,
    h('div', { className: 'ttmsg' }, noteInput),
  );

  const reviewNoteP = h('p', { className: 'dim', style: { textAlign: 'center', display: 'none' } }, '');
  const footerSlot = h('div');

  const card = h(
    'div',
    { className: 'tt', onClick: (e) => e.stopPropagation() },
    h(
      'div',
      { className: 'ttbar' },
      h('h2', null, lucideEl('Gift', { size: 20, color: '#ffc23d' }), titleSpan),
      reviewTag,
      h('button', { type: 'button', className: 'btn sm', onClick: () => handlers.onClose() }, '✕ Close'),
    ),
    h(
      'div',
      { className: 'ttrcpt' },
      peerFlagSlot,
      h('div', { className: 'tr-info' }, peerLabelEl, peerNameEl, peerBalEl),
    ),
    youSection,
    h(
      'div',
      { className: 'ttgift' },
      h('div', { className: 'ttgift-hdr' }, giftTitleH3, slotsCountSmall),
      h('div', { className: 'ttgift-total' }, payTotalLbl, payTotalVal),
      slotsGrid,
      composeControls,
      reviewNoteP,
    ),
    footerSlot,
  );
  root.appendChild(card);

  function getMaxCash() {
    return curParams ? Math.max(0, Math.min(1e12, Math.floor(curParams.state.cash))) : 0;
  }
  function getMaxGems() {
    return curParams ? Math.max(0, Math.min(1e9, Math.floor(curParams.state.gems))) : 0;
  }
  function adjustCash(delta) {
    cash = Math.min(getMaxCash(), cash + delta);
    syncModalContents();
  }
  function setMaxCash() {
    cash = getMaxCash();
    syncModalContents();
  }
  function adjustGems(delta) {
    gems = Math.min(getMaxGems(), gems + delta);
    syncModalContents();
  }
  function setMaxGems() {
    gems = getMaxGems();
    syncModalContents();
  }

  function getClampedValues() {
    const maxCash = getMaxCash();
    const maxGems = getMaxGems();
    const clampedCash = Math.max(0, Math.min(maxCash, Math.floor(cash)));
    const clampedGems = Math.max(0, Math.min(maxGems, Math.floor(gems)));
    const clampedStk = {};
    if (curParams) {
      for (const [id, count] of Object.entries(stk)) {
        const own = Math.max(0, Math.floor(curParams.state.stk[id] || 0));
        const qty = Math.min(own, Math.max(0, Math.floor(count || 0)));
        if (qty > 0) clampedStk[id] = qty;
      }
    }
    return { maxCash, maxGems, clampedCash, clampedGems, clampedStk };
  }

  async function handleConfirmSend() {
    if (!curParams || !curParams.target || busy) return;
    const { clampedCash, clampedGems, clampedStk } = getClampedValues();
    if (clampedCash + clampedGems + Object.values(clampedStk).reduce((a, b) => a + b, 0) <= 0) {
      confirming = false;
      syncModalContents();
      return;
    }
    busy = true;
    syncModalContents();
    try {
      const ok = await handlers.onSendGift({
        toUid: curParams.target.id,
        offerCash: clampedCash,
        offerGems: clampedGems,
        offerStk: clampedStk,
        message: message.trim().slice(0, 140),
      });
      if (ok) {
        handlers.onClose();
        return;
      }
    } finally {
      busy = false;
      confirming = false;
      syncModalContents();
    }
  }

  let lastStaticMetaKey = '';

  function syncModalContents() {
    if (!curParams) return;
    const { mode, state, uid, myName, myCountryCode, target, trade, serverOffsetMs } = curParams;
    const { maxCash, maxGems, clampedCash, clampedGems, clampedStk } = getClampedValues();

    const effectiveCash = mode === 'review' && trade ? trade.offerCash : clampedCash;
    const effectiveGems = mode === 'review' && trade ? trade.offerGems : clampedGems;
    const effectiveStk = mode === 'review' && trade ? trade.offerStk : clampedStk;

    const traySlots = [];
    if (effectiveCash > 0) traySlots.push({ kind: 'cash', label: 'CASH', qty: formatNumber(effectiveCash) });
    if (effectiveGems > 0) traySlots.push({ kind: 'gems', label: 'GEMS', qty: String(effectiveGems) });
    for (const [id, count] of Object.entries(effectiveStk || {})) {
      if (count > 0 && traySlots.length < SLOTS_MAX) {
        const def = STICKERS.find((s) => s.id === id);
        if (def) {
          traySlots.push({
            kind: 'stk',
            label: def.n.split(' ')[0].toUpperCase(),
            qty: `×${count}`,
            stkId: id,
          });
        }
      }
    }

    const totalParts = [];
    if (effectiveCash > 0) totalParts.push(`₨ ${formatNumber(effectiveCash)}`);
    if (effectiveGems > 0) totalParts.push(`${effectiveGems} Gems`);
    const stkTotal = Object.values(effectiveStk || {}).reduce((a, b) => a + (b || 0), 0);
    if (stkTotal > 0) totalParts.push(`${stkTotal} Stickers`);
    const totalSummary = totalParts.join(' · ');

    const peerName = mode === 'compose' ? target?.username || 'Player' : trade?.from === uid ? trade.toName : trade?.fromName || 'Player';
    const peerCc = mode === 'compose' ? target?.countryCode || '' : trade?.from === uid ? trade.toCountry : trade?.fromCountry || '';
    const peerSub =
      mode === 'compose' && target
        ? `${target.countryName} · GDP ₨ ${formatNumber(target.gdp || 0)}`
        : trade?.from === uid
          ? `Outgoing gift · ${trade.status}`
          : `Incoming gift · ${trade?.status || ''}`;

    const nowSrv = Date.now() + serverOffsetMs;
    const isIncomingPending = mode === 'review' && trade && trade.to === uid && trade.status === 'pending' && trade.expMs > nowSrv;
    const isOutgoingPending = mode === 'review' && trade && trade.from === uid && trade.status === 'pending' && trade.expMs > nowSrv;

    titleSpan.textContent = mode === 'compose' ? 'Send a Gift' : 'Gift Details';
    if (mode === 'review' && trade) {
      reviewTag.style.display = '';
      reviewTag.textContent = trade.status === 'pending' && trade.expMs > nowSrv ? `${Math.ceil((trade.expMs - nowSrv) / 1000)}s left` : trade.status;
    } else {
      reviewTag.style.display = 'none';
    }

    const staticMetaKey = `${mode}|${peerCc}|${myCountryCode}`;
    if (staticMetaKey !== lastStaticMetaKey) {
      lastStaticMetaKey = staticMetaKey;
      peerFlagSlot.replaceChildren(countryFlagEl(peerCc, peerCc, { className: '' }));
      myFlagSlot.replaceChildren(countryFlagEl(myCountryCode, myCountryCode, { className: '' }));
    }

    peerLabelEl.textContent = mode === 'compose' ? 'Recipient' : trade?.from === uid ? 'To' : 'From';
    peerNameEl.textContent = peerName;
    peerBalEl.textContent = peerSub;

    if (mode === 'compose') {
      youSection.style.display = '';
      myNameEl.textContent = myName || 'You';
      myCashB.textContent = `₨ ${formatNumber(state.cash)}`;
      myGemsB.replaceChildren(gemDiamondEl(13), ` ${Math.floor(state.gems)}`);
    } else {
      youSection.style.display = 'none';
    }

    giftTitleH3.textContent = mode === 'compose' ? 'Your Gift Package' : 'Gift Contents';
    slotsCountSmall.textContent = `${traySlots.length}/${SLOTS_MAX} slots`;
    payTotalLbl.textContent = mode === 'compose' ? 'Total you send' : 'Total gift';
    payTotalVal.className = `amt ${totalSummary ? '' : 'empty'}`;
    payTotalVal.textContent = totalSummary || 'Nothing added yet';

    const slotNodes = [];
    for (let idx = 0; idx < SLOTS_MAX; idx++) {
      const entry = traySlots[idx];
      if (!entry) {
        slotNodes.push(h('div', { className: 'slot' }));
      } else {
        slotNodes.push(
          h(
            'button',
            {
              type: 'button',
              className: 'slot has',
              title: mode === 'compose' ? 'Tap to remove' : entry.label,
              onClick: () => {
                if (mode !== 'compose') return;
                if (entry.kind === 'cash') cash = 0;
                else if (entry.kind === 'gems') gems = 0;
                else if (entry.kind === 'stk' && entry.stkId) delete stk[entry.stkId];
                syncModalContents();
              },
            },
            h('span', { className: 'l' }, entry.label),
            entry.kind === 'cash' ? cashCoinEl(24) : entry.kind === 'gems' ? gemDiamondEl(24) : entry.stkId ? stickerArtEl(entry.stkId, 22) : null,
            h('span', { className: 'q' }, entry.qty),
          ),
        );
      }
    }
    slotsGrid.replaceChildren(...slotNodes);

    if (mode === 'compose') {
      composeControls.style.display = '';
      reviewNoteP.style.display = 'none';
      cashInput.max = String(maxCash);
      gemsInput.max = String(maxGems);
      if (document.activeElement !== cashInput) {
        cashInput.value = clampedCash ? String(clampedCash) : '';
      }
      if (document.activeElement !== gemsInput) {
        gemsInput.value = clampedGems ? String(clampedGems) : '';
      }
      if (document.activeElement !== noteInput) {
        noteInput.value = message;
      }

      const ownedStickers = STICKERS.filter((s) => (state.stk[s.id] || 0) > 0);
      if (ownedStickers.length > 0) {
        stkPickSlot.style.display = '';
        stkPickSlot.replaceChildren(
          ...ownedStickers.map((s) => {
            const added = clampedStk[s.id] || 0;
            const own = state.stk[s.id] || 0;
            return h(
              'button',
              {
                type: 'button',
                className: `stkbtn ${added > 0 ? 'on' : ''}`,
                title: `${s.n} (own ${own})`,
                onClick: () => {
                  const cur = stk[s.id] || 0;
                  if (cur < own) stk[s.id] = cur + 1;
                  else delete stk[s.id];
                  syncModalContents();
                },
              },
              added > 0 && h('b', null, `×${added}`),
              stickerArtEl(s.id, 22),
              h('small', null, String(own)),
            );
          }),
        );
      } else {
        stkPickSlot.style.display = 'none';
      }

      if (confirming) {
        footerSlot.replaceChildren(
          h(
            'div',
            { className: 'gxc', style: { display: 'grid', gap: '8px', textAlign: 'center' } },
            h(
              'p',
              null,
              'Send ',
              h('b', null, totalSummary),
              ' to ',
              h('b', null, peerName),
              '? Escrow deducts it immediately (refunded if declined or expired in 2 min).',
            ),
            h(
              'div',
              { style: { display: 'flex', gap: '8px', justifyContent: 'center' } },
              h(
                'button',
                {
                  type: 'button',
                  className: 'btn sm',
                  disabled: busy,
                  onClick: () => {
                    confirming = false;
                    syncModalContents();
                  },
                },
                'Back',
              ),
              h(
                'button',
                {
                  type: 'button',
                  className: 'btn sm mint',
                  disabled: busy,
                  onClick: () => void handleConfirmSend(),
                },
                busy ? 'Sending…' : 'Confirm Send',
              ),
            ),
          ),
        );
      } else {
        footerSlot.replaceChildren(
          h(
            'div',
            { className: 'ttfoot' },
            h(
              'button',
              {
                type: 'button',
                className: 'btn sm bd',
                onClick: () => {
                  cash = 0;
                  gems = 0;
                  stk = {};
                  message = '';
                  noteInput.value = '';
                  syncModalContents();
                },
              },
              'Clear',
            ),
            h('button', { type: 'button', className: 'btn sm br', onClick: () => handlers.onClose() }, 'Cancel'),
            h('div', { className: 'ttsum' }, h('b', null, totalSummary || 'Select items'), h('small', null, '2 min expiry · auto-refund')),
            h(
              'button',
              {
                type: 'button',
                className: 'btn mint bc',
                disabled: !totalSummary,
                onClick: () => {
                  confirming = true;
                  syncModalContents();
                },
              },
              lucideEl('Gift', { size: 15 }),
              h('span', null, 'Send Gift'),
            ),
          ),
        );
      }
    } else {
      composeControls.style.display = 'none';
      if (trade?.message) {
        reviewNoteP.style.display = '';
        reviewNoteP.textContent = `Note: “${trade.message}”`;
      } else {
        reviewNoteP.style.display = 'none';
      }

      footerSlot.replaceChildren(
        h(
          'div',
          { className: 'ttfoot' },
          h('button', { type: 'button', className: 'btn sm bd', onClick: () => handlers.onClose() }, 'Close'),
          h('div', { className: 'ttsum' }, h('b', null, totalSummary || 'Empty'), h('small', null, `Status: ${trade?.status || ''}`)),
          isIncomingPending && trade && [
            h(
              'button',
              {
                type: 'button',
                className: 'btn sm red br',
                disabled: busy,
                onClick: async () => {
                  busy = true;
                  syncModalContents();
                  try {
                    await handlers.onRejectTrade(trade.id);
                    handlers.onClose();
                  } finally {
                    busy = false;
                  }
                },
              },
              'Decline',
            ),
            h(
              'button',
              {
                type: 'button',
                className: 'btn mint bc',
                disabled: busy,
                onClick: async () => {
                  busy = true;
                  syncModalContents();
                  try {
                    await handlers.onAcceptTrade(trade.id);
                    handlers.onClose();
                  } finally {
                    busy = false;
                  }
                },
              },
              'Accept Gift',
            ),
          ],
          isOutgoingPending && trade && h(
            'button',
            {
              type: 'button',
              className: 'btn red bc',
              disabled: busy,
              onClick: async () => {
                busy = true;
                syncModalContents();
                try {
                  await handlers.onCancelTrade(trade.id);
                  handlers.onClose();
                } finally {
                  busy = false;
                }
              },
            },
            'Cancel & Refund',
          ),
        ),
      );
    }
  }

  return {
    el: root,
    update(params) {
      if (!params) {
        if (lastSessionKey !== '') {
          lastSessionKey = '';
          curParams = null;
          root.style.display = 'none';
        }
        return;
      }
      const nextSessionKey = `${params.mode}|${params.target?.id || ''}|${params.trade?.id || ''}|${params.uid}`;
      curParams = params;
      if (nextSessionKey !== lastSessionKey) {
        lastSessionKey = nextSessionKey;
        cash = 0;
        gems = 0;
        stk = {};
        message = '';
        noteInput.value = '';
        confirming = false;
        busy = false;
        lastStaticMetaKey = '';
      }
      root.style.display = '';
      syncModalContents();
    },
  };
}

const TAB_LOCK_KEY = 'cet_tab_lock';

function loadInitialState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return migrateState(JSON.parse(raw));
  } catch {
    // Ignore corrupt localStorage
  }
  return freshState();
}

  let leaderboard = [];
  let lbLoaded = false;
  let trades = [];
  let notifications = [];
  let sentToday = 0;

  let liveProjectProgress = {};

  let dmMessages = [];
  let dmRecipient = null;
  let recentDms = [];
  let sentDmContacts = [];

  let toasts = [];

  let settingsOpen = false;

  let serverTimeVerified = false;
  let lastActivity = Date.now();
  let cloudSyncTimer = null;
  let syncRetryTimer = null;
  let syncRetryCount = 0;
  let lastSyncedAt = 0;
  let cloudSyncBusy = false;
  let cloudDirty = false;
  let pendingDirty = false;
  let localSaveTimer = null;
  let permWarnShown = false;
  let cloudSyncPermDenied = false;
  let cloudSyncQuotaPaused = false;
  let authSeq = 0;
  let completedTradesCount = 0;
  const projBusy = new Set();
  const projPayBusy = new Set();
  let projCreating = false;
  const justCreatedProjIds = new Set();
  const projStartedLocalAt = {};
  let projLive = {};
  const projLastSync = {};
  const projPrevTickMs = {};
  let lastCityTap = 0;
  let settlingTrades = false;
  let lastSettledTradeCheck = 0;
  let rankPosition = 1;
  let tickCount = 0;
  let lastGiftDayKey = '';

  let activeUnsubs = [];
  let dailyLimitUnsub = null;
  let dmUnsub = null;
  let hbTimer = null;

  function teardownRealtimeListeners() {
    if (hbTimer) {
      window.clearInterval(hbTimer);
      hbTimer = null;
    }
    if (dailyLimitUnsub) {
      try { dailyLimitUnsub(); } catch {}
      dailyLimitUnsub = null;
    }
    lastGiftDayKey = '';
    if (dmUnsub) {
      try { dmUnsub(); } catch {}
      dmUnsub = null;
    }
    while (activeUnsubs.length) {
      const u = activeUnsubs.pop();
      try { u(); } catch {}
    }
  }

  function anyModalOpen() {
    return Boolean(dialog || giftModal || settingsOpen || errorLogOpen || notifsOpen || profileView || needsOnboarding);
  }

  function updateServerOffset(srvMs) {
    if (srvMs > 0 && Number.isFinite(srvMs)) {
      serverOffsetMs = srvMs - Date.now();
      serverTimeVerified = true;
    }
  }

  function saveLocal(next) {
    if (localSaveTimer) {
      window.clearTimeout(localSaveTimer);
      localSaveTimer = null;
    }
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ ...next, t: Date.now() }));
    } catch {
      // Ignore storage quota issues
    }
  }

  function scheduleSaveLocal() {
    if (localSaveTimer) window.clearTimeout(localSaveTimer);
    localSaveTimer = window.setTimeout(() => {
      localSaveTimer = null;
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ ...state, t: Date.now() }));
      } catch {
        // Ignore storage quota issues
      }
    }, 300);
  }

  // Persistent DOM shell elements
  const errBannerEl = h('div', { id: 'errBanner', role: 'alert', 'aria-live': 'assertive', style: { display: 'none' } });
  const toastContainerEl = h('div', { id: 'toast', 'aria-live': 'polite' });
  const floatLayerEl = h('div', null);
  const errPillBtn = h('button', {
    type: 'button',
    id: 'errPill',
    style: { display: 'none' },
    onClick: () => {
      errorLogOpen = true;
      renderAll();
    },
  });
  const cloudPillBtn = h('button', {
    type: 'button',
    id: 'cloudPill',
    style: { display: 'none' },
    onClick: () => {
      if (cloudStatus.cls === 'bad') {
        errorLogOpen = true;
        renderAll();
      } else {
        void performCloudSync(true);
      }
    },
  });

  const lockModalEl = h(
    'div',
    { className: 'modal', role: 'alertdialog', 'aria-modal': 'true', style: { display: 'none' } },
    h(
      'div',
      { className: 'card' },
      h('h2', null, ''),
      h('p', null, ''),
      h(
        'div',
        { className: 'acts' },
        h('button', { type: 'button', className: 'btn gold', onClick: () => window.location.reload() }, 'Use Here Instead'),
      ),
    ),
  );
  const lockTitleEl = lockModalEl.querySelector('h2');
  const lockBodyEl = lockModalEl.querySelector('p');

  function addToast(text) {
    const id = Date.now() + Math.random();
    toasts = [...toasts.slice(-3), { id, text }];
    renderToasts();
    window.setTimeout(() => {
      toasts = toasts.filter((t) => t.id !== id);
      renderToasts();
    }, 2800);
  }

  function renderToasts() {
    toastContainerEl.replaceChildren(...toasts.map((t) => h('div', null, t.text)));
  }

  function spawnFloat(text, x, y, color = '#ffc23d') {
    if (!state.set.anim) return;
    const clampedX = Math.max(24, Math.min(window.innerWidth - 110, x - 20));
    const clampedY = Math.max(40, Math.min(window.innerHeight - 80, y - 24));
    const node = h('div', { className: 'fl', style: { left: clampedX, top: clampedY, color } }, text);
    while (floatLayerEl.childNodes.length >= 10) {
      floatLayerEl.removeChild(floatLayerEl.firstChild);
    }
    floatLayerEl.appendChild(node);
    window.setTimeout(() => {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, 950);
  }

  function handleKicked() {
    if (kicked) return;
    kicked = true;
    teardownRealtimeListeners();
    renderAll();
  }

  async function performCloudSync(immediate = false) {
    const currentUid = uid;
    if (!currentUid || !cloudReady || kicked || needsOnboarding) return;
    if (!immediate && (cloudSyncPermDenied || cloudSyncQuotaPaused)) return;
    if (immediate) {
      cloudSyncPermDenied = false;
      cloudSyncQuotaPaused = false;
      syncRetryCount = 0;
    }
    if (syncRetryTimer) {
      window.clearTimeout(syncRetryTimer);
      syncRetryTimer = null;
    }
    if (cloudSyncBusy) {
      cloudDirty = true;
      return;
    }
    cloudSyncBusy = true;
    cloudDirty = false;
    expectedWalletRev = walletRev + 1;
    cloudStatus = { cls: 'warn', text: 'Saving…' };
    renderChrome();

    try {
      const res = await syncSaveToCloud({
        state,
        pubStats: pubProfile?.stats,
        completedTradesCount,
        rev: walletRev,
        sid,
        onKicked: handleKicked,
      });
      walletRev = res.wallet.rev;
      syncRetryCount = 0;
      cloudSyncPermDenied = false;
      cloudSyncQuotaPaused = false;
      permWarnShown = false;
      lastSyncedAt = Date.now();
      if (!res.accepted) {
        state = {
          ...state,
          cash: res.wallet.cash,
          gems: res.wallet.gems,
          stk: res.wallet.stk,
        };
        saveLocal(state);
        cloudDirty = true;
      } else {
        pendingDirty = false;
      }
      cloudStatus = { cls: 'ok', text: 'Saved' };
    } catch (err) {
      const code = err?.code || '';
      const msg = err instanceof Error ? err.message : String(err || '');
      const combined = `${code} ${msg}`;
      if (code === 'aborted' && msg.includes('Another session')) {
        cloudStatus = { cls: 'bad', text: 'Session displaced' };
      } else if (code === 'failed-precondition' && /not initialized/i.test(msg)) {
        if (db && fbFs) {
          const pRef = fbFs.doc(db, 'players', currentUid);
          const pCheck = await fbFs.getDocFromServer(pRef).catch(() => fbFs.getDoc(pRef)).catch(() => null);
          if (pCheck && !pCheck.exists()) {
            needsOnboarding = true;
            cloudReady = false;
            cloudStatus = { cls: 'warn', text: 'Setup profile' };
            renderAll();
            return;
          }
        }
        cloudStatus = { cls: 'warn', text: 'Retrying…' };
        cloudDirty = true;
      } else if (code === 'permission-denied' || /permission-denied|Missing or insufficient permissions/i.test(combined)) {
        cloudSyncPermDenied = true;
        cloudDirty = false;
        syncRetryCount = 0;
        cloudStatus = { cls: 'bad', text: 'Rules blocked sync' };
        if (!permWarnShown || immediate) {
          permWarnShown = true;
          addToast(formatFirebaseError(err));
        }
      } else if (code === 'resource-exhausted' || /Quota exceeded/i.test(combined)) {
        cloudSyncQuotaPaused = true;
        cloudDirty = false;
        syncRetryCount = 0;
        recordAppError({
          source: 'sync',
          code: code || 'resource-exhausted',
          path: `players/${currentUid}`,
          message: msg || 'Firebase Spark free plan quota reached — auto-sync paused (saved locally).',
        });
        cloudStatus = { cls: 'bad', text: 'Quota paused' };
        addToast('Firebase free quota limit reached — progress saved locally.');
      } else if (/aborted|unavailable|deadline-exceeded|internal|cancelled|network|offline|unauthenticated|unknown/i.test(combined)) {
        if (syncRetryCount < 3) {
          syncRetryCount += 1;
          const backoff = Math.min(20_000, 3000 * Math.pow(2, syncRetryCount - 1));
          cloudStatus = { cls: 'warn', text: 'Retrying…' };
          syncRetryTimer = window.setTimeout(() => {
            syncRetryTimer = null;
            void performCloudSync(false);
          }, backoff);
        } else {
          recordAppError({
            source: 'sync',
            code: code || undefined,
            path: `players/${currentUid}`,
            message: msg || 'Sync paused after retries',
          });
          cloudStatus = { cls: 'bad', text: 'Sync paused' };
          if (immediate) addToast(formatFirebaseError(err));
        }
      } else {
        if (syncRetryCount < 2) {
          syncRetryCount += 1;
          cloudStatus = { cls: 'warn', text: 'Retrying…' };
          syncRetryTimer = window.setTimeout(() => {
            syncRetryTimer = null;
            void performCloudSync(false);
          }, 3000);
        } else {
          recordAppError({
            source: 'sync',
            code: code || undefined,
            path: `players/${currentUid}`,
            message: msg || 'Cloud sync failed',
          });
          cloudStatus = { cls: 'bad', text: 'Sync failed' };
          if (immediate) addToast(formatFirebaseError(err));
        }
      }
    } finally {
      expectedWalletRev = null;
      cloudSyncBusy = false;
      renderAll();
      if (cloudDirty && !cloudSyncPermDenied && !cloudSyncQuotaPaused) {
        cloudDirty = false;
        window.setTimeout(() => void performCloudSync(false), 1200);
      }
    }
  }

  function scheduleCloudSync(delayMs = 10_000) {
    pendingDirty = true;
    if (!uid || !cloudReady || kicked || needsOnboarding || cloudSyncPermDenied || cloudSyncQuotaPaused) {
      return;
    }
    if (syncRetryCount > 0) syncRetryCount = 0;
    if (cloudSyncTimer) window.clearTimeout(cloudSyncTimer);
    cloudSyncTimer = window.setTimeout(() => {
      cloudSyncTimer = null;
      void performCloudSync(false);
    }, delayMs);
  }

  function updateState(updater, syncDelay = 10_000) {
    state = updater(state);
    saveLocal(state);
    scheduleCloudSync(syncDelay);
    renderAll();
  }

  function getTradeTier() {
    return tierOfCompletedTrades(pubProfile?.stats?.completedTrades);
  }

  function runDailyAndOfflineChecks(baseState, tradeTierVal, nowOverride) {
    const now = nowOverride ?? Date.now() + serverOffsetMs;
    let working = { ...baseState };
    const todayKey = dayKeyFor(now);

    if (working.questDay !== todayKey) {
      working = {
        ...working,
        questDay: todayKey,
        questIds: selectDailyQuestIds(todayKey),
        claimed: {},
      };
    }

    let promoToast = null;
    const promoRes = rollWeeklySubPromo(working, now);
    working = promoRes.state;
    if (promoRes.rolled && promoRes.promo) {
      const promoTier = SUBSCRIPTIONS.find((x) => x.id === promoRes.promo.tier);
      if (promoTier) {
        promoToast = `Weekly Flash Deal: −${promoRes.promo.pct}% off ${promoTier.n}!`;
      }
    }

    const off = applyOfflineEarnings(working, now, tradeTierVal);
    working = off.state;

    let streakDialog = null;
    const lastKey = working.lastDaily ? dayKeyFor(working.lastDaily) : '';
    if (lastKey !== todayKey) {
      const ydayKey = dayKeyFor(now - 86_400_000);
      const nextStreak = lastKey === ydayKey ? (working.streak || 0) + 1 : 1;
      const rw = DAILY_REWARDS[Math.min(DAILY_REWARDS.length - 1, nextStreak - 1)];
      const nextStk = { ...working.stk };
      let grantedStickerId = '';
      let grantedStickerName = '';
      if (rw.e) {
        const picked = STICKERS[Math.floor(Math.random() * STICKERS.length)];
        nextStk[picked.id] = (nextStk[picked.id] || 0) + 1;
        grantedStickerId = picked.id;
        grantedStickerName = picked.n;
      }
      working = {
        ...working,
        cash: Math.min(1e13, working.cash + rw.c),
        gems: Math.min(1e9, working.gems + rw.g),
        stk: nextStk,
        streak: nextStreak,
        lastDaily: now,
      };
      streakDialog = {
        title: `Day ${nextStreak} Streak!`,
        body: h(
          'div',
          null,
          h('p', null, "Welcome back! Here is today's treasury bonus:"),
          h(
            'p',
            { style: { fontSize: '18px', color: 'var(--gold)', fontFamily: 'var(--d)' } },
            `+₨ ${formatNumber(rw.c)} ${rw.g > 0 ? `· +${rw.g} Gems` : ''}${grantedStickerName ? ` · ${grantedStickerName}` : ''}`,
          ),
          grantedStickerId && h('div', { style: { margin: '8px auto' } }, stickerArtEl(grantedStickerId, 34)),
          off.credited >= 1 && h('p', { className: 'ok', style: { fontSize: '13px' } }, `Plus +₨ ${formatNumber(off.credited)} offline tax collected while away!`),
        ),
        actions: [{
          label: 'Collect',
          variant: 'gold',
          onClick: () => {
            dialog = null;
            renderAll();
          },
        }],
      };
    } else if (off.credited >= 1) {
      streakDialog = {
        title: 'Welcome Back!',
        body: h(
          'p',
          null,
          'Your economy kept running while away! ',
          h('b', { className: 'ok' }, `+₨ ${formatNumber(off.credited)}`),
          ' added to your Tax Pool',
          off.wasCapped ? ' (30m offline cap reached)' : '',
          '.',
        ),
        actions: [{
          label: 'Awesome',
          variant: 'mint',
          onClick: () => {
            dialog = null;
            renderAll();
          },
        }],
      };
    }

    return { state: working, streakDialog, promoToast };
  }

  function handleSnapshotError(path, err) {
    if (!auth?.currentUser) return;
    const info = recordFirestoreError(err, OperationType.GET, path);
    console.error('Firestore Snapshot Error: ', JSON.stringify(info));
    const raw = err instanceof Error ? err.message : String(err || '');
    const code = err?.code || '';
    if (/permission-denied|Missing or insufficient permissions/i.test(code + raw) && !permWarnShown) {
      permWarnShown = true;
      addToast(formatFirebaseError(err));
      cloudStatus = { cls: 'bad', text: 'Rules / Auth error' };
      renderChrome();
    }
  }

  function syncDailyLimitListener() {
    if (dailyLimitUnsub) {
      try { dailyLimitUnsub(); } catch {}
      dailyLimitUnsub = null;
    }
    if (!uid || !cloudReady || needsOnboarding || kicked || !db || !fbFs) {
      lastGiftDayKey = '';
      return;
    }
    const srvMinute = Math.floor((state.t + serverOffsetMs) / 60_000);
    const dk = dayKeyFor(srvMinute * 60_000);
    lastGiftDayKey = dk;
    const dlKey = `${uid}_${dk}`;
    dailyLimitUnsub = fbFs.onSnapshot(
      fbFs.doc(db, 'dailyLimits', dlKey),
      (snap) => {
        setSentToday(snap.exists() ? Number(snap.data()?.count || 0) : 0);
      },
      (err) => handleSnapshotError(`dailyLimits/${dlKey}`, err),
    );
  }

  function setSentToday(val) {
    sentToday = val;
    renderAll();
  }

  function recomputeRecentDms() {
    const map = new Map();
    for (const c of sentDmContacts) {
      if (c.uid && c.name) map.set(c.uid, c);
    }
    for (const n of notifications) {
      if (n.type === 'dm' && n.from && n.fromName && !map.has(n.from)) {
        map.set(n.from, { uid: n.from, name: n.fromName, cc: n.fromCc || '' });
      }
    }
    recentDms = Array.from(map.values());
  }

  function syncDmListener() {
    if (dmUnsub) {
      try { dmUnsub(); } catch {}
      dmUnsub = null;
    }
    if (!uid || !cloudReady || !dmRecipient || !fbFs) {
      dmMessages = [];
      return;
    }
    const target = dmRecipient;
    const q = buildQueryHelpers().dmQuery(uid, target.uid);
    dmUnsub = fbFs.onSnapshot(
      q,
      (snap) => {
        dmMessages = snap.docs
          .map((d) => {
            const x = d.data({ serverTimestamps: 'estimate' });
            const isMe = x.from === uid;
            return {
              id: d.id,
              uid: String(x.from || ''),
              name: isMe ? pubProfile?.username || 'You' : target.name,
              cc: isMe ? state.country[0] : target.cc,
              rank: 0,
              text: String(x.text || ''),
              ms: timestampToMs(x.createdAt),
            };
          })
          .reverse();
        renderAll();
      },
      (err) => handleSnapshotError(`dms/${target.uid}`, err),
    );
  }

  function startRealtimeListeners() {
    teardownRealtimeListeners();
    if (!uid || !cloudReady || needsOnboarding || kicked || !db || !fbFs) return;
    const { doc, onSnapshot } = fbFs;
    const queries = buildQueryHelpers();

    // 1. Session lock + continuous clock calibration
    activeUnsubs.push(
      onSnapshot(
        doc(db, 'players', uid, 'private', 'session'),
        (snap) => {
          if (!snap.exists()) return;
          const d = snap.data();
          if (d?.sid && d.sid !== sid) {
            handleKicked();
            return;
          }
          if (!snap.metadata.hasPendingWrites && d?.t) {
            updateServerOffset(timestampToMs(d.t));
          }
        },
        (err) => handleSnapshotError(`players/${uid}/private/session`, err),
      ),
    );

    // 2. Wallet listener
    activeUnsubs.push(
      onSnapshot(
        doc(db, 'players', uid, 'private', 'wallet'),
        (snap) => {
          if (!snap.exists()) return;
          const w = snap.data();
          const newRev = Number(w.rev) || 0;
          if (newRev > walletRev) {
            const isOwnInFlightEcho = !w.tradeId && cloudSyncBusy && w.sid === sid && expectedWalletRev === newRev;
            walletRev = newRev;
            if (!isOwnInFlightEcho) {
              state = {
                ...state,
                cash: capValue(w.cash, 1e13),
                gems: capValue(w.gems, 1e9),
                stk: cleanStickersMap(w.stk),
              };
              saveLocal(state);
              renderAll();
            }
          }
        },
        (err) => handleSnapshotError(`players/${uid}/private/wallet`, err),
      ),
    );

    // 3. Own player profile
    activeUnsubs.push(
      onSnapshot(
        doc(db, 'players', uid),
        (snap) => {
          if (!snap.exists()) return;
          const d = snap.data();
          completedTradesCount = d.stats?.completedTrades || 0;
          pubProfile = { ...d, id: snap.id, seen: timestampToMs(d.lastSeen) };
          renderAll();
        },
        (err) => handleSnapshotError(`players/${uid}`, err),
      ),
    );

    // 4. Active leaderboard
    activeUnsubs.push(
      onSnapshot(
        queries.playersActiveQuery(serverOffsetMs),
        (snap) => {
          const nowEst = Date.now() + serverOffsetMs;
          leaderboard = snap.docs
            .map((d) => {
              const data = d.data({ serverTimestamps: 'estimate' });
              return { ...data, id: d.id, seen: timestampToMs(data.lastSeen) };
            })
            .filter((p) => p.id === uid || (p.seen && nowEst - p.seen <= ACTIVE_WINDOW_MS))
            .sort((a, b) => (b.gdp || 0) - (a.gdp || 0));
          lbLoaded = true;
          renderAll();
        },
        (err) => {
          lbLoaded = true;
          handleSnapshotError('players', err);
          renderAll();
        },
      ),
    );

    // 5. Trades listener + expired gift settlement
    activeUnsubs.push(
      onSnapshot(
        queries.tradesQuery(uid),
        (snap) => {
          const list = snap.docs.map((d) => {
            const x = d.data({ serverTimestamps: 'estimate' });
            return {
              id: d.id,
              from: String(x.from || ''),
              to: String(x.to || ''),
              fromName: String(x.fromName || ''),
              toName: String(x.toName || ''),
              fromCountry: String(x.fromCountry || ''),
              toCountry: String(x.toCountry || ''),
              participants: Array.isArray(x.participants) ? x.participants : [],
              offerCash: Number(x.offerCash) || 0,
              offerGems: Number(x.offerGems) || 0,
              offerStk: x.offerStk || {},
              reqCash: Number(x.reqCash) || 0,
              reqGems: Number(x.reqGems) || 0,
              reqStk: x.reqStk || {},
              message: String(x.message || ''),
              status: x.status || 'pending',
              refunded: Boolean(x.refunded),
              createdMs: timestampToMs(x.createdAt),
              expMs: timestampToMs(x.expiresAt),
              resMs: timestampToMs(x.resolvedAt),
            };
          });
          trades = list;
          renderAll();
          if (!settlingTrades && uid) {
            settlingTrades = true;
            void settleExpiredTrades(list, uid, sid, handleKicked, serverOffsetMs).finally(() => {
              settlingTrades = false;
            });
          }
        },
        (err) => handleSnapshotError('trades', err),
      ),
    );

    // 6. Daily gift limit
    syncDailyLimitListener();

    // 7. Notifications
    activeUnsubs.push(
      onSnapshot(
        queries.notifsQuery(uid),
        (snap) => {
          notifications = snap.docs.map((d) => {
            const x = d.data({ serverTimestamps: 'estimate' });
            return {
              id: d.id,
              type: x.type || 'dm',
              text: String(x.text || ''),
              tradeId: x.tradeId || null,
              read: Boolean(x.read),
              from: String(x.from || ''),
              fromName: x.fromName ? String(x.fromName) : undefined,
              fromCc: x.fromCc ? String(x.fromCc) : undefined,
              ms: timestampToMs(x.createdAt),
            };
          });
          recomputeRecentDms();
          renderAll();
        },
        (err) => handleSnapshotError(`players/${uid}/notifications`, err),
      ),
    );

    // 8. Gov Projects
    activeUnsubs.push(
      onSnapshot(
        queries.projectsQuery(uid),
        (snap) => {
          for (const ch of snap.docChanges()) {
            const raw = ch.doc.data();
            if (!ch.doc.metadata.hasPendingWrites) {
              if (justCreatedProjIds.has(ch.doc.id) && raw.startedAt) {
                justCreatedProjIds.delete(ch.doc.id);
                const startMs = timestampToMs(raw.startedAt);
                if (startMs > 0) {
                  updateServerOffset(startMs);
                  projPrevTickMs[ch.doc.id] = startMs;
                }
              } else if (ch.type === 'modified' && raw.lastTickAt) {
                const tickMs = timestampToMs(raw.lastTickAt);
                const prevTick = projPrevTickMs[ch.doc.id] || 0;
                if (tickMs > prevTick) {
                  projPrevTickMs[ch.doc.id] = tickMs;
                  updateServerOffset(tickMs);
                }
              } else if (raw.lastTickAt) {
                const tickMs = timestampToMs(raw.lastTickAt);
                if (tickMs > (projPrevTickMs[ch.doc.id] || 0)) {
                  projPrevTickMs[ch.doc.id] = tickMs;
                }
              }
            }
          }
          const nowEst = Date.now() + serverOffsetMs;
          const normalized = snap.docs.map((d) =>
            normalizeProject(d.id, d.data({ serverTimestamps: 'estimate' }), nowEst, d.metadata.hasPendingWrites),
          );
          const nextLive = {};
          for (const p of normalized) {
            nextLive[p.id] = Math.max(projLive[p.id] || 0, p.progressMs);
          }
          const hadPrevLive = Object.keys(projLive).length > 0;
          projLive = nextLive;
          projects = normalized;
          if (normalized.length > 0 || hadPrevLive) {
            liveProjectProgress = { ...nextLive };
          }
          renderAll();
        },

        });
      }

  async function handleStartProject(type) {
    const currentUid = uid;
    if (!currentUid || projCreating) return;
    const activeCount = projects.filter((p) => p.status === 'active').length;
    if (activeCount >= 3) {
      addToast('Max 3 active projects at once.');
      return;
    }
    const def = GX_PROJECT_TYPES[type];
    const stageCost = Math.ceil(def.cost / PROJECT_STAGES);
    if (state.cash < stageCost) {
      addToast('Not enough cash for Stage 1.');
      return;
    }
    projCreating = true;
    updateState((prev) => ({ ...prev, cash: Math.max(0, prev.cash - stageCost) }), 3_000);
    try {
      await createGovProject(currentUid, type, (newId) => {
        justCreatedProjIds.add(newId);
        projStartedLocalAt[newId] = Date.now();
      });
      playSfx('buy', Boolean(state.set.sfx));
      addToast(`Started ${def.n}!`);
    } catch (err) {
      updateState((prev) => ({ ...prev, cash: Math.min(1e13, prev.cash + stageCost) }), 3_000);
      recordFirestoreError(err, OperationType.CREATE, `players/${currentUid}/projects`);
      addToast(formatFirebaseError(err));
    } finally {
      projCreating = false;
    }
  }

  async function handlePayProjectStage(projectId) {
    const currentUid = uid;
    if (!currentUid || projPayBusy.has(projectId)) return;
    const proj = projects.find((p) => p.id === projectId);
    if (!proj || proj.status !== 'active' || proj.paid >= PROJECT_STAGES) return;
    const stageCost = Math.ceil(proj.t.cost / PROJECT_STAGES);
    if (state.cash < stageCost) {
      addToast('Not enough cash for next stage.');
      return;
    }
    projPayBusy.add(projectId);
    updateState((prev) => ({ ...prev, cash: Math.max(0, prev.cash - stageCost) }), 3_000);
    try {
      await payGovProjectStage(currentUid, projectId, proj.paid);
      playSfx('buy', Boolean(state.set.sfx));
      addToast(`Paid stage ${proj.paid + 1}/${PROJECT_STAGES}`);
    } catch (err) {
      updateState((prev) => ({ ...prev, cash: Math.min(1e13, prev.cash + stageCost) }), 3_000);
      recordFirestoreError(err, OperationType.UPDATE, `players/${currentUid}/projects/${projectId}`);
      addToast(formatFirebaseError(err));
    } finally {
      projPayBusy.delete(projectId);
    }
  }

  // Auth handlers
  async function handleGoogleLogin() {
    if (!isFirebaseConfigured || !auth || !fbAuth) {
      authMsg = 'Cloud sign-in is unavailable right now. Play offline or retry when connected.';
      renderAll();
      return;
    }
    authMsg = 'Signing in with Google…';
    renderAll();
    const provider = new fbAuth.GoogleAuthProvider();
    try {
      await fbAuth.signInWithPopup(auth, provider);
    } catch (err) {
      const code = err?.code || '';
      if (code === 'auth/popup-blocked') {
        try {
          await fbAuth.signInWithRedirect(auth, provider);
        } catch (redirectErr) {
          recordAppError({
            source: 'auth',
            code: extractErrorCode(redirectErr) || undefined,
            message: extractErrorMessage(redirectErr),
          });
          authMsg = formatFirebaseError(redirectErr);
          renderAll();
        }
      } else {
        if (!/popup-closed-by-user|cancelled-popup-request/i.test(code)) {
          recordAppError({
            source: 'auth',
            code: code || undefined,
            message: extractErrorMessage(err),
          });
        }
        authMsg = formatFirebaseError(err);
        renderAll();
      }
    }
  }

  async function handleEmailAuth(email, password, register) {
    if (!isFirebaseConfigured || !auth || !fbAuth) {
      authMsg = 'Cloud sign-in is unavailable right now. Play offline or retry when connected.';

    }
    if (!email.trim() || password.length < 6) {
      authMsg = 'Enter a valid email and password (min 6 chars).';
      renderAll();
      return;
    }
    authMsg = register ? 'Creating account…' : 'Signing in…';
    renderAll();
    try {
      if (register) {
        await fbAuth.createUserWithEmailAndPassword(auth, email.trim(), password);
      } else {
        await fbAuth.signInWithEmailAndPassword(auth, email.trim(), password);
      }
    } catch (err) {
      recordAppError({
        source: 'auth',
        code: extractErrorCode(err) || undefined,
        message: extractErrorMessage(err),
      });
      authMsg = formatFirebaseError(err);
      renderAll();
    }
  }

  function renderAll() {
    renderChrome();

    const tradeTierVal = getTradeTier();
    rankPosition = uid && lbLoaded && leaderboard.length > 0
      ? calculateOnlineRank(state, uid, leaderboard)
      : calculateOfflineRank(state);

    const currentSecond = Math.floor(state.t / 1000);
    const hasPendingGifts = Boolean(uid && trades.some((t) => t.status === 'pending'));
    const giftsNowSrvMs = (hasPendingGifts && currentSecond > 0 ? currentSecond * 1000 : Date.now()) + serverOffsetMs;
    const pendingIncomingGifts = uid
      ? trades.filter((t) => t.to === uid && t.status === 'pending' && t.expMs > Date.now() + serverOffsetMs).length
      : 0;
    const unreadNotifs = notifications.filter((n) => !n.read).length;

    const srvMinute = Math.floor((state.t + serverOffsetMs) / 60_000);
    const dayKey = dayKeyFor(srvMinute * 60_000);
    if (uid && cloudReady && !needsOnboarding && !kicked && dayKey !== lastGiftDayKey) {

    if (tab === 'build') {
      buildTabCtrl.update(state, serverOffsetMs);
    } else if (tab === 'gov') {
      govtTabCtrl.update({

        subTab: govtSubTab,
        uid,

        serverOffsetMs,
        isUserActive: state.t - lastActivity < 120_000,

        subTab: playersSubTab,
        leaderboard,
        lbLoaded,
        serverOffsetMs,

        dmMessages,

      shopTabCtrl.update(state, shopSubTab, dayKey, serverOffsetMs);

    profileModalCtrl.update(

    settingsModalCtrl.update(settingsOpen, state, uid, user?.email || null, appErrors.length);
    errorLogModalCtrl.update(errorLogOpen, appErrors, uid, user?.email || null);
    notifsModalCtrl.update(notifsOpen, notifications);

  // Single-tab lock
  const releaseOwnLock = () => {

        localStorage.removeItem(TAB_LOCK_KEY);
      }
    } catch {
      // Ignore
    }
  };
  const handleExit = () => {
    saveLocal(state);
    releaseOwnLock();
  };
  const claimTab = () => {
    const cur = localStorage.getItem(TAB_LOCK_KEY);
    if (cur && cur !== sid) {
      try {
        const parsed = JSON.parse(cur);
        if (parsed.id !== sid && Date.now() - parsed.t < 7000) {
          otherTabLocked = true;
          return;
        }
      } catch {
        // Ignore malformed
      }
    }
    otherTabLocked = false;
    localStorage.setItem(TAB_LOCK_KEY, JSON.stringify({ id: sid, t: Date.now() }));
  };
  claimTab();
  window.setInterval(() => {
    if (!otherTabLocked && !kicked) {
      localStorage.setItem(TAB_LOCK_KEY, JSON.stringify({ id: sid, t: Date.now() }));
    }
  }, 2500);
  window.addEventListener('storage', (e) => {
    if (e.key === TAB_LOCK_KEY && e.newValue) {
      try {
        const parsed = JSON.parse(e.newValue);
        if (parsed.id !== sid && Date.now() - parsed.t < 7000) {
          otherTabLocked = true;
          renderAll();
        }
      } catch {
        // Ignore
      }
    }
  });
  window.addEventListener('pagehide', handleExit);
  window.addEventListener('beforeunload', handleExit);

  // Offline initial daily check if starting immediately (e.g. saved nation or ?autostart=1)
  if (!gateOpen && !uid) {
    const checkedRes = runDailyAndOfflineChecks(state, 0);
    state = checkedRes.state;
    saveLocal(state);
    if (checkedRes.promoToast) addToast(checkedRes.promoToast);
    if (checkedRes.streakDialog) dialog = checkedRes.streakDialog;
  }

  // Initial synchronous render so app is immediately interactive even before CDN loads
  renderAll();

  // Main 1-second simulation & background settlement loop
  window.setInterval(() => {
    if (gateOpen || otherTabLocked || kicked) return;

    const now = Date.now();
    const nowSrv = now + serverOffsetMs;
    const isUserActive = !document.hidden && now - lastActivity < 120_000;
    tickCount += 1;

    let triggerDecisionId = null;
    let passiveEvent = null;
    if (state.ev - 1 <= 0) {
      const curInc = calculateIncome(state, { tradeTier: getTradeTier(), nowMs: nowSrv });
      if (curInc.gross > 8 && isUserActive && !anyModalOpen() && Math.random() < 0.55) {
        const pick = EXEC_DECISIONS[Math.floor(Math.random() * EXEC_DECISIONS.length)];
        triggerDecisionId = pick.id;
      } else if (curInc.gross > 5 && Math.random() < 0.65) {
        if (Math.random() < 0.65) {
          const bonus = Math.max(100, Math.floor(Math.max(1, Math.abs(curInc.net)) * 45));
          passiveEvent = { kind: 'bonus', amt: bonus };
        } else {
          const fine = Math.min(Math.floor(state.cash * 0.05), Math.floor(curInc.gross * 25));
          if (fine > 0) passiveEvent = { kind: 'fine', amt: fine };
        }
      }
    }

    const prev = state;
    const inc = calculateIncome(prev, { tradeTier: getTradeTier(), nowMs: nowSrv });
    const capPool = Math.max(0, inc.net * getTaxPoolCapSeconds(prev));
    const prevPool = prev.taxPool || 0;
    const nextTaxPool =
      inc.net > 0
        ? prevPool >= capPool
          ? Math.min(1e13, prevPool)
          : Math.min(1e13, Math.min(capPool, prevPool + inc.net))
        : Math.max(0, prevPool + inc.net);

    const targHap = targetHappiness(prev);
    const nextHap = Math.max(0, Math.min(100, prev.hap + (targHap - prev.hap) * 0.04));
    const nextAppr = Math.max(0, Math.min(100, prev.appr + (nextHap - prev.appr) * 0.02));
    const promoTick = rollWeeklySubPromo(prev, nowSrv);
    const nextSubPromo = promoTick.rolled ? promoTick.state.subPromo : prev.subPromo;
    const nextPop = Math.min(
      100_000,
      Math.max(
        1,
        prev.pop +
          (nextHap - 45) * 0.0005 +
          ((prev.b.water || 0) * 0.0002 +
            (prev.b.rail || 0) * 0.0003 +
            (prev.b.transit || 0) * 0.00025 +
            (prev.transitSub || 0) * 0.00004),
      ),
    );

    let nextCash = prev.cash;
    let nextGx = prev.gx;
    const nextDay = prev.day + 1 / 12;
    let nextEv = prev.ev - 1;

    let nextActiveFx = prev.activeFx;
    if (nextActiveFx?.incomeBoostEnd && nextActiveFx.incomeBoostEnd <= nowSrv) {
      nextActiveFx = { ...nextActiveFx };
      delete nextActiveFx.incomeBoostEnd;
      delete nextActiveFx.incomeBoostMult;
      delete nextActiveFx.incomeBoostId;
    }

    if (isUserActive) {
      const acc = (prev.gx.acc || 0) + 1;
      const nextCond = { ...prev.gx.cond };
      if (tickCount % 15 === 0) {
        const decayStep = 0.15 * getInfraDecayMult(prev);
        for (const [k] of [...GX_GOV_BUILDINGS, ...GX_ROADS]) {
          nextCond[k] = Math.max(0, (nextCond[k] ?? 100) - decayStep);
        }
      }
      let blk = prev.gx.blk || 0;
      if (blk > 0) blk -= 1;

      if (acc >= GOV_DAY_SEC) {
        const dailyGross = Math.max(0, inc.gross) * GOV_DAY_SEC;
        const sal = Math.floor(dailyGross * 0.03);
        const el = Math.floor(dailyGross * 0.015);
        const inf = Math.floor(dailyGross * 0.015);
        const total = sal + el + inf;
        const paid = Math.min(nextCash, total);
        nextCash = Math.max(0, nextCash - paid);
        const unpaidEl = Math.max(0, el - Math.max(0, paid - sal));
        if (unpaidEl > 0) blk = Math.max(blk, 90);
        const dayNum = (prev.gx.exp?.n || 0) + 1;
        const msg = `Day ${dayNum}: Paid ₨ ${formatNumber(paid)} of ₨ ${formatNumber(total)} expenses`;
        nextGx = {
          ...prev.gx,
          cond: nextCond,
          acc: 0,
          blk,
          exp: { sal, el, inf, total, paid, n: dayNum, t: now },
          log: [msg, ...prev.gx.log].slice(0, 8),
        };
      } else {
        nextGx = { ...prev.gx, cond: nextCond, acc, blk };
      }
    }

    if (nextEv <= 0) {
      nextEv = 150;
      if (passiveEvent?.kind === 'bonus') {
        nextCash = Math.min(1e13, nextCash + passiveEvent.amt);
      } else if (passiveEvent?.kind === 'fine') {
        nextCash = Math.max(0, nextCash - passiveEvent.amt);
      }
    }

    let nextHist = prev.hist;
    if (tickCount % 5 === 0) {
      nextHist = [...prev.hist, calculateGdp({ ...prev, cash: nextCash })].slice(-60);
    }

    state = {
      ...prev,
      cash: nextCash,
      taxPool: nextTaxPool,
      day: nextDay,
      hap: nextHap,
      appr: nextAppr,
      pop: nextPop,
      boost: Math.max(0, (prev.boost || 0) - 1),
      ev: nextEv,
      hist: nextHist,
      activeFx: nextActiveFx,
      gx: nextGx,
      subPromo: nextSubPromo,
      t: now,
    };

    if (tickCount % 8 === 0) saveLocal(state);

    if (passiveEvent?.kind === 'bonus') {
      addToast(`Trade Windfall! +₨ ${formatNumber(passiveEvent.amt)}`);
    } else if (passiveEvent?.kind === 'fine') {
      addToast(`Grid Maintenance Fee: −₨ ${formatNumber(passiveEvent.amt)}`);
    } else if (triggerDecisionId) {
      const dec = EXEC_DECISIONS.find((d) => d.id === triggerDecisionId);
      if (dec) {
        const quote = getExecDecisionQuote(state, dec.id, getTradeTier(), nowSrv);
        dialog = {
          title: `Cabinet Briefing: ${dec.title}`,
          body: h(
            'div',
            null,
            h('p', { style: { margin: '0 0 10px', fontSize: '13px' } }, dec.summary),
            h(
              'div',
              { className: 'notifs', style: { marginBottom: '4px' } },
              h('div', { className: 'notif unread' }, h('b', null, dec.options[0].label), h('small', null, `Cost: ₨ ${formatNumber(quote.spendCost)} · ${dec.options[0].hint}`)),
              h('div', { className: 'notif' }, h('b', null, dec.options[1].label), h('small', null, `Gain: +₨ ${formatNumber(quote.gainCash)} · ${dec.options[1].hint}`)),
            ),
          ),
          actions: [
            {
              label: `${dec.options[0].label} (−₨ ${formatNumber(quote.spendCost)})`,
              variant: dec.options[0].variant,
              onClick: () => {
                const nowExec = Date.now() + serverOffsetMs;
                const res = resolveExecutiveDecision(state, dec.id, 0, getTradeTier(), nowExec);
                if (!res.ok) {
                  addToast(res.summary);
                  return;
                }
                state = res.state;
                saveLocal(state);
                playSfx('win', Boolean(state.set.sfx));
                triggerBuzz(16, Boolean(state.set.vib));
                scheduleCloudSync(800);
                dialog = null;
                renderAll();
                addToast(res.summary);
              },
            },
            {
              label: `${dec.options[1].label} (+₨ ${formatNumber(quote.gainCash)})`,
              variant: dec.options[1].variant,
              onClick: () => {
                const nowExec = Date.now() + serverOffsetMs;
                const res = resolveExecutiveDecision(state, dec.id, 1, getTradeTier(), nowExec);
                if (res.ok) {
                  state = res.state;
                  saveLocal(state);
                  playSfx('coin', Boolean(state.set.sfx));
                  scheduleCloudSync(800);
                  addToast(res.summary);
                }
                dialog = null;
                renderAll();
              },
            },
          ],
        };
      }
    }

    if (
      tickCount % 120 === 0 &&
      !document.hidden &&
      uid &&
      cloudReady &&
      !needsOnboarding &&
      !cloudSyncPermDenied &&
      !cloudSyncQuotaPaused &&
      (pendingDirty || (isUserActive && now - lastSyncedAt >= 120_000))
    ) {
      syncRetryCount = 0;
      void performCloudSync(false);
    }

    if (
      uid &&
      cloudReady &&
      !settlingTrades &&
      now - lastSettledTradeCheck >= 5000 &&
      trades.some(
        (t) =>
          (t.from === uid && t.status === 'pending' && t.expMs > 0 && t.expMs + 1500 <= nowSrv) ||
          (t.from === uid && (t.status === 'rejected' || t.status === 'expired') && !t.refunded),
      )
    ) {
      lastSettledTradeCheck = now;
      settlingTrades = true;
      void settleExpiredTrades(trades, uid, sid, handleKicked, serverOffsetMs).finally(() => {
        settlingTrades = false;
      });
    }

    if (uid && projects.length > 0) {
      const speedMult = getProjectSpeedMult(state, nowSrv);
      const stepMs = Math.max(1000, Math.floor(1000 * speedMult));
      for (const p of projects) {
        if (p.status === 'active') {
          const curLive = Math.max(p.progressMs, projLive[p.id] || 0);
          const alreadyDoneLocally = curLive >= p.t.dur && p.paid >= PROJECT_STAGES;
          if (alreadyDoneLocally) {
            const lastSync = projLastSync[p.id] || 0;
            if (now - lastSync >= 10_000 && !projBusy.has(p.id)) {
              projLastSync[p.id] = now;
              projBusy.add(p.id);
              void finishGovProject(uid, p.id, 'done', p.t.dur)
                .catch((err) => {
                  if (extractErrorCode(err) !== 'aborted') {
                    recordFirestoreError(err, OperationType.UPDATE, `players/${uid}/projects/${p.id}`);
                  }
                })
                .finally(() => projBusy.delete(p.id));
            }
          } else if (
            serverTimeVerified &&
            !p.pending &&
            p.st > 0 &&
            nowSrv >= p.dl &&
            now - (projStartedLocalAt[p.id] || 0) >= 30_000
          ) {
            if (!projBusy.has(p.id)) {
              projBusy.add(p.id);
              void finishGovProject(uid, p.id, 'failed')
                .catch((err) => {
                  if (extractErrorCode(err) !== 'aborted') {
                    recordFirestoreError(err, OperationType.UPDATE, `players/${uid}/projects/${p.id}`);
                  }
                })
                .finally(() => projBusy.delete(p.id));
            }
          } else if (isUserActive && !p.pending) {
            const capMs = Math.floor((p.t.dur * p.paid) / PROJECT_STAGES);
            if (curLive < capMs) {
              const nextMs = Math.min(capMs, curLive + stepMs);
              projLive[p.id] = nextMs;
              liveProjectProgress = { ...projLive };
              if (nextMs >= p.t.dur && p.paid >= PROJECT_STAGES && !projBusy.has(p.id)) {
                projLastSync[p.id] = now;
                projBusy.add(p.id);
                void finishGovProject(uid, p.id, 'done', p.t.dur)
                  .catch((err) => {
                    if (extractErrorCode(err) !== 'aborted') {
                      recordFirestoreError(err, OperationType.UPDATE, `players/${uid}/projects/${p.id}`);
                    }
                  })
                  .finally(() => projBusy.delete(p.id));
              } else {
                const lastSync = projLastSync[p.id] || 0;
                const hitStageCap = nextMs >= capMs && p.progressMs < capMs;
                if ((hitStageCap || now - lastSync >= 60_000) && !projBusy.has(p.id)) {
                  projLastSync[p.id] = now;
                  projBusy.add(p.id);
                  void tickGovProject(uid, p.id, nextMs)
                    .catch((err) => {
                      if (extractErrorCode(err) !== 'aborted') {
                        recordFirestoreError(err, OperationType.UPDATE, `players/${uid}/projects/${p.id}`);
                      }
                    })
                    .finally(() => projBusy.delete(p.id));
                }
              }
            } else if (p.progressMs < capMs && p.paid < PROJECT_STAGES && !projBusy.has(p.id)) {
              projLastSync[p.id] = now;
              projBusy.add(p.id);
              void tickGovProject(uid, p.id, capMs)
                .catch((err) => {
                  if (extractErrorCode(err) !== 'aborted') {
                    recordFirestoreError(err, OperationType.UPDATE, `players/${uid}/projects/${p.id}`);
                  }
                })
                .finally(() => projBusy.delete(p.id));
            }
          }
        } else if (!p.claimed && (p.status === 'done' || p.status === 'failed')) {
          if (!projBusy.has(p.id)) {
            projBusy.add(p.id);
            const projSnap = p;
            void claimGovProject(uid, projSnap.id)
              .then((resStatus) => {
                if (resStatus === 'done') {
                  const early = projSnap.rs > 0 && projSnap.dl > projSnap.st && (projSnap.dl - projSnap.rs) / (projSnap.dl - projSnap.st) > 0.5;
                  const profit = Math.ceil(projSnap.t.cost * 0.4 * (early ? 1.5 : 1));
                  const cashReward = projSnap.t.cost + profit;
                  state = {
                    ...state,
                    cash: Math.min(1e13, state.cash + cashReward),
                    hap: Math.min(100, state.hap + 3),
                    gx: {
                      ...state.gx,
                      pb: Math.min(0.25, (state.gx.pb || 0) + projSnap.t.pb),
                      ph: Math.min(10, (state.gx.ph || 0) + projSnap.t.ph),
                      log: [`${projSnap.t.n} completed${early ? ' EARLY' : ''}! +₨ ${formatNumber(cashReward)}`, ...state.gx.log].slice(0, 8),
                    },
                  };
                  saveLocal(state);
                  renderAll();
                  addToast(`${projSnap.t.n} finished! +₨ ${formatNumber(cashReward)}`);
                  scheduleCloudSync(2000);
                } else if (resStatus === 'failed') {
                  const refund = Math.ceil((projSnap.t.cost / PROJECT_STAGES) * projSnap.paid * 0.75);
                  state = {
                    ...state,
                    cash: Math.min(1e13, state.cash + refund),
                    gx: {
                      ...state.gx,
                      log: [`${projSnap.t.n} missed deadline (75% refunded)`, ...state.gx.log].slice(0, 8),
                    },
                  };
                  saveLocal(state);
                  renderAll();
                  addToast(`${projSnap.t.n} missed deadline — ₨ ${formatNumber(refund)} refunded`);
                  scheduleCloudSync(2000);
                }
              })
              .catch((err) => {
                if (extractErrorCode(err) !== 'aborted') {
                  recordFirestoreError(err, OperationType.UPDATE, `players/${uid}/projects/${projSnap.id}`);
                }
              })
              .finally(() => projBusy.delete(projSnap.id));
          }
        }
      }
    }

    renderAll();
  }, 1000);

  // Async Firebase SDK initialization & Auth listener
  void initFirebaseSdk().then((ok) => {
    if (!ok || !auth || !db || !fbAuth || !fbFs) return;

    void fbAuth.getRedirectResult(auth).catch((err) => {
      recordAppError({
        source: 'auth',
        code: extractErrorCode(err) || undefined,
        message: extractErrorMessage(err),
      });
      authMsg = formatFirebaseError(err);
      renderAll();
    });

    fbAuth.onAuthStateChanged(auth, async (u) => {
      const seq = ++authSeq;
      teardownRealtimeListeners();
      user = u;
      uid = u?.uid || null;

      if (!u) {
        if (cloudSyncTimer) {
          window.clearTimeout(cloudSyncTimer);
          cloudSyncTimer = null;
        }
        if (syncRetryTimer) {
          window.clearTimeout(syncRetryTimer);
          syncRetryTimer = null;
        }
        walletRev = 0;
        expectedWalletRev = null;
        lastSyncedAt = 0;
        cloudSyncBusy = false;
        cloudDirty = false;
        pendingDirty = false;
        syncRetryCount = 0;
        cloudSyncPermDenied = false;
        cloudSyncQuotaPaused = false;
        permWarnShown = false;
        completedTradesCount = 0;
        settlingTrades = false;
        serverTimeVerified = false;
        serverOffsetMs = 0;
        projBusy.clear();
        projPayBusy.clear();
        projCreating = false;
        justCreatedProjIds.clear();
        Object.keys(projStartedLocalAt).forEach((k) => delete projStartedLocalAt[k]);
        projLive = {};
        Object.keys(projLastSync).forEach((k) => delete projLastSync[k]);
        Object.keys(projPrevTickMs).forEach((k) => delete projPrevTickMs[k]);
        cloudReady = false;
        needsOnboarding = false;
        pubProfile = null;
        trades = [];
        notifications = [];
        projects = [];
        leaderboard = [];
        lbLoaded = false;
        sentToday = 0;
        liveProjectProgress = {};
        globalChat = [];
        dmMessages = [];
        dmRecipient = null;
        recentDms = [];
        sentDmContacts = [];
        cloudStatus = { cls: '', text: 'Saved' };
        renderAll();
        return;
      }

      cloudSyncPermDenied = false;
      cloudSyncQuotaPaused = false;
      permWarnShown = false;
      syncRetryCount = 0;
      gateOpen = false;
      authMsg = '';
      renderAll();

      try {
        // Ensure fresh Auth ID token is ready before Firestore rule-protected reads/writes
        await u.getIdToken();
        if (authSeq !== seq) return;

        await withAuthRetry(() =>
          fbFs.setDoc(fbFs.doc(db, 'players', u.uid, 'private', 'session'), {
            sid,
            t: fbFs.serverTimestamp(),
          }),
        );
        if (authSeq !== seq) return;

        const sesSnap = await fbFs.getDocFromServer(fbFs.doc(db, 'players', u.uid, 'private', 'session')).catch(() => null);
        if (authSeq !== seq) return;
        if (sesSnap && sesSnap.exists()) {
          const srvMs = timestampToMs(sesSnap.data()?.t);
          if (srvMs > 0) updateServerOffset(srvMs);
        }

        const pRef = fbFs.doc(db, 'players', u.uid);
        const pSnap = await withAuthRetry(() => fbFs.getDocFromServer(pRef).catch(() => fbFs.getDoc(pRef)));
        if (authSeq !== seq) return;
        if (!pSnap.exists()) {
          needsOnboarding = true;
          cloudReady = false;
          renderAll();
          return;
        }

        const pData = pSnap.data();
        pubProfile = { ...pData, id: u.uid, seen: timestampToMs(pData.lastSeen) };

        const wRef = fbFs.doc(db, 'players', u.uid, 'private', 'wallet');
        const sRef = fbFs.doc(db, 'saves', u.uid);
        const [wSnap, sSnap] = await Promise.all([
          withAuthRetry(() => fbFs.getDocFromServer(wRef).catch(() => fbFs.getDoc(wRef))),
          withAuthRetry(() => fbFs.getDocFromServer(sRef).catch(() => fbFs.getDoc(sRef))),
        ]);
        if (authSeq !== seq) return;

        let loaded = sSnap.exists() ? migrateState(sSnap.data()?.save || {}) : loadInitialState();
        loaded = {
          ...loaded,
          country:
            COUNTRIES.find((c) => c[0] === pData.countryCode) || [
              pData.countryCode || 'PK',
              pData.countryName || 'Pakistan',
            ],
        };

        if (wSnap.exists()) {
          const w = wSnap.data();
          const rawRev = Number(w.rev);
          walletRev = Number.isFinite(rawRev) ? Math.max(0, Math.floor(rawRev)) : 0;
          loaded.cash = capValue(w.cash, 1e13);
          loaded.gems = capValue(w.gems, 1e9);
          loaded.stk = cleanStickersMap(w.stk);
        } else {
          walletRev = 0;
          pendingDirty = true;
        }

        const tier = tierOfCompletedTrades(pData.stats?.completedTrades);
        completedTradesCount = pData.stats?.completedTrades || 0;
        const checkedRes = runDailyAndOfflineChecks(loaded, tier, Date.now() + serverOffsetMs);
        const checked = checkedRes.state;
        if (
          checked.lastDaily !== loaded.lastDaily ||
          checked.taxPool !== loaded.taxPool ||
          checked.questDay !== loaded.questDay ||
          checked.subPromo !== loaded.subPromo
        ) {
          pendingDirty = true;
        }

        state = checked;
        saveLocal(checked);
        if (checkedRes.promoToast) addToast(checkedRes.promoToast);
        if (checkedRes.streakDialog) dialog = checkedRes.streakDialog;
        needsOnboarding = false;
        cloudReady = true;
        renderAll();
        startRealtimeListeners();
        if (pendingDirty) scheduleCloudSync(800);
      } catch (err) {
        if (authSeq === seq) {
          recordFirestoreError(err, OperationType.GET, `players/${u.uid}`);
          addToast(formatFirebaseError(err));
          renderAll();
        }
      }
    });
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootApp, { once: true });
} else {
  bootApp();
}
    </script>
  </body>
</html>
