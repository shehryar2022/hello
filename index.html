    try {
      const raw = localStorage.getItem(key);
      hiddenPastIds = raw ? JSON.parse(raw) : [];
    } catch {
      hiddenPastIds = [];
    }
  }

  const activeBadge = h('em', { style: { display: 'none' } }, '');
  const researchBadge = h('em', { style: { display: 'none' } }, '');
  const subInfraBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('infra') }, lucideEl('Landmark', { size: 14 }), h('span', null, 'Infra & Upgrades'));
  const subProjBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('projects') }, lucideEl('Hammer', { size: 14 }), h('span', null, 'Projects'), activeBadge);
  const subResBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('research') }, lucideEl('FlaskConical', { size: 14 }), h('span', null, 'Research Lab'), researchBadge);

  const bonusValueB = h('b', { className: 'ok' }, '');
  const bonusBanner = h(
    'div',
    { className: 'tradelim', style: { display: 'none' } },
    h('span', null, lucideEl('Sparkles', { size: 14, color: '#3fe0b0' }), ' National Bonuses Active'),
    bonusValueB,
  );

  const bodySlot = h('div', null);
  const root = h(
    'div',
    null,
    h('div', { className: 'subtabs' }, subInfraBtn, subProjBtn, subResBtn),
    bonusBanner,
    bodySlot,
  );

  return {
    el: root,
    update(ctx) {
      const { state, subTab, uid, projects, liveProjectProgress, serverOffsetMs, isUserActive } = ctx;
      const gx = state.gx;
      const nowSrv = (state.t || Date.now()) + serverOffsetMs;
      const activeCount = projects.filter((p) => p.status === 'active').length;
      const readyTechCount = TECH_TREE.filter((t) => canUnlockTech(state, t.id).ok).length;

      subInfraBtn.className = subTab === 'infra' ? 'on' : '';
      subProjBtn.className = subTab === 'projects' ? 'on' : '';
      subResBtn.className = subTab === 'research' ? 'on' : '';
      if (activeCount > 0) {
        activeBadge.style.display = '';
        activeBadge.textContent = String(activeCount);
      } else {
        activeBadge.style.display = 'none';
      }
      if (readyTechCount > 0) {
        researchBadge.style.display = '';
        researchBadge.textContent = String(readyTechCount);
      } else {
        researchBadge.style.display = 'none';
      }

      const disc = getDevelopmentDiscount(state, nowSrv);
      const projSpeed = getProjectSpeedMult(state, nowSrv);
      if (disc > 0 || projSpeed > 1) {
        bonusBanner.style.display = '';
        bonusValueB.textContent = `−${Math.round(disc * 100)}% build/repair · ×${projSpeed.toFixed(2)} project speed`;
      } else {
        bonusBanner.style.display = 'none';
      }

      const dismissKey = `cet_cleared_proj_${uid || 'offline'}`;
      loadDismissed(dismissKey);

      if (subTab === 'infra') {
        const gbAvg = gxAverageCondition(state, GX_GOV_BUILDINGS);
        const rdAvg = gxAverageCondition(state, GX_ROADS);
        const exp = gx.exp;
        const builtBuildings = BUILDINGS.filter((d) => (state.b[d.id] || 0) > 0);

        const expReportEl = exp
          ? h(
              'p',
              { className: 'dim' },
              `Day ${exp.n}: Salaries ₨ ${formatNumber(exp.sal)} · Electricity ₨ ${formatNumber(exp.el)} · Infrastructure ₨ ${formatNumber(exp.inf)}`,
              h('br', null),
              h('b', null, `Total ₨ ${formatNumber(exp.total)}`),
              ` (paid ₨ ${formatNumber(exp.paid)})`,
            )
          : h(
              'p',
              { className: 'dim' },
              'First report arrives after one government day (5 min active play). Salaries 3% + electricity 1.5% + infrastructure 1.5% of daily gross income.',
            );

        const renderInfraSection = (items, isRoad) =>
          h(
            'div',
            { className: 'list g2' },
            ...items.map(([key, name]) => {
              const cond = gx.cond[key] ?? 100;
              const col = conditionColor(cond);
              const c20 = gxRepairCost(state, key, false, nowSrv);
              const cFull = gxRepairCost(state, key, true, nowSrv);
              const needsFix = cond < 99.5;
              const subText = isRoad
                ? 'Low condition cuts transport efficiency & business income'
                : cond < 40
                  ? 'Poor — hurts income & happiness'
                  : 'Condition';
              return h(
                'div',
                { className: 'row', style: { '--c': col } },
                h('div', { className: 'em' }, infraIconEl(key, 22)),
                h(
                  'div',
                  null,
                  h('h2', null, name, h('span', { className: 'lv' }, `${Math.round(cond)}%`)),
                  h('p', null, subText),
                  h('div', { className: 'gxm' }, h('b', { style: { width: `${Math.round(cond)}%`, background: col } })),
                ),
                h(
                  'div',
                  { style: { display: 'grid', gap: '4px' } },
                  h(
                    'button',
                    {
                      type: 'button',
                      className: `btn sm ${needsFix && state.cash >= c20 ? 'mint' : 'no'}`,
                      disabled: !needsFix || state.cash < c20,
                      onClick: () => handlers.onFixInfra(key, false),
                    },
                    needsFix ? `+20% ₨ ${formatNumber(c20)}` : '+20%',
                  ),
                  h(
                    'button',
                    {
                      type: 'button',
                      className: `btn sm ${needsFix && state.cash >= cFull ? 'gold' : 'no'}`,
                      disabled: !needsFix || state.cash < cFull,
                      onClick: () => handlers.onFixInfra(key, true),
                    },
                    needsFix ? `${isRoad ? 'Repair all' : 'Renovate'} ₨ ${formatNumber(cFull)}` : 'Full',
                  ),
                ),
              );
            }),
          );

        const upgBlock = builtBuildings.length
          ? h(
              'div',
              { className: 'list g2' },
              ...builtBuildings.map((d) => {
                const lvl = gx.lvl[d.id] || 1;
                const upCost = gxUpgradeCost(state, d.id, nowSrv);
                return h(
                  'div',
                  { className: 'row', style: { '--c': d.c } },
                  h('div', { className: 'em' }, buildingIconEl(d.id, 22)),
                  h(
                    'div',
                    null,
                    h('h2', null, d.n, h('span', { className: 'lv' }, `Lv ${lvl}/5`)),
                    h('p', null, `Output ×${GX_LEVEL_MULTS[lvl - 1]}${lvl < 5 ? ` → ×${GX_LEVEL_MULTS[lvl]}` : ' (MAX)'}`),
                    h('div', { className: 'gxm' }, h('b', { style: { width: `${lvl * 20}%`, background: d.c } })),
                  ),
                  lvl < 5
                    ? h(
                        'button',
                        {
                          type: 'button',
                          className: `btn sm ${state.cash >= upCost ? 'mint' : 'no'}`,
                          disabled: state.cash < upCost,
                          onClick: () => handlers.onUpgradeBuilding(d.id),
                        },
                        `Upgrade ₨ ${formatNumber(upCost)}`,
                      )
                    : h('span', { className: 'lv' }, 'MAX'),
                );
              }),
            )
          : h('p', { className: 'dim' }, 'Buy buildings in the Build tab first.');

        bodySlot.replaceChildren(
          h(
            'div',
            { className: 'gxc' },
            h(
              'p',
              { style: { display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap' } },
              lucideEl('Coins', { size: 15, color: '#ffc23d' }),
              h('b', null, 'Daily Government Expenses'),
              ' ',
              h('span', { className: 'dim' }, '· next in ', h('b', null, `${Math.max(0, GOV_DAY_SEC - Math.floor(gx.acc))}s`), ' of active play'),
            ),
            expReportEl,
            h(
              'p',
              { className: 'dim' },
              `Buildings avg ${Math.round(gbAvg)}% · Transport efficiency ${Math.round(92 + (8 * rdAvg) / 100)}% · ${gx.blk > 0 ? 'Blackout −15% income' : 'Power OK'}${gx.pb > 0 ? ` · Projects bonus +${(gx.pb * 100).toFixed(0)}% income` : ''}`,
            ),
          ),
          h('div', { className: 'gxh' }, lucideEl('Landmark', { size: 15, color: '#ffc23d' }), h('span', null, 'Government Buildings')),
          h('p', { className: 'dim', style: { marginBottom: '8px' } }, 'Renovation costs depend only on ', h('b', null, '20% of your building development'), ' (temporary boosters never inflate repairs).'),
          renderInfraSection(GX_GOV_BUILDINGS, false),
          h('div', { className: 'gxh' }, lucideEl('Wrench', { size: 15, color: '#5ccbff' }), h('span', null, 'Roads & Highways')),
          renderInfraSection(GX_ROADS, true),
          h('div', { className: 'gxh' }, lucideEl('TrendingUp', { size: 15, color: '#3fe0b0' }), h('span', null, 'Building Upgrades (Level 1–5)')),
          upgBlock,
        );
      } else if (subTab === 'projects') {
        const children = [
          h('div', { className: 'gxh', style: { marginTop: '4px' } }, lucideEl('Hammer', { size: 15, color: '#a58cff' }), h('span', null, 'Government Projects')),
          h(
            'p',
            { className: 'dim', style: { marginBottom: '10px' } },
            `Pay in ${PROJECT_STAGES} stages. Construction advances while you are online & active (24h–96h deadlines; 75% refund if missed). Max 3 active.`,
          ),
        ];

        if (!uid) {
          children.push(
            h('p', { className: 'dim', style: { display: 'inline-flex', alignItems: 'center', gap: '6px' } }, lucideEl('Lock', { size: 14 }), ' Sign in to start government projects.'),
          );
        } else {
          const activeProjs = projects
            .filter((p) => p.status === 'active')
            .slice()
            .sort((a, b) => b.st - a.st);

          for (const p of activeProjs) {
            const capMs = Math.floor((p.t.dur * p.paid) / PROJECT_STAGES);
            const liveMs = Math.max(p.progressMs, liveProjectProgress[p.id] ?? p.progressMs);
            const effectiveMs = Math.min(p.t.dur, Math.min(capMs, liveMs));
            const pct = Math.round((effectiveMs / p.t.dur) * 100);
            const invested = Math.ceil(p.t.cost / PROJECT_STAGES) * p.paid;
            const stageCost = Math.ceil(p.t.cost / PROJECT_STAGES);
            const stageCapReached = effectiveMs >= capMs && p.paid < PROJECT_STAGES;
            const statusText = p.pending
              ? 'Starting…'
              : stageCapReached
                ? `Stage ${p.paid}/${PROJECT_STAGES} complete — invest next stage`
                : isUserActive
                  ? 'Building'
                  : 'Paused';

            children.push(
              h(
                'div',
                { className: 'gxc' },
                h('p', { style: { display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap' } }, infraIconEl(p.type, 16), h('b', null, p.t.n), ` · ${statusText}`),
                h('div', { className: 'gxm' }, h('b', { style: { width: `${pct}%`, background: '#7c5cff' } })),
                h(
                  'p',
                  { className: 'dim' },
                  `Progress ${pct}% · Invested ₨ ${formatNumber(invested)} / ₨ ${formatNumber(p.t.cost)} · Stage ${p.paid}/${PROJECT_STAGES}`,
                  h('br', null),
                  lucideEl('Clock', { size: 12, style: { verticalAlign: 'middle', marginRight: '4px' } }),
                  h('b', null, formatDuration(p.dl - nowSrv)),
                  ' left',
                ),
                p.paid < PROJECT_STAGES &&
                  h(
                    'button',
                    {
                      type: 'button',
                      className: `btn sm ${state.cash >= stageCost ? 'mint' : 'no'}`,
                      disabled: state.cash < stageCost,
                      onClick: () => handlers.onPayProjectStage(p.id),
                    },
                    lucideEl('Zap', { size: 13 }),
                    h('span', null, `Invest stage ${p.paid + 1} · ₨ ${formatNumber(stageCost)}`),
                  ),
              ),
            );
          }

          children.push(
            h(
              'div',
              { className: 'list g2' },
              ...Object.keys(GX_PROJECT_TYPES).map((k) => {
                const def = GX_PROJECT_TYPES[k];
                const stageCost = Math.ceil(def.cost / PROJECT_STAGES);
                const canStart = activeCount < 3 && state.cash >= stageCost;
                return h(
                  'div',
                  { className: 'row', style: { '--c': '#7c5cff' } },
                  h('div', { className: 'em' }, infraIconEl(k, 22)),
                  h(
                    'div',
                    null,
                    h('h2', null, def.n, h('span', { className: 'lv' }, `₨ ${formatNumber(def.cost)}`)),
                    h('p', null, `Build ${formatDuration(def.dur)} · Deadline ${formatDuration(def.dl * 60000)} · Reward +40% cash & permanent bonus`),
                  ),
                  h(
                    'button',
                    {
                      type: 'button',
                      className: `btn sm ${canStart ? 'mint' : 'no'}`,
                      disabled: !canStart,
                      onClick: () => handlers.onStartProject(k),
                    },
                    activeCount >= 3 ? 'Max 3 active' : `Start · ₨ ${formatNumber(stageCost)}`,
                  ),
                );
              }),
            ),
          );

          const pastProjects = projects.filter((p) => p.status !== 'active' && !hiddenPastIds.includes(p.id));
          if (pastProjects.length > 0) {
            const det = h(
              'details',
              {
                open: pastOpen,
                style: { marginTop: '10px' },
                onToggle: () => { pastOpen = det.open; },
              },
              h('summary', { className: 'dim', style: { cursor: 'pointer', fontSize: '13px' } }, `Past projects (${pastProjects.length})`),
              h(
                'div',
                { style: { marginTop: '8px' } },
                h(
                  'div',
                  { style: { display: 'flex', justifyContent: 'flex-end', marginBottom: '6px' } },
                  h(
                    'button',
                    {
                      type: 'button',
                      className: 'btn sm',
                      onClick: () => {
                        hiddenPastIds = Array.from(
                          new Set([...hiddenPastIds, ...projects.filter((p) => p.status !== 'active').map((p) => p.id)]),
                        );
                        try {
                          localStorage.setItem(dismissKey, JSON.stringify(hiddenPastIds.slice(-80)));
                        } catch {
                          // ignore
                        }
                        handlers.onForceUpdate();
                      },
                    },
                    'Clear past',
                  ),
                ),
                ...pastProjects
                  .slice()
                  .sort((a, b) => b.st - a.st)
                  .slice(0, 8)
                  .map((p) => {
                    const invested = Math.ceil(p.t.cost / PROJECT_STAGES) * p.paid;
                    const pct = Math.round((Math.min(p.t.dur, p.progressMs) / p.t.dur) * 100);
                    return h(
                      'div',
                      { className: 'gxc' },
                      h(
                        'p',
                        { style: { display: 'flex', alignItems: 'center', gap: '6px' } },
                        infraIconEl(p.type, 15),
                        h('b', null, p.t.n),
                        ' · ',
                        p.status === 'done' ? lucideEl('CheckCircle2', { size: 14, color: '#3fe0b0' }) : 'Failed',
                      ),
                      h('p', { className: 'dim' }, `Progress ${pct}% · Invested ₨ ${formatNumber(invested)} / ₨ ${formatNumber(p.t.cost)} · Stage ${p.paid}/${PROJECT_STAGES}`),
                    );
                  }),
              ),
            );
            children.push(det);
          }
        }

        if (gx.log.length > 0) {
          children.push(
            h('div', { className: 'gxh' }, lucideEl('Bell', { size: 15, color: '#ffc23d' }), h('span', null, 'Recent notices')),
            h('div', { className: 'gxc' }, ...gx.log.map((m) => h('p', { className: 'dim' }, m))),
          );
        }

        bodySlot.replaceChildren(...children);
      } else {
        const researchedCount = techCount(state);
        const techRec = getRecommendedTech(state);
        const ownedBuildings = totalBuildings(state);

        bodySlot.replaceChildren(
          h(
            'div',
            null,
            h(
              'div',
              { className: 'tradelim' },
              h('span', null, lucideEl('FlaskConical', { size: 14, color: '#5ccbff' }), ' National Research Doctrines'),
              h('b', null, `${researchedCount} / ${TECH_TREE.length} Unlocked · ${ownedBuildings} Buildings`),
            ),
            h(
              'div',
              { className: 'gxc', style: { marginBottom: '10px' } },
              h(
                'p',
                { className: 'dim' },
                'Permanent national breakthroughs that strengthen your grid, healthcare, customs, and treasury reserves without breaking economy balance.',
              ),
            ),
            h(
              'div',
              { className: 'list g2' },
              ...TECH_TREE.map((t) => {
                const unlocked = hasTech(state, t.id);
                const check = canUnlockTech(state, t.id);
                const catColor = t.cat === 'economy' ? '#ffc23d' : t.cat === 'civic' ? '#3fe0b0' : '#5ccbff';
                const metReq = ownedBuildings >= t.reqBuildings;
                const recReason = !unlocked ? techRec[t.id] : '';

                return h(
                  'div',
                  { className: `row${recReason ? ' rec-card' : ''}`, style: { '--c': unlocked ? '#3fe0b0' : catColor } },
                  h('div', { className: 'em' }, unlocked ? lucideEl('CheckCircle2', { size: 22, color: '#3fe0b0' }) : lucideEl('FlaskConical', { size: 22, color: catColor })),
                  h(
                    'div',
                    { style: { minWidth: '0' } },
                    h(
                      'h2',
                      null,
                      h('span', null, t.n),
                      h('span', { className: 'lv', style: { background: unlocked ? 'var(--mint)' : catColor, color: '#05161f' } }, t.cat.toUpperCase()),
                      recReason && h('span', { className: 'rec-badge' }, lucideEl('Sparkles', { size: 10 }), h('span', null, `Recommended · ${recReason}`)),
                    ),
                    h('p', null, `${t.d} `, h('b', { style: { color: '#e6dcff' } }, t.effectLabel)),
                    !unlocked && h('p', { className: metReq ? 'ok' : 'bad', style: { fontSize: '11.5px' } }, `Requires ${t.reqBuildings} buildings (${ownedBuildings}/${t.reqBuildings})`),
                  ),
                  unlocked
                    ? h('span', { className: 'lv', style: { background: 'var(--mint)', color: '#04332a' } }, 'Active')
                    : h(
                        'button',
                        {
                          type: 'button',
                          className: `btn sm ${check.ok ? 'gold' : 'no'}`,
                          disabled: !check.ok,
                          title: check.reason || '',
                          onClick: (e) => handlers.onUnlockTech(t.id, e),
                        },
                        `₨ ${formatNumber(t.cost)}`,
                      ),
                );
              }),
            ),
          ),
        );
      }
    },
  };
}

// -------------------------------------------------------------------------
// 3. POLICY TAB (PERSISTENT SLIDERS SO DRAG NEVER DROPS FOCUS)
// -------------------------------------------------------------------------
const TAX_SLIDERS = [
  { key: 'tax', label: 'Income tax', min: 5, max: 45, desc: 'Higher tax = more cash, unhappy people.', color: 'var(--gold)' },
  { key: 'fuel', label: 'Fuel tax', min: 0, max: 50, desc: 'Extra revenue from fuel — but the public hates it.', color: '#ff9a4d' },
  { key: 'carbon', label: 'Carbon tax', min: 0, max: 30, desc: 'Big revenue — Solar, Hydro, Fusion & Green Subsidies offset penalty.', color: '#8bbd8b' },
  { key: 'luxury', label: 'Luxury tax', min: 0, max: 25, desc: 'Taxes the rich. Good revenue, small happiness hit.', color: '#e0b81a' },
  { key: 'corp', label: 'Corporate tax', min: 0, max: 30, desc: 'Taxes businesses; Stock Exchanges amplify revenue.', color: '#c97a3d' },
  { key: 'gst', label: 'Sales tax (GST)', min: 0, max: 25, desc: 'Taxes every purchase. Mild public anger.', color: '#4cc9ff' },
  { key: 'prop', label: 'Property tax', min: 0, max: 15, desc: 'Scales with population. Biggest happiness hit.', color: '#ff6fa3' },
  { key: 'duty', label: 'Import duty', min: 0, max: 30, desc: 'Customs on imports. Each Port boosts the revenue.', color: '#a07bff' },
  { key: 'tourism', label: 'Tourism levy', min: 0, max: 20, desc: 'Visitor tax boosted by Airports & Stadiums; tiny happiness cost.', color: '#38bdf8' },
  { key: 'digital', label: 'Digital economy tax', min: 0, max: 20, desc: 'Online commerce levy boosted by Tech Parks, Data Centers & Fabs.', color: '#a78bfa' },
  { key: 'wealth', label: 'Ultra-wealth levy', min: 0, max: 20, desc: 'Taxes top fortunes; boosted by Central Banks with minimal evasion.', color: '#f472b6' },
];

const SPENDING_SLIDERS = [
  { key: 'wel', label: 'Welfare spending', min: 0, max: 50, desc: 'Costs a share of income, raises happiness & approval.', color: 'var(--mint)' },
  { key: 'edu', label: 'Education', min: 0, max: 30, desc: 'Long-term: raises income and happiness.', color: 'var(--cy)' },
  { key: 'rd', label: 'R&D innovation grant', min: 0, max: 25, desc: 'Funds science to lift national income & slight happiness.', color: '#60a5fa' },
  { key: 'green', label: 'Green energy subsidy', min: 0, max: 25, desc: 'Boosts happiness, cuts carbon penalty & powers Solar/Hydro/Fusion.', color: '#4ade80' },
  { key: 'transitSub', label: 'Public transit subsidy', min: 0, max: 25, desc: 'Boosts happiness & multiplies Metro Transit + Railway Hub output.', color: '#22d3ee' },
];

function createPolicyTab(handlers) {
  const sliderRefs = {};
  const presetRefs = {};

  function makeSlider(s) {
    const valB = h('b', { className: 'f' }, '0%');
    const inp = h('input', {
      type: 'range',
      min: String(s.min),
      max: String(s.max),
      value: String(s.min),
      'aria-label': s.label,
      style: { '--p': '0%' },
    });
    inp.addEventListener('input', () => {
      const val = Number(inp.value);
      const pct = Math.max(0, Math.min(100, ((val - s.min) / (s.max - s.min)) * 100));
      inp.style.setProperty('--p', `${pct}%`);
      valB.textContent = `${val}%`;
      handlers.onPolicyChange(s.key, val);
    });
    sliderRefs[s.key] = { s, inp, valB };
    return h(
      'div',
      { className: 'sl', style: { '--ac': s.color } },
      h('div', null, h('span', null, policyIconEl(s.key, 15), s.label), valB),
      inp,
      h('p', { className: 'dim' }, s.desc),
    );
  }

  const presetGrid = h(
    'div',
    { className: 'preset-grid' },
    ...POLICY_PRESETS.map((preset) => {
      const badge = h('span', { className: 'rec-badge', style: { marginLeft: '6px', display: 'none' } });
      const btn = h(
        'button',
        {
          type: 'button',
          className: 'preset-btn',
          onClick: () => handlers.onApplyPreset(preset.id),
        },
        h('b', null, preset.label, badge),
        h('small', null, preset.desc),
      );
      presetRefs[preset.id] = { btn, badge, lastReason: '' };
      return btn;
    }),
  );

  const fGross = h('b', { style: { color: 'var(--gold)' } }, '');
  const fUpkeep = h('b', { style: { color: 'var(--pink)' } }, '');
  const fSpend = h('b', { style: { color: 'var(--cy)' } }, '');
  const fEvasion = h('b', { style: { color: 'var(--mu)' } }, '');
  const fNet = h('b', { style: { color: 'var(--mint)' } }, '');
  const fTarg = h('b', { style: { color: 'var(--mint)' } }, '');

  const summaryLine = h('p', { className: 'dim', style: { marginBottom: '12px' } });

  const govSubP = h('p', { className: 'dim', style: { marginBottom: '10px' } });
  const govBtns = {};
  const govGrid = h(
    'div',
    { className: 'list g2' },
    ...GOVS.map((g) => {
      const btn = h('button', {
        type: 'button',
        className: 'btn sm gold',
        onClick: () => handlers.onChangeGov(g.id),
      }, '');
      govBtns[g.id] = btn;
      return h(
        'div',
        { className: 'gxc', style: { marginBottom: '0px' } },
        h('b', { style: { display: 'flex', alignItems: 'center', gap: '6px' } }, govTypeIconEl(g.id, 16), h('span', null, g.n)),
        h('p', { className: 'dim' }, g.d),
        btn,
      );
    }),
  );

  const worldEvP = h('p', { className: 'dim', style: { marginTop: '4px' } });

  const resetBtn = h(
    'button',
    { type: 'button', className: 'btn', style: { width: '100%', marginTop: '4px' }, onClick: () => handlers.onResetGame() },
    lucideEl('RefreshCw', { size: 15 }),
    h('span', null, 'New Game'),
  );
  const saveCloudBtn = h(
    'button',
    { type: 'button', className: 'btn mint', style: { width: '100%', marginTop: '8px' }, onClick: () => handlers.onSaveCloudNow() },
    lucideEl('Cloud', { size: 16 }),
    h('span', null, 'Save to cloud now'),
  );

  const root = h(
    'div',
    null,
    h('div', { className: 'gxh', style: { marginTop: '0px' } }, lucideEl('Sparkles', { size: 15, color: '#ffc23d' }), h('span', null, 'Quick Policy Presets')),
    presetGrid,
    h(
      'div',
      { className: 'gxc', style: { marginBottom: '12px' } },
      h('p', { style: { display: 'flex', alignItems: 'center', gap: '6px' } }, lucideEl('SlidersHorizontal', { size: 15, color: '#5ccbff' }), h('b', null, 'Live Fiscal Breakdown')),
      h(
        'div',
        { className: 'fiscal-grid' },
        h('div', { className: 'fiscal-cell' }, h('small', null, 'Gross / min'), fGross),
        h('div', { className: 'fiscal-cell' }, h('small', null, 'City Upkeep'), fUpkeep),
        h('div', { className: 'fiscal-cell' }, h('small', null, 'Policy Spend'), fSpend),
        h('div', { className: 'fiscal-cell' }, h('small', null, 'Tax Evasion'), fEvasion),
        h('div', { className: 'fiscal-cell' }, h('small', null, 'Net / min'), fNet),
        h('div', { className: 'fiscal-cell' }, h('small', null, 'Target Happiness'), fTarg),
      ),
    ),
    h('div', { className: 'gxh' }, lucideEl('Coins', { size: 15, color: '#ffc23d' }), h('span', null, 'Tax Policies')),
    ...TAX_SLIDERS.map(makeSlider),
    h('div', { className: 'gxh' }, lucideEl('Landmark', { size: 15, color: '#3fe0b0' }), h('span', null, 'National Spending & Subsidies')),
    ...SPENDING_SLIDERS.map(makeSlider),
    summaryLine,
    h(
      'div',
      { className: 'gxc', style: { marginBottom: '12px' } },
      h('h2', { style: { marginBottom: '4px', display: 'flex', alignItems: 'center', gap: '7px' } }, lucideEl('Landmark', { size: 18, color: '#ffc23d' }), h('span', null, 'Government')),
      govSubP,
      govGrid,
    ),
    h(
      'div',
      { className: 'gxc', style: { marginBottom: '12px' } },
      h('h2', { style: { display: 'flex', alignItems: 'center', gap: '7px' } }, lucideEl('Globe', { size: 18, color: '#5ccbff' }), h('span', null, 'World Events')),
      worldEvP,
      h('p', { className: 'cnote' }, 'Global boosts appear on a fixed server-time schedule — same for every player.'),
    ),
    resetBtn,
    saveCloudBtn,
  );

  return {
    el: root,
    update(state, uid, serverOffsetMs = 0) {
      const nowSrv = (state.t || Date.now()) + serverOffsetMs;
      const ti = taxInfo(state);
      const inc = calculateIncome(state, { nowMs: nowSrv });
      const gov = getGovDefinition(state);
      const govCd = Math.max(0, (state.govT || 0) + GOV_CHANGE_CD_MS - nowSrv);
      const worldEv = currentWorldEvent(nowSrv);
      const targHap = Math.round(targetHappiness(state));
      const recPreset = getRecommendedPolicyHint(state);

      for (const preset of POLICY_PRESETS) {
        const ref = presetRefs[preset.id];
        const isRec = recPreset.id === preset.id;
        ref.btn.className = `preset-btn${isRec ? ' rec-card' : ''}`;
        const reason = isRec ? recPreset.reason : '';
        if (reason !== ref.lastReason) {
          ref.lastReason = reason;
          if (reason) {
            ref.badge.style.display = '';
            ref.badge.replaceChildren(lucideEl('Sparkles', { size: 10 }), h('span', null, reason));
          } else {
            ref.badge.style.display = 'none';
          }
        }
      }

      fGross.textContent = `₨ ${formatNumber(inc.gross * 60)}`;
      fUpkeep.textContent = `−${Math.round(inc.upkeepRate * 100)}%`;
      fSpend.textContent = `−${Math.round(inc.policySpendShare * 100)}%`;
      fEvasion.textContent = `${Math.round(ti.ev * 100)}%`;
      fEvasion.style.color = ti.ev > 0.2 ? 'var(--pink)' : 'var(--mu)';
      fNet.textContent = `₨ ${formatNumber(inc.net * 60)}`;
      fTarg.textContent = `${targHap}%`;
      fTarg.style.color = targHap >= 65 ? 'var(--mint)' : targHap >= 40 ? 'var(--gold)' : 'var(--pink)';

      for (const ref of Object.values(sliderRefs)) {
        const val = Number(state[ref.s.key] || 0);
        if (document.activeElement !== ref.inp) {
          ref.inp.value = String(val);
        }
        const pct = Math.max(0, Math.min(100, ((val - ref.s.min) / (ref.s.max - ref.s.min)) * 100));
        ref.inp.style.setProperty('--p', `${pct}%`);
        ref.valB.textContent = `${val}%`;
      }

      summaryLine.replaceChildren(
        'Target happiness: ',
        h('b', { className: 'f', style: { color: 'var(--mint)' } }, `${targHap}%`),
        ' · Effective tax mult: ',
        h('b', { className: 'f', style: { color: 'var(--gold)' } }, `×${ti.mult.toFixed(2)}`),
        ti.ev > 0.05 ? ` (Tax evasion: ${Math.round(ti.ev * 100)}%)` : '',
      );

      govSubP.replaceChildren(
        'Current: ',
        h('b', null, gov.n),
        ` — ${gov.d}.${govCd > 0 ? ` Next change in ${Math.ceil(govCd / 3600000)}h.` : ''}`,
      );
      for (const g of GOVS) {
        const active = g.id === gov.id;
        const disabled = active || govCd > 0 || state.cash < g.cost;
        const btn = govBtns[g.id];
        btn.className = `btn sm ${disabled ? 'no' : 'gold'}`;
        btn.disabled = disabled;
        btn.textContent = active ? 'Active' : g.cost ? `₨ ${formatNumber(g.cost)}` : 'Free';
      }

      if (worldEv) {
        worldEvP.replaceChildren(
          h('b', { className: 'ok' }, `${worldEv.ev.n}: ×${worldEv.ev.m} income`),
          ` — ${Math.ceil(worldEv.left / 1000)}s left`,
        );
      } else {
        worldEvP.textContent = 'No world event right now. Check back soon.';
      }

      resetBtn.style.display = !uid ? '' : 'none';
      saveCloudBtn.style.display = uid ? '' : 'none';
    },
  };
}

// -------------------------------------------------------------------------
// 4. PLAYERS TAB (PRESERVES CHAT/DM INPUTS, SCROLL POSITION & GDPCHART)
// -------------------------------------------------------------------------
const WHEN_FORMATTER = new Intl.DateTimeFormat(undefined, {
  month: 'short',
  day: 'numeric',
  hour: '2-digit',
  minute: '2-digit',
});

function formatWhen(ms) {
  if (!ms) return '';
  return WHEN_FORMATTER.format(new Date(ms));
}

function createPlayersTab(handlers) {
  const gdpChart = createGdpChart();
  let chatText = '';
  let dmText = '';
  let lastChatLen = 0;
  let lastDmLen = 0;
  let lastDmUid = '';
  let lastMode = '';

  const offlineBox = h(
    'div',
    null,
    h(
      'h2',
      { className: 'f sec' },
      lucideEl('Globe', { size: 18, color: '#3fe0b0' }),
      h('span', null, 'Real players'),
      h('span', { className: 'lv', style: { background: 'var(--mint)', color: '#04332a' } }, 'LIVE'),
    ),
    h(
      'div',
      { className: 'empty' },
      h('div', { className: 'big' }, lucideEl('Lock', { size: 28 })),
      h('p', { className: 'dim' }, 'Sign in to see active players and chat.'),
      h('button', { type: 'button', className: 'btn gold', onClick: () => handlers.onOpenLogin() }, 'Sign in'),
    ),
  );

  const subLbBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('lb') }, lucideEl('TrendingUp', { size: 14 }), h('span', null, 'Active'));
  const subChatBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('chat') }, lucideEl('MessageSquare', { size: 14 }), h('span', null, 'Chat'));
  const subDmBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('dm') }, lucideEl('Mail', { size: 14 }), h('span', null, 'Private'));

  const chatListEl = h('div', { className: 'chlist' });
  const chatInputEl = h('input', {
    className: 'inp',
    maxLength: '200',
    placeholder: 'Say something…',
    value: '',
    onInput: (e) => { chatText = e.target.value; },
  });
  async function submitChat() {
    const trimmed = chatText.trim();
    if (!trimmed) return;
    const ok = await handlers.onSendGlobalChat(trimmed);
    if (ok) {
      chatText = '';
      chatInputEl.value = '';
    }
  }
  chatInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      void submitChat();
    }
  });
  const chatBox = h(
    'div',
    { className: 'chbox' },
    h('div', { className: 'chhd' }, lucideEl('Globe', { size: 16, color: '#5ccbff' }), h('span', null, 'Global chat'), h('small', null, 'be kind · max 200 chars')),
    chatListEl,
    h('div', { className: 'chin' }, chatInputEl, h('button', { type: 'button', className: 'btn sm mint', onClick: () => void submitChat() }, 'Send')),
  );

  const dmHeaderFlag = h('span', { className: 'cmf' });
  const dmHeaderName = h('span', null, '');
  const dmListEl = h('div', { className: 'chlist' });
  const dmInputEl = h('input', {
    className: 'inp',
    maxLength: '300',
    placeholder: 'Message…',
    value: '',
    onInput: (e) => { dmText = e.target.value; },
  });
  async function submitDm() {
    const trimmed = dmText.trim();
    if (!trimmed) return;
    const ok = await handlers.onSendDm(trimmed);
    if (ok) {
      dmText = '';
      dmInputEl.value = '';
    }
  }
  dmInputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      void submitDm();
    }
  });
  const dmThreadBox = h(
    'div',
    { className: 'chbox' },
    h(
      'div',
      { className: 'chhd' },
      h('button', { type: 'button', className: 'btn sm', style: { minWidth: '0' }, 'aria-label': 'Back to DM list', onClick: () => handlers.onBackDm() }, '←'),
      dmHeaderFlag,
      dmHeaderName,
    ),
    dmListEl,
    h('div', { className: 'chin' }, dmInputEl, h('button', { type: 'button', className: 'btn sm mint', onClick: () => void submitDm() }, 'Send')),
  );

  const lbWrap = h('div', null);
  const dmListWrap = h('div', null);
  const loadingP = h('p', { className: 'dim' }, 'Loading…');

  const onlineBox = h(
    'div',
    null,
    h('div', { className: 'subtabs' }, subLbBtn, subChatBtn, subDmBtn),
    loadingP,
    lbWrap,
    chatBox,
    dmListWrap,
    dmThreadBox,
  );

  const root = h('div', null, offlineBox, onlineBox);
  let lastChatRenderKey = '';
  let lastDmRenderKey = '';

  return {
    el: root,
    update(ctx) {
      const { state, uid, ready, subTab, leaderboard, lbLoaded, serverOffsetMs, globalChat, dmMessages, dmRecipient, recentDms } = ctx;
      const currentGdp = calculateGdp(state);
      gdpChart.update(state.hist, currentGdp);

      if (!uid) {
        offlineBox.style.display = '';
        onlineBox.style.display = 'none';
        if (gdpChart.el.parentNode !== offlineBox) offlineBox.appendChild(gdpChart.el);
        lastMode = 'offline';
        return;
      }

      offlineBox.style.display = 'none';
      onlineBox.style.display = '';
      subLbBtn.className = subTab === 'lb' ? 'on' : '';
      subChatBtn.className = subTab === 'chat' ? 'on' : '';
      subDmBtn.className = subTab === 'dm' ? 'on' : '';

      loadingP.style.display = !ready ? '' : 'none';
      lbWrap.style.display = ready && subTab === 'lb' ? '' : 'none';
      chatBox.style.display = ready && subTab === 'chat' ? '' : 'none';
      dmListWrap.style.display = ready && subTab === 'dm' && !dmRecipient ? '' : 'none';
      dmThreadBox.style.display = ready && subTab === 'dm' && dmRecipient ? '' : 'none';

      if (!ready) return;
      const nowSrv = (state.t || Date.now()) + serverOffsetMs;

      if (subTab === 'lb') {
        const nodes = [
          h(
            'h2',
            { className: 'f sec' },
            lucideEl('Globe', { size: 18, color: '#3fe0b0' }),
            h('span', null, 'Active players'),
            h('span', { className: 'lv', style: { background: 'var(--mint)', color: '#04332a' } }, 'ONLINE'),
          ),
        ];
        if (!lbLoaded) {
          nodes.push(h('p', { className: 'dim' }, 'Loading players…'));
        } else {
          nodes.push(
            h(
              'div',
              { className: 'list' },
              ...leaderboard.map((p, idx) => {
                const me = p.id === uid;
                const rk = RANKS[p.rank || 0] || RANKS[0];
                const isOnline = !me && p.seen && nowSrv - p.seen <= ACTIVE_WINDOW_MS;
                const subTier = isProfileSubActive(p, nowSrv);
                const subLabel = subTier ? SUBSCRIPTIONS.find((x) => x.id === subTier)?.periodLabel || subTier : '';
                return h(
                  'div',
                  { className: `row pcard ${me ? 'me' : ''} ${subTier ? `sub-card sub-card--${subTier}` : ''}` },
                  h('div', { className: `medal m${idx + 1}` }, String(idx + 1)),
                  h(
                    'div',
                    { style: { minWidth: '0' } },
                    h(
                      'h2',
                      { style: { display: 'flex', gap: '7px', alignItems: 'center' } },
                      h('span', { style: { width: '24px', height: '17px', flex: 'none', display: 'inline-block' } }, countryFlagEl(p.countryCode, p.countryCode)),
                      isOnline && h('i', { className: 'onl' }),
                      h('span', { style: { overflow: 'hidden', textOverflow: 'ellipsis' } }, p.username),
                      rk.id > 0 && h('span', { className: 'rank-badge', style: { '--c': rk.c }, title: rk.n }, rankEmblemEl(rk.id, 18)),
                      subTier && h(
                        'span',
                        { className: `sub-crest sub-crest--${subTier}`, title: `${subLabel} Subscriber` },
                        h('span', { className: 'sub-crest-ic' }, subIconEl(subTier, 11)),
                        h('span', null, subLabel),
                      ),
                    ),
                    h('p', null, `${p.countryName} · GDP ₨ ${formatNumber(p.gdp || 0)}${me ? ' · you' : ''}`),
                  ),
                  h(
                    'div',
                    { className: 'tbtn', style: { gridAutoFlow: 'column' } },
                    h('button', { type: 'button', className: 'btn sm', style: { minWidth: '0' }, title: 'Profile', 'aria-label': `View ${p.username} profile`, onClick: () => handlers.onOpenProfile(p.id) }, lucideEl('IdCard', { size: 15 })),
                    !me && h('button', { type: 'button', className: 'btn sm mint', style: { minWidth: '0' }, title: 'Gift', 'aria-label': `Gift ${p.username}`, onClick: () => handlers.onStartGift(p.id) }, lucideEl('Gift', { size: 15 })),
                    !me && h('button', { type: 'button', className: 'btn sm', style: { minWidth: '0' }, title: 'Message', 'aria-label': `Message ${p.username}`, onClick: () => handlers.onOpenDm(p.id, p.username, p.countryCode) }, lucideEl('Mail', { size: 15 })),
                  ),
                );
              }),
            ),
            h(
              'p',
              { className: 'cnote', style: { marginTop: '8px' } },
              `${leaderboard.length < 2 ? 'Nobody else is online right now. ' : ''}Only players active in the last 4 minutes are listed. Ranks update live.`,
            ),
          );
        }
        nodes.push(gdpChart.el);
        lbWrap.replaceChildren(...nodes);
      } else if (subTab === 'chat') {
        const chatKey = globalChat.map((m) => `${m.id}_${m.ms}`).join('|') + '|' + leaderboard.map((p) => `${p.id}_${isProfileSubActive(p, nowSrv)}`).join(',');
        if (chatKey !== lastChatRenderKey) {
          lastChatRenderKey = chatKey;
          if (globalChat.length) {
            chatListEl.replaceChildren(
              ...globalChat.map((m) => {
                const rk = RANKS[m.rank || 0] || RANKS[0];
                const senderProfile = leaderboard.find((p) => p.id === m.uid);
                const subTier = isProfileSubActive(senderProfile, nowSrv);
                return h(
                  'div',
                  { className: `cm ${m.uid === uid ? 'me' : ''} ${subTier ? `sub-card sub-card--${subTier}` : ''}` },
                  h(
                    'div',
                    { className: 'cmh' },
                    h('span', { className: 'cmf' }, countryFlagEl(m.cc, m.cc, { className: '' })),
                    h('button', { type: 'button', className: 'cmn', onClick: () => handlers.onOpenProfile(m.uid) }, m.name || 'Player'),
                    rk.id > 0 && rankEmblemEl(rk.id, 15),
                    subTier && h('span', { className: `sub-crest sub-crest--${subTier}` }, h('span', { className: 'sub-crest-ic' }, subIconEl(subTier, 10))),
                    h('small', null, formatWhen(m.ms)),
                  ),
                  h('div', { className: 'cmt' }, m.text),
                );
              }),
            );
          } else {
            chatListEl.replaceChildren(h('p', { className: 'dim', style: { textAlign: 'center', margin: '16px 0' } }, 'No messages yet — say hello!'));
          }
        }
        if (globalChat.length !== lastChatLen || lastMode !== 'chat') {
          lastChatLen = globalChat.length;
          chatListEl.scrollTop = chatListEl.scrollHeight;
        }
      } else if (!dmRecipient) {
        const nodes = [h('p', { className: 'dim', style: { marginBottom: '8px' } }, 'Private chats. Tap the mail icon next to any player to start one.')];
        if (recentDms.length) {
          nodes.push(
            h(
              'div',
              { className: 'list' },
              ...recentDms.map((r) =>
                h(
                  'div',
                  { className: 'row' },
                  h('div', { className: 'em' }, countryFlagEl(r.cc, r.cc)),
                  h('div', null, h('h2', null, r.name)),
                  h('button', { type: 'button', className: 'btn sm mint', onClick: () => handlers.onOpenDm(r.uid, r.name, r.cc) }, lucideEl('Mail', { size: 14 }), h('span', null, 'Open')),
                ),
              ),
            ),
          );
        } else {
          nodes.push(
            h('div', { className: 'empty' }, h('div', { className: 'big' }, lucideEl('Mail', { size: 28 })), h('p', { className: 'dim' }, 'No private chats yet.')),
          );
        }
        dmListWrap.replaceChildren(...nodes);
      } else {
        if (dmRecipient.uid !== lastDmUid) {
          dmHeaderFlag.replaceChildren(countryFlagEl(dmRecipient.cc, dmRecipient.cc, { className: '' }));
          dmHeaderName.textContent = dmRecipient.name;
          dmInputEl.placeholder = `Message ${dmRecipient.name}…`;
        }
        const dmKey = `${dmRecipient.uid}|` + dmMessages.map((m) => `${m.id}_${m.ms}`).join('|');
        if (dmKey !== lastDmRenderKey) {
          lastDmRenderKey = dmKey;
          if (dmMessages.length) {
            dmListEl.replaceChildren(
              ...dmMessages.map((m) =>
                h(
                  'div',
                  { className: `cm ${m.uid === uid ? 'me' : ''}` },
                  h(
                    'div',
                    { className: 'cmh' },
                    h('span', { className: 'cmf' }, countryFlagEl(m.cc, m.cc, { className: '' })),
                    h('button', { type: 'button', className: 'cmn', onClick: () => handlers.onOpenProfile(m.uid) }, m.name || 'Player'),
                    h('small', null, formatWhen(m.ms)),
                  ),
                  h('div', { className: 'cmt' }, m.text),
                ),
              ),
            );
          } else {
            dmListEl.replaceChildren(h('p', { className: 'dim', style: { textAlign: 'center', margin: '16px 0' } }, 'No messages yet — say hello!'));
          }
        }
        if (dmMessages.length !== lastDmLen || dmRecipient.uid !== lastDmUid || lastMode !== 'dm_thread') {
          lastDmLen = dmMessages.length;
          lastDmUid = dmRecipient.uid;
          dmListEl.scrollTop = dmListEl.scrollHeight;
        }
      }
      lastMode = subTab === 'dm' && dmRecipient ? 'dm_thread' : subTab;
    },
  };
}

// -------------------------------------------------------------------------
// 5. STICKERS TAB
// -------------------------------------------------------------------------
function createStickersTab(handlers) {
  const root = h('div', null);
  return {
    el: root,
    update(state, serverOffsetMs = 0) {
      const unique = stickerUniqueCount(state);
      const bonusPct = (stickerBonus(state) * 100).toFixed(1);
      const fusable = STICKERS.filter((s) => (state.stk[s.id] || 0) >= 3);
      const nowSrv = (state.t || Date.now()) + serverOffsetMs;
      const cdLeftSec = Math.max(0, Math.ceil(((state.crateCd || 0) - nowSrv) / 1000));
      const canBuyCashCrate = cdLeftSec <= 0 && state.cash >= CRATE_COST_CASH;
      const canBuyGemCrate = state.gems >= CRATE_COST_GEMS;

      const nodes = [
        h(
          'div',
          { className: 'tradelim' },
          h('span', null, 'Collected ', h('b', null, `${unique}/${STICKERS.length}`), ' unique stickers'),
          h('span', null, 'Income bonus ', h('b', { className: 'ok' }, `+${bonusPct}%`), ' (+0.5% each)'),
        ),
        h(
          'div',
          { className: 'crate-grid' },
          h(
            'div',
            { className: 'crate-card' },
            h('div', { className: 'em', style: { '--c': '#3fe0b0' } }, lucideEl('Package', { size: 23, color: '#3fe0b0' })),
            h('div', null, h('h2', { style: { fontSize: '14px', margin: '0' } }, 'Standard Crate'), h('p', { className: 'dim', style: { fontSize: '11.5px', margin: '2px 0 0' } }, '1 random sticker · 5m cooldown')),
            h(
              'button',
              {
                type: 'button',
                className: `btn sm ${canBuyCashCrate ? 'mint' : 'no'}`,
                disabled: !canBuyCashCrate,
                onClick: (e) => handlers.onBuyCrate('cash', e),
              },
              cdLeftSec > 0
                ? h('span', null, `${cdLeftSec}s CD`)
                : [cashCoinEl(14), h('span', null, `₨ ${formatNumber(CRATE_COST_CASH)}`)],
            ),
          ),
          h(
            'div',
            { className: 'crate-card' },
            h('div', { className: 'em', style: { '--c': '#ffc23d' } }, lucideEl('Sparkles', { size: 23, color: '#ffc23d' })),
            h('div', null, h('h2', { style: { fontSize: '14px', margin: '0' } }, 'Royal Crate'), h('p', { className: 'dim', style: { fontSize: '11.5px', margin: '2px 0 0' } }, '2 stickers · 1 Rare+ guaranteed')),
            h(
              'button',
              {
                type: 'button',
                className: `btn sm ${canBuyGemCrate ? 'gold' : 'no'}`,
                disabled: !canBuyGemCrate,
                onClick: (e) => handlers.onBuyCrate('gems', e),
              },
              gemDiamondEl(14),
              h('span', null, String(CRATE_COST_GEMS)),
            ),
          ),
        ),
      ];

      if (fusable.length > 0) {
        nodes.push(
          h(
            'div',
            { className: 'gxc', style: { marginBottom: '12px' } },
            h(
              'p',
              { style: { marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '6px', flexWrap: 'wrap' } },
              lucideEl('Sparkles', { size: 15, color: '#a58cff' }),
              h('b', null, 'Fuse Duplicates'),
              ' ',
              h('span', { className: 'dim' }, '· Trade 3 identical stickers for 1 higher-rarity sticker'),
            ),
            h(
              'div',
              { className: 'chiprow' },
              ...fusable.map((s) =>
                h('button', { type: 'button', onClick: () => handlers.onFuseSticker(s.id) }, h('span', null, `${s.n} (3→1)`)),
              ),
            ),
          ),
        );
      }

      nodes.push(
        h(
          'div',
          { className: 'stkgrid' },
          ...STICKERS.map((s) => {
            const count = state.stk[s.id] || 0;
            const [rarityLabel, rarityColor] = RARITY_META[s.r];
            const canFuse = count >= 3;
            return h(
              'div',
              { className: `stkcard ${count > 0 ? '' : 'miss'}${canFuse ? ' rec-card' : ''}` },
              stickerArtEl(s.id, 32),
              h('span', { className: 'stk-n' }, s.n),
              h('span', { className: 'stk-r', style: { color: rarityColor }, title: rarityLabel }, '★'.repeat(s.r)),
              canFuse && h('span', { className: 'rec-badge' }, lucideEl('Sparkles', { size: 10 }), h('span', null, 'Fuse Ready')),
              h('small', { className: 'dim' }, count > 0 ? `×${count}` : rarityLabel),
              canFuse &&
                h(
                  'button',
                  {
                    type: 'button',
                    className: 'btn sm mint',
                    style: { minWidth: '0', padding: '5px 10px', fontSize: '11px', marginTop: '2px' },
                    onClick: () => handlers.onFuseSticker(s.id),
                  },
                  'Fuse 3×',
                ),
            );
          }),
        ),
      );

      root.replaceChildren(...nodes);
    },
  };
}

function summarizeGift(t) {
  const parts = [];
  if (t.offerCash > 0) parts.push(`₨ ${formatNumber(t.offerCash)}`);
  if (t.offerGems > 0) parts.push(`${t.offerGems} Gems`);
  const stkCount = Object.values(t.offerStk || {}).reduce((a, b) => a + (b || 0), 0);
  if (stkCount > 0) parts.push(`${stkCount} Stickers`);
  return parts.length ? parts.join(' · ') : 'Empty gift';
}

function createGiftsTab(handlers) {
  let searchText = '';
  let searchResults = null;
  let searching = false;
  let lastSearchSeq = 0;
  const busyIds = {};

  async function runTradeAction(id, fn) {
    if (busyIds[id]) return;
    busyIds[id] = true;
    handlers.onForceUpdate();
    try {
      await fn(id);
    } finally {
      delete busyIds[id];
      handlers.onForceUpdate();
    }
  }

  const offlineBox = h(
    'div',
    { className: 'empty' },
    h('div', { className: 'big' }, lucideEl('Gift', { size: 28, color: '#ffc23d' })),
    h('p', { className: 'dim' }, 'Sign in to send and receive gifts with other players.'),
    h('button', { type: 'button', className: 'btn gold', onClick: () => handlers.onOpenLogin() }, lucideEl('Lock', { size: 15 }), h('span', null, 'Sign in')),
  );

  const loadingP = h('p', { className: 'dim' }, 'Loading…');
  const limitB = h('b', null, '0 / 15 sent');
  const inBadge = h('em', { style: { display: 'none' } }, '');
  const outSpan = h('span', null, 'Sent (0)');
  const subInBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('in') }, lucideEl('Package', { size: 14 }), h('span', null, 'Inbox'), inBadge);
  const subOutBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('out') }, lucideEl('Mail', { size: 14 }), outSpan);
  const subHistBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('hist') }, lucideEl('Clock', { size: 14 }), h('span', null, 'History'));
  const subFindBtn = h('button', { type: 'button', onClick: () => handlers.onChangeSubTab('find') }, lucideEl('Gift', { size: 14 }), h('span', null, 'Send Gift'));

  const paneIn = h('div', null);
  const paneOut = h('div', null);
  const paneHist = h('div', null);
  const searchInput = h('input', {
    className: 'inp',
    placeholder: 'Search username (min 2 chars)…',
    value: '',
  });
  const searchResultsSlot = h('div', null);
  const paneFind = h('div', null, searchInput, searchResultsSlot);

  searchInput.addEventListener('input', () => {
    searchText = searchInput.value;
    const trimmed = searchText.trim();
    const seq = ++lastSearchSeq;
    if (trimmed.length < 2) {
      searchResults = null;
      searching = false;
      handlers.onForceUpdate();
      return;
    }
    searching = true;
    handlers.onForceUpdate();
    void handlers.onSearchPlayers(trimmed).then((res) => {
      if (seq === lastSearchSeq) {
        searchResults = res;
        searching = false;
        handlers.onForceUpdate();
      }
    });
  });

  const mainBox = h(
    'div',
    null,
    h('div', { className: 'tradelim' }, h('span', null, 'Daily gift allowance'), limitB),
    h('div', { className: 'subtabs' }, subInBtn, subOutBtn, subHistBtn, subFindBtn),
    paneIn,
    paneOut,
    paneHist,
    paneFind,
  );

  const root = h('div', null, offlineBox, loadingP, mainBox);

  return {
    el: root,
    update(ctx) {
      const { uid, ready, subTab, trades, leaderboard, sentToday, nowSrvMs } = ctx;
      if (!uid) {
        offlineBox.style.display = '';
        loadingP.style.display = 'none';
        mainBox.style.display = 'none';
        return;
      }
      offlineBox.style.display = 'none';
      if (!ready) {
        loadingP.style.display = '';
        mainBox.style.display = 'none';
        return;
      }
      loadingP.style.display = 'none';
      mainBox.style.display = '';

      const nowSrv = nowSrvMs || Date.now();
      const incoming = trades.filter((t) => t.to === uid && t.status === 'pending' && t.expMs > nowSrv);
      const outgoing = trades.filter((t) => t.from === uid && t.status === 'pending' && t.expMs > nowSrv);
      const history = trades
        .filter((t) => t.status !== 'pending' || t.expMs <= nowSrv)
        .slice()
        .sort((a, b) => (b.resMs || b.createdMs) - (a.resMs || a.createdMs));

      limitB.textContent = `${sentToday} / ${DAILY_GIFT_MAX} sent`;
      subInBtn.className = subTab === 'in' ? 'on' : '';
      subOutBtn.className = subTab === 'out' ? 'on' : '';
      subHistBtn.className = subTab === 'hist' ? 'on' : '';
      subFindBtn.className = subTab === 'find' ? 'on' : '';
      if (incoming.length > 0) {
        inBadge.style.display = '';
        inBadge.textContent = String(incoming.length);
      } else {
        inBadge.style.display = 'none';
      }
      outSpan.textContent = `Sent (${outgoing.length})`;

      paneIn.style.display = subTab === 'in' ? '' : 'none';
      paneOut.style.display = subTab === 'out' ? '' : 'none';
      paneHist.style.display = subTab === 'hist' ? '' : 'none';
      paneFind.style.display = subTab === 'find' ? '' : 'none';

      if (subTab === 'in') {
        if (incoming.length) {
          paneIn.replaceChildren(
            h(
              'div',
              { className: 'list' },
              ...incoming.map((t) => {
                const leftMs = Math.max(0, t.expMs - nowSrv);
                const pct = Math.max(0, Math.min(100, (leftMs / 120000) * 100));
                return h(
                  'div',
                  { className: 'row trow', onClick: () => handlers.onOpenGiftReview(t) },
                  h('div', { className: 'em' }, countryFlagEl(t.fromCountry, t.fromCountry)),
                  h(
                    'div',
                    { style: { minWidth: '0' } },
                    h('h2', null, `${t.fromName} `, h('span', { className: 'lv st-pending' }, `${Math.ceil(leftMs / 1000)}s`)),
                    h('p', null, `${summarizeGift(t)}${t.message ? ` — “${t.message}”` : ''}`),
                    h('div', { className: 'countdown' }, h('i', { style: { width: `${pct}%` } })),
                  ),
                  h(
                    'div',
                    { className: 'tbtn' },
                    h(
                      'button',
                      {
                        type: 'button',
                        className: 'btn sm mint',
                        disabled: !!busyIds[t.id],
                        onClick: (e) => {
                          e.stopPropagation();
                          void runTradeAction(t.id, handlers.onAcceptTrade);
                        },
                      },
                      busyIds[t.id] ? '…' : 'Accept',
                    ),
                    h(
                      'button',
                      {
                        type: 'button',
                        className: 'btn sm red',
                        disabled: !!busyIds[t.id],
                        onClick: (e) => {
                          e.stopPropagation();
                          void runTradeAction(t.id, handlers.onRejectTrade);
                        },
                      },
                      'Decline',
                    ),
                  ),
                );
              }),
            ),
          );
        } else {
          paneIn.replaceChildren(
            h('div', { className: 'empty' }, h('div', { className: 'big' }, lucideEl('Package', { size: 28 })), h('p', { className: 'dim' }, 'No incoming gifts right now.')),
          );
        }
      } else if (subTab === 'out') {
        if (outgoing.length) {
          paneOut.replaceChildren(
            h(
              'div',
              { className: 'list' },
              ...outgoing.map((t) => {
                const leftMs = Math.max(0, t.expMs - nowSrv);
                const pct = Math.max(0, Math.min(100, (leftMs / 120000) * 100));
                return h(
                  'div',
                  { className: 'row trow', onClick: () => handlers.onOpenGiftReview(t) },
                  h('div', { className: 'em' }, countryFlagEl(t.toCountry, t.toCountry)),
                  h(
                    'div',
                    { style: { minWidth: '0' } },
                    h('h2', null, `To ${t.toName} `, h('span', { className: 'lv st-pending' }, `${Math.ceil(leftMs / 1000)}s`)),
                    h('p', null, summarizeGift(t)),
                    h('div', { className: 'countdown' }, h('i', { style: { width: `${pct}%` } })),
                  ),
                  h(
                    'button',
                    {
                      type: 'button',
                      className: 'btn sm red',
                      disabled: !!busyIds[t.id],
                      onClick: (e) => {
                        e.stopPropagation();
                        void runTradeAction(t.id, handlers.onCancelTrade);
                      },
                    },
                    busyIds[t.id] ? '…' : 'Cancel',
                  ),
                );
              }),
            ),
          );
        } else {
          paneOut.replaceChildren(
            h(
              'div',
              { className: 'empty' },
              h('div', { className: 'big' }, lucideEl('Sparkles', { size: 28 })),
              h('p', { className: 'dim' }, 'No active outgoing gifts.'),
              h('button', { type: 'button', className: 'btn mint', onClick: () => handlers.onChangeSubTab('find') }, 'Find a player'),
            ),
          );
        }
      } else if (subTab === 'hist') {
        if (history.length) {
          paneHist.replaceChildren(
            h(
              'div',
              { className: 'list' },
              ...history.map((t) => {
                const isSender = t.from === uid;
                const peerName = isSender ? `To ${t.toName}` : `From ${t.fromName}`;
                const peerCc = isSender ? t.toCountry : t.fromCountry;
                const effStatus = t.status === 'pending' && t.expMs <= nowSrv ? 'expired' : t.status;
                return h(
                  'div',
                  { className: 'row trow', onClick: () => handlers.onOpenGiftReview(t) },
                  h('div', { className: 'em' }, countryFlagEl(peerCc, peerCc)),
                  h(
                    'div',
                    { style: { minWidth: '0' } },
                    h('h2', null, `${peerName} `, h('span', { className: `lv st-${effStatus}` }, effStatus)),
                    h('p', null, summarizeGift(t)),
                  ),
                );
              }),
            ),

        } else {
          paneHist.replaceChildren(
            h('div', { className: 'empty' }, h('div', { className: 'big' }, lucideEl('Clock', { size: 28 })), h('p', { className: 'dim' }, 'No past gifts yet.')),

        }
      } else {
        const candidates = searchResults !== null ? searchResults : leaderboard.filter((p) => p.id !== uid);
        if (searching) {
          searchResultsSlot.replaceChildren(h('p', { className: 'dim' }, 'Searching…'));
        } else if (candidates.length) {
          searchResultsSlot.replaceChildren(
            h(
              'div',

              ),
            ),
          );
        }
      }
    },
  };
}

function createQuestsTab(handlers) {
  const root = h('div', { className: 'list' });
  return {
    el: root,
    update(state, dayKey, rankPosition) {
      const ids =
        state.questIds?.length === 3 && state.questDay === dayKey
          ? state.questIds
          : selectDailyQuestIds(dayKey);

      const nodes = [
        h('div', { className: 'tradelim' }, h('span', null, 'Daily rotating objectives'), h('b', null, dayKey)),
      ];

      for (const idx of ids) {
        const q = QUEST_POOL[idx] || QUEST_POOL[0];
        const cur = q.f(state, { rank: rankPosition });
        const pct = Math.max(0, Math.min(100, (cur / q.g) * 100));
        const isClaimed = !!state.claimed?.[q.id];
        const isReady = !isClaimed && cur >= q.g;

        nodes.push(
          h(
            'div',
            { className: 'row', style: { '--c': isClaimed ? '#3fe0b0' : '#ffc23d' } },
            h('div', { className: 'em' }, isClaimed ? lucideEl('CheckCircle2', { size: 22, color: '#3fe0b0' }) : lucideEl('Target', { size: 22, color: '#ffc23d' })),
            h(
              'div',
              { style: { minWidth: '0' } },
              h('h2', null, q.t, ' ', h('span', { className: 'lv' }, `+${q.r} `, gemDiamondEl(12))),
              h('p', null, `${Math.min(Math.floor(cur), q.g).toLocaleString('en-US')} / ${q.g.toLocaleString('en-US')}`),
              h('div', { className: 'bar', style: { marginTop: '6px' } }, h('i', { style: { width: `${pct}%`, '--c': isClaimed ? '#3fe0b0' : '#ffc23d' } })),
            ),
            isClaimed
              ? h('span', { className: 'lv', style: { background: 'var(--mint)', color: '#04332a' } }, 'Claimed')
              : h(
                  'button',
                  {
                    type: 'button',
                    className: `btn sm ${isReady ? 'gold' : 'no'}`,
                    disabled: !isReady,
                    onClick: (e) => handlers.onClaimQuest(q.id, q.r, e),
                  },
                  isReady ? [h('span', null, `Claim +${q.r}`), gemDiamondEl(13)] : `${Math.floor(pct)}%`,
                ),
          ),
        );
      }

      nodes.push(
        h('div', { className: 'gxh', style: { marginTop: '8px' } }, lucideEl('Trophy', { size: 15, color: '#ffc23d' }), h('span', null, 'National Milestones')),
      );

      for (const m of MILESTONES) {
        const cur = m.f(state, { rank: rankPosition });
        const pct = Math.max(0, Math.min(100, (cur / m.g) * 100));
        const isClaimed = !!state.milestones?.[m.id];
        const isReady = !isClaimed && cur >= m.g;

        nodes.push(
          h(
            'div',
            { className: 'row', style: { '--c': isClaimed ? '#3fe0b0' : '#a58cff' } },
            h('div', { className: 'em' }, isClaimed ? lucideEl('CheckCircle2', { size: 22, color: '#3fe0b0' }) : lucideEl('Trophy', { size: 22, color: '#a58cff' })),
            h(
              'div',
              { style: { minWidth: '0' } },
              h('h2', null, m.t, ' ', h('span', { className: 'lv' }, `+${m.r} `, gemDiamondEl(12))),
              h('p', null, `${Math.min(Math.floor(cur), m.g).toLocaleString('en-US')} / ${m.g.toLocaleString('en-US')}`),
              h('div', { className: 'bar', style: { marginTop: '6px' } }, h('i', { style: { width: `${pct}%`, '--c': isClaimed ? '#3fe0b0' : '#a58cff' } })),
            ),
            isClaimed
              ? h('span', { className: 'lv', style: { background: 'var(--mint)', color: '#04332a' } }, 'Completed')
              : h(
                  'button',
                  {
                    type: 'button',
                    className: `btn sm ${isReady ? 'gold' : 'no'}`,
                    disabled: !isReady,
                    onClick: (e) => handlers.onClaimMilestone(m.id, e),
                  },
                  isReady ? [h('span', null, `Claim +${m.r}`), gemDiamondEl(13)] : `${Math.floor(pct)}%`,
                ),
          ),
        );
      }

      root.replaceChildren(...nodes);
    },
  };
}

function createErrorLogModal(handlers) {
  let lastRenderKey = '';
  let lastErrors = [];
  let lastUid = null;
  let lastEmail = null;

  const root = h('div', {
    className: 'modal err-modal-wrap',
    role: 'dialog',
    'aria-modal': 'true',
    'aria-label': 'Error Log',
    style: { display: 'none' },
    onClick: () => handlers.onClose(),
  });

  async function handleCopyAll() {
    const header = [
      `Project: ${FIREBASE_CONFIG.projectId || 'unset'}`,
      `Database: ${FIREBASE_CONFIG.firestoreDatabaseId || '(default)'}`,
      `Auth UID: ${lastUid || 'signed-out'}${lastEmail ? ` (${lastEmail})` : ''}`,
    ].join(' | ');
    const report = `${header}\n\n${formatErrorLogReport(lastErrors)}`;
    try {
      await navigator.clipboard.writeText(report);
      handlers.onCopied();
    } catch {
      const ta = document.createElement('textarea');
      ta.value = report;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      handlers.onCopied();
    }
  }

  return {
    el: root,
    update(open, errors, uid, email) {
      lastErrors = errors;
      lastUid = uid;
      lastEmail = email;

      if (!open) {
        if (lastRenderKey !== '') {
          lastRenderKey = '';
          root.style.display = 'none';
          root.replaceChildren();
        }
        return;
      }

      const key = `${uid || ''}|${email || ''}|${errors.map((e) => e.id).join(',')}`;
      if (key === lastRenderKey) return;
      lastRenderKey = key;
      root.style.display = '';

      const hasPermDenied = errors.some(
        (e) =>
          e.code === 'permission-denied' ||
          /permission-denied|Missing or insufficient permissions/i.test(`${e.code || ''} ${e.message}`),
      );

      const card = h(
        'div',
        { className: 'card err-modal', onClick: (e) => e.stopPropagation() },
        h('h2', null, lucideEl('AlertTriangle', { size: 20, color: '#ff6fa5' }), h('span', null, 'Live Error Log')),
        h(
          'p',
          { style: { margin: '6px 0 10px' } },
          errors.length
            ? `${errors.length} recorded ${errors.length === 1 ? 'issue' : 'issues'} with exact paths and codes.`
            : 'Everything is running cleanly — no errors recorded.',
        ),
        h(
          'div',
          { className: 'err-diag' },
          h('div', null, h('span', null, 'Project'), h('code', null, isFirebaseConfigured ? FIREBASE_CONFIG.projectId : 'Not configured')),
          h('div', null, h('span', null, 'Firestore DB'), h('code', null, FIREBASE_CONFIG.firestoreDatabaseId || '(default)')),
          h('div', null, h('span', null, 'Account'), h('code', null, uid ? (email || uid) : 'Offline / Signed out')),
        ),
        hasPermDenied && h(
          'div',
          { className: 'err-perm-hint' },
          h('b', null, 'Permission Denied Fix:'),
          ' Publish ',
          h('code', null, 'firestore.rules'),
          ' to database ',
          h('code', null, FIREBASE_CONFIG.firestoreDatabaseId || '(default)'),
          ' in Firebase Console → Firestore Database → Rules.',
        ),
        h(
          'div',
          { className: 'err-list' },
          errors.length
            ? errors.map((err) =>
                h(
                  'div',
                  { className: 'err-item' },
                  h(
                    'div',
                    { className: 'err-head' },
                    h('span', { className: `err-badge err-badge--${err.source}` }, err.source.toUpperCase()),
                    err.code && h('code', { className: 'err-code' }, err.code),
                    err.operationType && h('code', { className: 'err-code' }, err.operationType),
                    h('small', { className: 'dim', style: { marginLeft: 'auto' } }, NOTIF_TIME_FORMATTER.format(new Date(err.time))),
                  ),
                  err.path && h('div', { className: 'err-path' }, `Path: ${err.path}`),
                  h('div', { className: 'err-msg' }, err.message),
                  err.details && h(
                    'details',
                    { className: 'err-details-wrap' },
                    h('summary', null, 'Raw details'),
                    h('pre', { className: 'err-details' }, err.details),
                  ),
                ),
              )

        ),
        h(
          'div',
          { className: 'acts', style: { marginTop: '12px' } },
          errors.length > 0 && h(
            'button',
            { type: 'button', className: 'btn mint', onClick: () => void handleCopyAll() },

            h('span', null, 'Retry Cloud Sync'),
