<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Country Economy Tycoon</title>
    <meta name="description" content="Build your nation's economy, manage policies and government projects, collect stickers, and compete on the live GDP leaderboard." />
    <meta property="og:title" content="Country Economy Tycoon" />
    <meta property="og:description" content="Build your nation's economy, manage policies and government projects, collect stickers, and compete on the live GDP leaderboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#141033" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <style>
:root {
  --bg: #141033;
  --clay: #231c54;
  --clay2: #2e256b;
  --clay3: #392f82;
  --line: rgba(190, 170, 255, 0.16);
  --tx: #f7f5ff;
  --mu: #b4abd9;
  --gold: #ffc23d;
  --gold2: #e69014;
  --mint: #3fe0b0;
  --pink: #ff6fa5;
  --cy: #5ccbff;
  --blue: #7c5cff;
  --vio: #a58cff;
  --r: 24px;
  --d: 'Outfit', system-ui, sans-serif;
  --b: 'Plus Jakarta Sans', system-ui, sans-serif;
  --m: 'JetBrains Mono', ui-monospace, monospace;
  --out: 0 12px 28px rgba(7, 4, 24, 0.48), 0 0 0 1px var(--line);
  --in: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -4px 10px rgba(0, 0, 0, 0.24);
  --dent: inset 0 2px 6px rgba(6, 3, 24, 0.55), 0 0 0 1px rgba(175, 155, 255, 0.1);
  --sm: 0 4px 12px rgba(7, 4, 24, 0.36), 0 0 0 1px rgba(190, 170, 255, 0.12);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  scrollbar-width: thin;
  scrollbar-color: #5a4cb0 transparent;
}

button, a, input, select {
  touch-action: manipulation;
}

html, body {
  min-height: 100%;
  margin: 0;
}

body {
  font: 500 14.5px/1.5 var(--b);
  color: var(--tx);
  background:
    radial-gradient(900px 420px at 50% -120px, rgba(124, 92, 255, 0.28), transparent 70%),
    linear-gradient(180deg, #1e174b, #141033 460px);
  overflow-x: hidden;
  overscroll-behavior: none;
  font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

h1, h2, h3, .f, .lv, .btn, .tabs b, #nav button, .pill b, .inc .num, .st b, .medal, .subtabs button {
  font-family: var(--d);
}

h2, .tabs b {
  font-weight: 700;
}

:focus-visible {
  outline: 2.5px solid var(--gold);
  outline-offset: 2px;
}

.dim { color: var(--mu); }
.ok { color: var(--mint); }
.bad { color: var(--pink); }
.cnote { font-size: 12px; color: var(--mu); }
.boost {
  color: var(--cy);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

#app {
  max-width: 1280px;
  margin: auto;
  padding: 14px 14px 112px;
  display: grid;
  gap: 14px;
}

.brand { display: none; }

.top {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "who acts" "res res";
  gap: 10px;
  align-items: center;
}

.who { grid-area: who; display: flex; gap: 11px; align-items: center; min-width: 0; }
.acts2 { grid-area: acts; display: flex; gap: 7px; align-items: center; }
.res { grid-area: res; }

.top h1 { font-size: 16.5px; line-height: 1.1; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
.top small { display: block; color: var(--mu); font: 600 12px var(--b); margin-top: 3px; }

.flag {
  width: 46px;
  height: 46px;
  flex: none;
  border-radius: 16px;
  padding: 3px;
  border: 0;
  background: var(--clay2);
  box-shadow: var(--sm), var(--in);
  cursor: pointer;
  display: grid;
  place-items: center;
  overflow: hidden;
  transition: transform 0.15s;
}
.flag:hover { transform: scale(1.05); }
.flagimg { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

.pill { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pill b {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 15px 6px 7px;
  border-radius: 99px;
  background: #1a1444;
  box-shadow: var(--dent);
  font: 700 15.5px var(--d);
  white-space: nowrap;
  transition: box-shadow 0.2s;
}
.pill i {
  font-style: normal;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.06);
  flex: none;
}
.pill b.bump { box-shadow: var(--dent), 0 0 0 2.5px #ffc23d99; }

.profbtn {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  border: 0;
  background: var(--clay2);
  box-shadow: var(--sm), var(--in);
  color: var(--tx);
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  transition: transform 0.15s, background 0.15s;
}
.profbtn:hover { background: var(--clay3); }
.profbtn:active { box-shadow: var(--dent); transform: scale(0.95); }

#login {
  min-width: 0;
  max-width: 148px;
  padding: 0 12px;
  height: 40px;
  border-radius: 14px;
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--clay2);
  box-shadow: var(--sm), var(--in);
  color: var(--tx);
}

.bell { position: relative; overflow: visible !important; }
.bell i, .nb {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 18px;
  height: 18px;
  border-radius: 99px;
  background: var(--pink);
  color: #fff;
  font: 700 10px/18px var(--d);
  text-align: center;
  padding: 0 5px;
  font-style: normal;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
}

.main { display: grid; gap: 14px; }

.card {
  background: var(--clay);
  border: 0;
  border-radius: var(--r);
  padding: 16px;
  box-shadow: var(--out), var(--in);
  contain: layout style;
}

.hero {
  position: relative;
  overflow: hidden;
  padding: 18px 16px 16px;
  background: linear-gradient(175deg, #35297a 0%, #231c54 75%);
}
.hero > * { position: relative; z-index: 1; }

.inc { position: relative; display: grid; gap: 4px; }
.inc .lab {
  font: 600 12px var(--b);
  color: var(--mu);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.inc .num {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font: 800 42px/1 var(--d);
  letter-spacing: -1px;
  color: var(--gold);
}
.inc .num em {
  font: 600 14px var(--b);
  font-style: normal;
  color: var(--mu);
  letter-spacing: 0;
}

#net {
  justify-self: start;
  margin-top: 8px;
  font: 600 12px var(--b);
  color: var(--mu);
  background: #191340;
  box-shadow: var(--dent);
  border-radius: 99px;
  padding: 5px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
#net > span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* 3D Isometric City */
.sky {
  position: relative;
  height: 254px;
  margin-top: 12px;
  perspective: 780px;
  perspective-origin: 50% 26%;
  overflow: hidden;
  touch-action: pan-y;
  cursor: grab;
  user-select: none;
  border-radius: 20px;
  background:
    radial-gradient(circle at 50% 24%, rgba(165, 140, 255, 0.25), transparent 65%),
    linear-gradient(180deg, #4b3d9f, #271f66);
  box-shadow: var(--dent);
}
.sky:active { cursor: grabbing; }
.sky-reset {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 5;
  border: 0;
  border-radius: 10px;
  background: rgba(15, 11, 40, 0.82);
  color: var(--tx);
  padding: 5px 9px;
  font: 600 11px var(--d);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
}
.sky-reset:hover { background: rgba(25, 19, 64, 0.85); }
.sky .dim-hint {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  white-space: nowrap;
  z-index: 3;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(11, 6, 32, 0.78);
  color: var(--mu);
  pointer-events: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.ctip {
  position: absolute;
  z-index: 4;
  pointer-events: none;
  padding: 7px 12px;
  border-radius: 12px;
  background: var(--clay2);
  box-shadow: var(--out);
  font: 700 12px var(--b);
  color: var(--tx);
  white-space: nowrap;
  opacity: 0;
  transform: translate(-50%, -130%) scale(0.85);
  transition: opacity 0.18s, transform 0.18s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ctip.on { opacity: 1; transform: translate(-50%, -130%) scale(1); }
.ctip b { color: var(--gold); font-family: var(--d); }

.city {
  position: absolute;
  left: 50%;
  top: 56%;
  width: 0;
  height: 0;
  transform-style: preserve-3d;
  transform: rotateX(58deg) rotateZ(var(--rz, -35deg));
  will-change: transform;
}
.city.sway {
  animation: citySway 9s ease-in-out infinite alternate;
}
.city:before {
  content: "";
  position: absolute;
  left: -124px;
  top: -108px;
  width: 248px;
  height: 216px;
  border-radius: 28px;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 42px),
    linear-gradient(135deg, #6b58cf, #3e318b);
  box-shadow: 0 0 48px rgba(124, 92, 255, 0.45), 0 18px 0 #0a0624, 0 22px 28px rgba(0, 0, 0, 0.6);
  transform: translateZ(-1px);
}

.road { position: absolute; pointer-events: none; background: rgba(255, 255, 255, 0.09); transform: translateZ(-0.4px); }
.car {
  position: absolute;
  width: 8px;
  height: 4px;
  border-radius: 2px;
  background: #ffe9a0;
  box-shadow: 0 0 4px 1px #ffd25f;
  pointer-events: none;
  will-change: transform;
}
.car.cb { background: #9fe9ff; box-shadow: 0 0 4px 1px #4cc9ff; }

.bd {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--s);
  height: var(--s);
  transform-style: preserve-3d;
  cursor: pointer;
}
.bd:before {
  content: "";
  position: absolute;
  left: -3px;
  top: -3px;
  width: calc(var(--s) + 8px);
  height: calc(var(--s) + 8px);
  border-radius: 6px;
  background: #0a0624;
  opacity: 0.32;
  transform: translateZ(0.3px) translate(calc(var(--h) * 0.28), calc(var(--h) * 0.28));
}
.bd.empty:before { display: none; }
.bd i { position: absolute; display: block; --cc: var(--c); }
.bd .fT {
  left: 0;
  top: 0;
  width: var(--s);
  height: var(--s);
  border-radius: 6px;
  transform: translateZ(var(--h));
  background: linear-gradient(135deg, color-mix(in srgb, var(--cc) 62%, #fff), var(--cc));
  box-shadow: inset 3px 3px 5px rgba(255, 255, 255, 0.4), inset -3px -3px 6px rgba(0, 0, 0, 0.22);
}
.bd .fS {
  left: 0;
  top: var(--s);
  width: var(--s);
  height: var(--h);
  transform-origin: top;
  transform: rotateX(90deg);
  background:
    repeating-linear-gradient(0deg, rgba(255, 238, 175, 0.32) 0 2px, transparent 2px 8px),
    linear-gradient(rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0.14)),
    var(--cc);
}
.bd .fN {
  left: 0;
  top: 0;
  width: var(--s);
  height: var(--h);
  transform-origin: top;
  transform: rotateX(90deg);
  background:
    linear-gradient(rgba(0, 0, 0, 0.36), rgba(0, 0, 0, 0.46)),
    var(--cc);
}
.bd .fE {
  left: var(--s);
  top: 0;
  width: var(--h);
  height: var(--s);
  transform-origin: left;
  transform: rotateY(-90deg);
  background:
    repeating-linear-gradient(90deg, rgba(255, 238, 175, 0.26) 0 2px, transparent 2px 8px),
    linear-gradient(rgba(0, 0, 0, 0.26), rgba(0, 0, 0, 0.36)),
    var(--cc);
}
.bd .fW {
  left: 0;
  top: 0;
  width: var(--h);
  height: var(--s);
  transform-origin: left;
  transform: rotateY(-90deg);
  background:
    linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.56)),
    var(--cc);
}
.bd.empty i { opacity: 0.14; background: var(--cc); }
.bd.empty .fT { box-shadow: none; border: 1px dashed rgba(255, 255, 255, 0.45); }
.bd.up { animation: crise 0.85s cubic-bezier(0.2, 1.6, 0.4, 1); }
.bd.pop { animation: cpop 0.5s cubic-bezier(0.2, 1.8, 0.4, 1); }
.bd.tall .fT:after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  margin: -3px;
  border-radius: 50%;
  background: #ff5a7a;
  box-shadow: 0 0 10px 3px #ff5a7a;
}

.em3 {
  position: absolute;
  left: calc(var(--s) / 2);
  top: calc(var(--s) / 2);
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: rgba(16, 12, 42, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.28);
  display: grid;
  place-items: center;
  pointer-events: none;
  transform: translateZ(calc(var(--h) + 12px)) rotateZ(calc(-1 * var(--rz, -35deg))) rotateX(-58deg) translate(-50%, -70%);
}
.city.sway .em3 {
  animation: em3CounterSway 9s ease-in-out infinite alternate;
}
.coin, .puff {
  position: absolute;
  pointer-events: none;
  left: calc(var(--x) + var(--s) / 2);
  top: calc(var(--y) + var(--s) / 2);
  will-change: transform, opacity;
}
.coin {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff4b8, #ffc23d 55%, #d9820b);
  color: #4a2c00;
  font: 800 10px/18px var(--d);
  text-align: center;
  box-shadow: 0 0 8px rgba(255, 194, 61, 0.65);
  animation: ccoin 1.6s ease-out forwards;
}
.puff {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.65), rgba(201, 181, 255, 0.25) 60%, transparent 70%);
  animation: cpuff 2.0s ease-out forwards;
}

@keyframes citySway {
  from { transform: rotateX(58deg) rotateZ(-43deg); }
  to { transform: rotateX(58deg) rotateZ(-27deg); }
}
@keyframes em3CounterSway {
  from { transform: translateZ(calc(var(--h) + 12px)) rotateZ(43deg) rotateX(-58deg) translate(-50%, -70%); }
  to { transform: translateZ(calc(var(--h) + 12px)) rotateZ(27deg) rotateX(-58deg) translate(-50%, -70%); }
}
@keyframes crise { from { transform: translateZ(-80px) scale(0.5); opacity: 0; } }
@keyframes cpop { 40% { transform: translateZ(14px) scale(1.12); } }
@keyframes ccoin {
  0% { opacity: 0; transform: translateZ(var(--z0)) rotateZ(calc(-1 * var(--rz, -35deg))) rotateX(-58deg) translate(-50%, -50%); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translateZ(calc(var(--z0) + 56px)) rotateZ(calc(-1 * var(--rz, -35deg))) rotateX(-58deg) translate(-50%, -50%) scale(1.3); }
}
@keyframes cpuff {
  0% { opacity: 0.6; transform: translateZ(var(--z0)) rotateZ(calc(-1 * var(--rz, -35deg))) rotateX(-58deg) translate(-50%, -50%) scale(0.4); }
  100% { opacity: 0; transform: translateZ(calc(var(--z0) + 46px)) rotateZ(calc(-1 * var(--rz, -35deg))) rotateX(-58deg) translate(-50%, -50%) scale(2); }
}
@keyframes carx { from { transform: translateZ(1px) translateX(-108px); } to { transform: translateZ(1px) translateX(108px); } }
@keyframes cary { from { transform: translateZ(1px) translateY(-108px); } to { transform: translateZ(1px) translateY(108px); } }

.hero-acts { display: grid; gap: 8px; margin-top: 14px; }

.btn {
  position: relative;
  overflow: hidden;
  border: 0;
  border-radius: 16px;
  font-weight: 700;
  font-size: 13.5px;
  color: #fff;
  padding: 12px 18px;
  cursor: pointer;
  background: var(--blue);
  box-shadow: var(--in), 0 6px 14px rgba(7, 4, 24, 0.35);
  transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  white-space: nowrap;
}
.btn:hover:not(.no):not(:disabled) { transform: translateY(-1.5px); filter: brightness(1.06); }
.btn:active:not(.no):not(:disabled) {
  transform: translateY(2px) scale(0.98);
  box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.35);
}
.btn svg { flex: none; }
.btn.gold { background: linear-gradient(180deg, #ffd257, #f5a618); color: #361e00; }
.btn.mint { background: linear-gradient(180deg, #4ef0bf, #2cc698); color: #022b23; }
.btn.red { background: linear-gradient(180deg, #ff7fb0, #eb4b88); color: #fff; }
.btn.no, .btn:disabled {
  background: #211a4f;
  color: var(--mu);
  box-shadow: var(--dent);
  cursor: not-allowed;
}
.btn.sm { font-size: 12.5px; padding: 8px 10px; min-width: 78px; border-radius: 13px; }
.collect { width: 100%; font-size: 16px; padding: 14px 16px; }
#bst { background: var(--clay2); color: var(--tx); box-shadow: var(--sm), var(--in); width: 100%; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
.st {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "ic b" "bar bar";
  gap: 8px 6px;
  padding: 11px 12px;
  border-radius: 18px;
  background: var(--clay2);
  box-shadow: var(--sm), var(--in);
}
.st .ic { grid-area: ic; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mu); }
.st b { grid-area: b; font: 700 13.5px var(--d); text-align: right; }
.st .bar { grid-area: bar; }

.bar, .countdown {
  height: 10px;
  border-radius: 99px;
  background: #161138;
  box-shadow: var(--dent);
  overflow: hidden;
  display: flex;
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background-color: var(--c);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
  transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.countdown { margin-top: 8px; }
.countdown i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), var(--gold)); transition: width 1s linear; }

.tabs { display: flex; gap: 12px; align-items: center; margin: 2px 0 14px; }
.ttl-ic {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--blue) 28%, var(--clay2));
  box-shadow: var(--sm), var(--in);
  color: #e6dcff;
  flex: none;
}
.tabs b { display: block; font: 700 18px/1.15 var(--d); }
.tabs small { display: block; color: var(--mu); font: 500 12px var(--b); margin-top: 2px; }

.list { display: grid; gap: 10px; }
@media (min-width: 700px) { .list.g2 { grid-template-columns: 1fr 1fr; } }

.row {
  display: grid;
  grid-template-columns: 46px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 11px;
  border-radius: 18px;
  background: var(--clay2);
  box-shadow: var(--sm), var(--in);
  transition: background 0.15s;
  contain: layout style;
}
.row:hover { background: var(--clay3); }
.row.me { box-shadow: 0 0 0 2.5px rgba(255, 194, 61, 0.7), var(--sm), var(--in); }

.row .em {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: color-mix(in srgb, var(--c, #8b6cf6) 85%, #fff);
  background: color-mix(in srgb, var(--c, #8b6cf6) 22%, #1d1648);
  box-shadow: var(--in), 0 0 0 1px color-mix(in srgb, var(--c, #8b6cf6) 35%, transparent);
}
.row h2 {
  font-size: 14px;
  line-height: 1.25;
  margin: 0;
  display: flex;

.crate-grid {

}

.preset-btn {

.fiscal-grid {

}

.modal {

#gate {

// 1. LIVE ERROR LOG & GLOBAL ERROR LISTENERS
// ============================================================================
const MAX_ERRORS = 30;
const DEDUPE_WINDOW_MS = 3000;
let appErrorEntries = [];
const errorLogListeners = new Set();
let errorListenersInstalled = false;

function notifyErrorLog() {
  for (const fn of errorLogListeners) {
    try {
      fn();
    } catch {
      // Ignore subscriber errors
    }
  }
}

function getErrorLog() {
  return appErrorEntries;
}

function subscribeErrorLog(listener) {
  errorLogListeners.add(listener);
  return () => errorLogListeners.delete(listener);
}

function clearErrorLog() {
  if (appErrorEntries.length === 0) return;
  appErrorEntries = [];
  notifyErrorLog();
}

function recordAppError(input) {
  const now = Date.now();
  const cleanMsg = (input.message || 'Unknown error').trim().slice(0, 500);
  const cleanPath = input.path ?? null;
  const cleanCode = input.code ? String(input.code).slice(0, 80) : undefined;

  const duplicate = appErrorEntries.find(
    (e) =>
      now - e.time < DEDUPE_WINDOW_MS &&
      e.source === input.source &&
      e.path === cleanPath &&
      e.message === cleanMsg &&
      e.code === cleanCode,
  );
  if (duplicate) return duplicate;

  const entry = {
    id: `${now}_${Math.random().toString(36).slice(2, 8)}`,
    time: now,
    source: input.source,
    operationType: input.operationType,
    path: cleanPath,
    code: cleanCode,
    message: cleanMsg,
    details: input.details ? String(input.details).slice(0, 4000) : undefined,
  };

  appErrorEntries = [entry, ...appErrorEntries].slice(0, MAX_ERRORS);
  notifyErrorLog();
  return entry;
}

function extractErrorCode(err) {
  if (!err || typeof err !== 'object') return '';
  return typeof err.code === 'string' ? err.code : '';
}

function extractErrorMessage(err) {
  if (err instanceof Error) return err.message || err.name;
  if (typeof err === 'string') return err;
  try {
    return JSON.stringify(err);
  } catch {
    return String(err || 'Unknown error');
  }
}

function formatErrorLogReport(list = appErrorEntries) {
  if (!list.length) return 'No errors recorded.';
  return list
    .map((e, idx) => {
      const ts = new Date(e.time).toISOString();
      const head = `[${idx + 1}] ${ts} | ${e.source.toUpperCase()}${e.code ? ` (${e.code})` : ''}${e.operationType ? ` | op=${e.operationType}` : ''}${e.path ? ` | path=${e.path}` : ''}`;
      return e.details ? `${head}\n${e.message}\n${e.details}` : `${head}\n${e.message}`;
    })
    .join('\n\n---\n\n');
}

function installGlobalErrorListeners() {
  if (errorListenersInstalled || typeof window === 'undefined') return;
  errorListenersInstalled = true;

  window.addEventListener('error', (event) => {
    const msg = event.message || extractErrorMessage(event.error);
    if (!msg || /ResizeObserver|WebSocket|vite-hmr/i.test(msg)) return;
    recordAppError({
      source: 'runtime',
      message: msg,
      details: event.filename ? `${event.filename}:${event.lineno}:${event.colno}` : undefined,
    });
  });

  window.addEventListener('unhandledrejection', (event) => {
    const msg = extractErrorMessage(event.reason);
    const code = extractErrorCode(event.reason);
    if (!msg || /ResizeObserver|WebSocket|vite-hmr|cancelled-popup-request/i.test(`${code} ${msg}`)) {
      return;
    }
    recordAppError({
      source: code.startsWith('auth/') ? 'auth' : 'runtime',
      code: code || undefined,
      message: msg,
    });
  });
}

function buildFirestoreErrorInfo(error, operationType, path) {
  return {
    error: error instanceof Error ? error.message : String(error),
    authInfo: {
      userId: auth?.currentUser?.uid,
      email: auth?.currentUser?.email,
      emailVerified: auth?.currentUser?.emailVerified,
      isAnonymous: auth?.currentUser?.isAnonymous,
      tenantId: auth?.currentUser?.tenantId,
      providerInfo:
        auth?.currentUser?.providerData?.map((p) => ({
          providerId: p.providerId,
          email: p.email,
        })) || [],
    },
    operationType,
    path,
  };
}

function recordFirestoreError(error, operationType, path) {
  const errInfo = buildFirestoreErrorInfo(error, operationType, path);
  const json = JSON.stringify(errInfo);
  recordAppError({
    source: 'firestore',
    code: extractErrorCode(error) || undefined,
    operationType,
    path,
    message: errInfo.error,
    details: json,
  });
  return errInfo;
}

function handleFirestoreError(error, operationType, path) {
  const errInfo = recordFirestoreError(error, operationType, path);
  console.error('Firestore Error: ', JSON.stringify(errInfo));
  throw new Error(JSON.stringify(errInfo));
}

function formatFirebaseError(err) {
  const raw = err instanceof Error ? err.message : String(err || '');
  const code = err?.code || '';
  const combined = `${code} ${raw}`;
  if (/auth\/popup-closed-by-user|auth\/cancelled-popup-request/i.test(combined)) {
    return 'Sign-in cancelled — popup was closed.';
  }
  if (/auth\/popup-blocked/i.test(combined)) {
    return 'Sign-in popup was blocked by your browser — please allow popups for this site.';
  }
  if (/auth\/unauthorized-domain/i.test(combined)) {
    return 'Add this domain to Firebase Console → Authentication → Settings → Authorized domains.';
  }
  if (/auth\/operation-not-allowed/i.test(combined)) {
    return 'Enable this sign-in method in Firebase Console → Authentication → Sign-in method.';
  }
  if (/auth\/invalid-credential|auth\/user-not-found|auth\/wrong-password/i.test(combined)) {
    return 'Invalid email or password.';
  }
  if (/auth\/email-already-in-use/i.test(combined)) {
    return 'An account with this email already exists.';
  }
  if (/auth\/weak-password/i.test(combined)) {
    return 'Password should be at least 6 characters.';
  }
  if (/auth\/invalid-email/i.test(combined)) {
    return 'Please enter a valid email address.';
  }
  if (/auth\/too-many-requests/i.test(combined)) {
    return 'Too many attempts — please wait a moment and try again.';
  }
  if (/unavailable|network|offline/i.test(combined)) {
    return '📡 Network problem — check your connection.';
  }
  if (/unauthenticated/i.test(combined)) {
    return 'Session expired — please sign in again.';
  }
  if (/permission-denied|Missing or insufficient permissions/i.test(combined)) {
    return '⚠️ Permission denied — publish the updated firestore.rules in Firebase Console.';
  }
  if (/aborted/i.test(combined)) {
    return raw.includes('Another session') ? raw : 'Transaction conflict — retrying automatically.';
  }
  if (/already-exists/i.test(combined)) {
    return 'Username is already taken.';
  }
  if (/resource-exhausted/i.test(combined)) {
    return 'Daily limit or quota reached.';
  }
  if (/internal|cancelled|deadline/i.test(combined)) {
    return '⚠️ Server timeout — retry in a moment.';
  }
  try {
    const parsed = JSON.parse(raw);
    if (parsed.error) return parsed.error;
  } catch {
    // Not JSON
  }
  return raw || 'Something went wrong';
}

  buy: [660, 880],
  deal: [523, 659, 784],
  win: [523, 659, 784, 1047],
  err: [196, 147],
  tap: [440],
};

function playSfx(kind, enabled) {
  if (!enabled) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') {
      void audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const freqs = SFX_FREQS[kind] || [440];
    osc.type = 'sine';
    osc.frequency.value = freqs[0];
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.09, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15 * freqs.length);
    freqs.forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.08));
    osc.start(now);
    osc.stop(now + 0.15 * freqs.length);
  } catch {
    // Ignore audio context errors when autoplay is blocked
  }
}

function triggerBuzz(ms, enabled) {
  if (!enabled) return;
  try {
    if (navigator.vibrate) navigator.vibrate(ms);
  } catch {
    // Ignore vibration unsupported
  }
}

function formatNumber(n) {
  const v = Math.floor(Number.isFinite(n) ? n : 0);
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e4) return (v / 1e3).toFixed(1) + 'K';
  return v.toLocaleString('en-US');
}

function formatFullNumber(n) {
  const v = Math.floor(Number.isFinite(n) ? n : 0);
  return v.toLocaleString('en-US');
}

function sanitizeCountryCode(c) {
  return String(c == null ? '' : c).replace(/[^A-Za-z]/g, '').slice(0, 3);
}

function flagUrl(c) {
  const code = sanitizeCountryCode(c);
  return code ? `https://flagcdn.com/w80/${code.toLowerCase()}.png` : '';
}

function flagLargeUrl(c) {
  const code = sanitizeCountryCode(c);
  return code ? `https://flagcdn.com/w160/${code.toLowerCase()}.png` : '';
}

function cleanStickersMap(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [k, val] of Object.entries(raw)) {
    const n = Math.floor(Number(val));
    if (STICKERS.some((s) => s.id === k) && Number.isFinite(n) && n > 0) {
      out[k] = n;
    }
  }
  return out;
}

function cleanMilestonesMap(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [k, val] of Object.entries(raw)) {
    if (MILESTONES.some((m) => m.id === k) && Number(val) > 0) {
      out[k] = 1;
    }
  }
  return out;
}

function cleanTechMap(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [k, val] of Object.entries(raw)) {
    if (TECH_TREE.some((t) => t.id === k) && Number(val) > 0) {
      out[k] = 1;
    }
  }
  return out;
}

function migrateState(raw) {
  const D = freshState();
  const s = Object.assign({}, D, raw || {});
  delete s.loan;
  delete s.deals;
  delete s.avHist;
  delete s.avs;

  const rawB = s.b && typeof s.b === 'object' ? s.b : {};
  const cleanB = {};
  for (const d of BUILDINGS) {
    const v = Math.floor(Number(rawB[d.id]));
    cleanB[d.id] = Number.isFinite(v) && v >= 0 ? Math.min(10000, v) : 0;
  }
  s.b = cleanB;

  if (!s.set || typeof s.set !== 'object') {
    s.set = { sfx: 1, vib: 1, anim: 1 };
  } else {
    s.set = {
      sfx: s.set.sfx ? 1 : 0,
      vib: s.set.vib ? 1 : 0,
      anim: s.set.anim ? 1 : 0,
    };
  }

  const rawStk = s.stk;
  const legacyFused =
    rawStk && Number.isFinite(Number(rawStk.fused))
      ? Math.min(1000000, Math.max(0, Math.floor(Number(rawStk.fused))))
      : 0;
  s.stk = cleanStickersMap(rawStk);
  s.fused = Number.isFinite(Number(s.fused))
    ? Math.min(1000000, Math.max(0, Math.floor(Number(s.fused))))
    : legacyFused;

  const numFields = [
    'cash', 'gems', 'taxPool', 'day', 'tax', 'wel', 'hap', 'appr', 'pop',
    'boost', 'ev', 'edu', 'streak', 'lastDaily', 'crateCd', 'fuel', 'carbon', 'luxury',
    'corp', 'gst', 'prop', 'duty', 'tourism', 'digital', 'wealth', 'rd', 'green', 'transitSub', 'rank', 'govT',
  ];
  for (const k of numFields) {
    const v = Number(s[k]);
    s[k] = Number.isFinite(v) ? v : Number(D[k] || 0);
  }
  const now = Date.now();
  s.cash = Math.min(1e13, Math.max(0, s.cash));
  s.gems = Math.min(1e9, Math.max(0, Math.floor(s.gems)));
  s.taxPool = Math.min(1e13, Math.max(0, s.taxPool));
  s.boost = Math.max(0, Math.min(30, s.boost));
  s.rank = Math.max(0, Math.min(MAX_RANK, Math.floor(s.rank)));
  s.streak = Math.max(0, Math.min(10000, Math.floor(s.streak)));
  s.hap = Math.max(0, Math.min(100, s.hap));
  s.appr = Math.max(0, Math.min(100, s.appr));
  s.pop = Math.max(1, Math.min(100000, s.pop));
  if ((s.lastDaily || 0) > now + 86400000 || (s.lastDaily || 0) < 0) s.lastDaily = 0;
  if ((s.govT || 0) > now + 86400000 || (s.govT || 0) < 0) s.govT = 0;
  s.crateCd = Math.max(0, Math.min(now + CRATE_CD_MS + 86400000, Math.floor(s.crateCd || 0)));

  for (const [k, [mn, mx]] of Object.entries(POLICY_BOUNDS)) {
    const val = Number(s[k]) || 0;
    s[k] = Math.round(Math.max(mn, Math.min(mx, val)));
  }

  if (!s.claimed || typeof s.claimed !== 'object') {
    s.claimed = {};
  } else {
    const cleanClaimed = {};
    for (const [k, v] of Object.entries(s.claimed).slice(0, 20)) {
      if (Number(v) > 0) cleanClaimed[k.slice(0, 32)] = 1;
    }
    s.claimed = cleanClaimed;
  }
  s.milestones = cleanMilestonesMap(s.milestones);
  s.tech = cleanTechMap(s.tech);

  if (!s.activeFx || typeof s.activeFx !== 'object') s.activeFx = {};
  const legacyFx = s.activeFx;
  if (legacyFx.income3x && legacyFx.income3x > now) {
    s.activeFx = {
      incomeBoostEnd: Math.min(legacyFx.income3x, now + 250000),
      incomeBoostMult: 1.75,
      incomeBoostId: 'boom_surge',
      taxSurge: legacyFx.tax2x ? 1 : 0,
    };
  } else if (legacyFx.income15 && legacyFx.income15 > now) {
    s.activeFx = {
      incomeBoostEnd: Math.min(legacyFx.income15, now + 250000),
      incomeBoostMult: 1.25,
      incomeBoostId: 'quick_profit',
      taxSurge: legacyFx.tax2x ? 1 : 0,
    };
  } else {
    const nextFx = {};
    const endVal = Number(s.activeFx.incomeBoostEnd);
    const multVal = Number(s.activeFx.incomeBoostMult);
    if (Number.isFinite(endVal) && endVal > now && Number.isFinite(multVal) && multVal > 1) {
      nextFx.incomeBoostEnd = Math.min(endVal, now + 250000);
      nextFx.incomeBoostMult = Math.max(1, Math.min(1.75, multVal));
      if (typeof s.activeFx.incomeBoostId === 'string' && s.activeFx.incomeBoostId) {
        nextFx.incomeBoostId = s.activeFx.incomeBoostId.slice(0, 32);
      }
    }
    if (legacyFx.tax2x || s.activeFx.taxSurge) {
      nextFx.taxSurge = 1;
    }
    s.activeFx = nextFx;
  }

  if (!s.boosterCd || typeof s.boosterCd !== 'object') {
    s.boosterCd = {};
  } else {
    const cleanCd = {};
    for (const b of BOOSTERS) {
      const v = Number(s.boosterCd[b.id]);
      if (Number.isFinite(v) && v >= 0) {
        cleanCd[b.id] = Math.min(now + 86400000, Math.floor(v));
      }
    }
    s.boosterCd = cleanCd;
  }
  if (!Array.isArray(s.hist)) s.hist = [];
  s.hist = s.hist.filter((v) => typeof v === 'number' && Number.isFinite(v)).slice(-60);
  if (!Array.isArray(s.country) || !s.country[0]) s.country = D.country;
  if (!Array.isArray(s.questIds)) s.questIds = [];
  if (typeof s.questDay !== 'string') s.questDay = '';
  if (typeof s.gov !== 'string' || !GOVS.some((g) => g.id === s.gov)) s.gov = 'rep';
  if (typeof s.t !== 'number' || !Number.isFinite(s.t) || s.t < 0 || s.t > now + 86400000) {
    s.t = now;
  }

  const gx = s.gx && typeof s.gx === 'object' ? s.gx : D.gx;
  const cond = {};
  for (const a of [...GX_GOV_BUILDINGS, ...GX_ROADS]) {
    const v = Number(gx.cond?.[a[0]]);
    cond[a[0]] = Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 100;
  }
  const lvl = {};
  for (const d of BUILDINGS) {
    const v = Math.floor(Number(gx.lvl?.[d.id]));
    lvl[d.id] = v >= 1 && v <= 5 ? v : 1;
  }
  const rawExp = gx.exp && typeof gx.exp === 'object' ? gx.exp : null;
  const cleanExp = rawExp
    ? {
        sal: Math.max(0, Math.min(1e13, Math.floor(Number(rawExp.sal) || 0))),
        el: Math.max(0, Math.min(1e13, Math.floor(Number(rawExp.el) || 0))),
        inf: Math.max(0, Math.min(1e13, Math.floor(Number(rawExp.inf) || 0))),
        total: Math.max(0, Math.min(1e13, Math.floor(Number(rawExp.total) || 0))),
        paid: Math.max(0, Math.min(1e13, Math.floor(Number(rawExp.paid) || 0))),
        n: Math.max(0, Math.min(1000000, Math.floor(Number(rawExp.n) || 0))),
        t: Math.max(0, Math.min(1e13, Math.floor(Number(rawExp.t) || 0))),
      }
    : null;
  s.gx = {
    cond,
    lvl,
    acc: Math.min(GOV_DAY_SEC, Math.max(0, Number(gx.acc) || 0)),
    blk: Math.max(0, Math.floor(Number(gx.blk) || 0)),
    pb: Math.min(0.25, Math.max(0, Number(gx.pb) || 0)),
    ph: Math.min(10, Math.max(0, Number(gx.ph) || 0)),
    log: Array.isArray(gx.log)
      ? gx.log.filter((x) => typeof x === 'string').map((x) => x.slice(0, 120)).slice(0, 8)
      : [],
    exp: cleanExp,
  };

  const rawSub = s.sub && typeof s.sub === 'object' ? s.sub : {};
  const subDef = SUBSCRIPTIONS.find((x) => x.id === rawSub.tier);
  const subExp = Number(rawSub.exp);
  if (subDef && Number.isFinite(subExp) && subExp > 0) {
    const clampedExp = Math.min(subExp, now + 31 * 86400000);
    s.sub = {
      tier: subDef.id,
      exp: clampedExp,
      lastClaimDay: typeof rawSub.lastClaimDay === 'string' ? rawSub.lastClaimDay.slice(0, 16) : '',
    };
  } else {
    s.sub = {};
  }

  const rawPromo = s.subPromo && typeof s.subPromo === 'object' ? s.subPromo : {};
  const promoTier = SUBSCRIPTIONS.find((x) => x.id === rawPromo.tier);
  const promoPct = Number(rawPromo.pct);
  const promoExp = Number(rawPromo.exp);
  const promoWeek = typeof rawPromo.weekKey === 'string' ? rawPromo.weekKey.slice(0, 16) : '';
  if (
    promoWeek &&
    promoTier &&
    Number.isFinite(promoPct) &&
    promoPct >= 5 &&
    promoPct <= 40 &&
    Number.isFinite(promoExp) &&
    promoExp >= 0
  ) {
    s.subPromo = {
      weekKey: promoWeek,
      tier: promoTier.id,
      pct: Math.round(promoPct),
      exp: Math.min(promoExp, now + 8 * 86400000),
    };
  } else {
    s.subPromo = {};
  }

  return s;
}

function stripUndefinedDeep(value) {
  if (value === undefined) return undefined;
  if (value === null || typeof value !== 'object') {
    if (typeof value === 'number' && !Number.isFinite(value)) return 0;
    return value;
  }
  if (Array.isArray(value)) {
    return value
      .filter((item) => item !== undefined)
      .map((item) => stripUndefinedDeep(item));
  }
  const out = {};
  for (const [k, v] of Object.entries(value)) {
    if (v === undefined) continue;
    const cleaned = stripUndefinedDeep(v);
    if (cleaned !== undefined) {
      out[k] = cleaned;
    }
  }
  return out;
}

function toSafeInt(value, min, max) {
  const n = Math.trunc(Number(value));
  if (!Number.isFinite(n)) return min;
  return Math.min(max, Math.max(min, n)) + 0;
}

const ALLOWED_SAVE_KEYS = new Set(Object.keys(freshState()).filter((k) => k !== 'country'));

function cleanSavePayload(s) {
  const normalized = migrateState({ ...s });
  normalized.cash = Math.min(1e13, Math.max(0, Number.isFinite(Number(normalized.cash)) ? Number(normalized.cash) : 0)) + 0;
  normalized.gems = toSafeInt(normalized.gems, 0, 1e9);
  normalized.taxPool = Math.min(1e13, Math.max(0, Number.isFinite(Number(normalized.taxPool)) ? Number(normalized.taxPool) : 0)) + 0;
  normalized.rank = toSafeInt(normalized.rank, 0, MAX_RANK);
  normalized.fused = toSafeInt(normalized.fused, 0, 1000000);
  normalized.streak = toSafeInt(normalized.streak, 0, 10000);
  normalized.day = Math.max(0, Math.min(100000000, Number.isFinite(Number(normalized.day)) ? Number(normalized.day) : 0)) + 0;
  normalized.ev = Math.max(0, Math.min(1000, Number.isFinite(Number(normalized.ev)) ? Number(normalized.ev) : 0)) + 0;
  normalized.crateCd = Math.max(0, Math.min(1e13, Number.isFinite(Number(normalized.crateCd)) ? Number(normalized.crateCd) : 0)) + 0;
  normalized.t = Math.max(0, Math.min(1e13, Number.isFinite(Number(normalized.t)) ? Number(normalized.t) : 0)) + 0;
  normalized.lastDaily = Math.max(0, Math.min(1e13, Number.isFinite(Number(normalized.lastDaily)) ? Number(normalized.lastDaily) : 0)) + 0;
  normalized.govT = Math.max(0, Math.min(1e13, Number.isFinite(Number(normalized.govT)) ? Number(normalized.govT) : 0)) + 0;
  normalized.questIds = Array.isArray(normalized.questIds)
    ? normalized.questIds.filter((x) => Number.isFinite(x)).map((x) => Math.trunc(x) + 0).slice(0, 10)
    : [];
  normalized.questDay = typeof normalized.questDay === 'string' ? normalized.questDay.slice(0, 32) : '';

  const raw = stripUndefinedDeep(normalized);
  const out = {};
  for (const key of ALLOWED_SAVE_KEYS) {
    if (key in raw) {
      out[key] = raw[key];
    }
  }
  return out;
}

function totalBuildings(s) {
  return Object.values(s.b || {}).reduce((acc, v) => acc + (Number(v) || 0), 0);
}

function buildingCost(def, level, discountRate = 0) {
  const raw = def.cost * Math.pow(1.25, Math.max(0, level));
  const clampedDisc = Math.max(0, Math.min(0.5, discountRate));
  return Math.max(1, Math.ceil(raw * (1 - clampedDisc)));
}

function bulkBuildingCost(def, startCount, qty, discountRate = 0) {
  const count = Math.max(1, Math.min(50, Math.floor(qty)));
  let total = 0;
  for (let i = 0; i < count; i++) {
    total += buildingCost(def, startCount + i, discountRate);
  }
  return total;
}

function gxLevelMult(s, id) {
  const l = s.gx?.lvl?.[id] || 1;
  return GX_LEVEL_MULTS[l - 1] || 1;
}

function gxAverageCondition(s, list) {
  const cond = s.gx?.cond || {};
  let total = 0;
  for (const item of list) {
    total += cond[item[0]] == null ? 100 : cond[item[0]];
  }
  return total / list.length;
}

function gxMultiplier(s) {
  const b = gxAverageCondition(s, GX_GOV_BUILDINGS);
  const r = gxAverageCondition(s, GX_ROADS);
  const pb = s.gx?.pb || 0;
  const blk = s.gx?.blk || 0;
  return (b >= 60 ? 1 : 0.88 + (0.12 * b) / 60) * (0.92 + (0.08 * r) / 100) * (1 + pb) * (blk > 0 ? 0.85 : 1);
}

function gxHappinessMod(s) {
  const b = gxAverageCondition(s, GX_GOV_BUILDINGS);
  const r = gxAverageCondition(s, GX_ROADS);
  const ph = s.gx?.ph || 0;
  return ph - (Math.max(0, 60 - b) / 60) * 10 - (Math.max(0, 50 - r) / 50) * 3;
}

function getGovDefinition(s) {
  return GOVS.find((g) => g.id === s.gov) || GOVS[0];
}

function currentWorldEvent(nowMs) {
  const slot = Math.floor(nowMs / EV_SLOT_MS);
  const hash = Math.imul(slot, 2654435761) >>> 0;
  if (hash % 2 !== 0) return null;
  const start = slot * EV_SLOT_MS;
  if (nowMs - start >= EV_LEN_MS) return null;
  return {
    ev: WORLD_EVENTS[(hash >>> 3) % WORLD_EVENTS.length],
    left: EV_LEN_MS - (nowMs - start),
  };
}

function stickerUniqueCount(s) {
  const st = s.stk || {};
  return Object.keys(st).filter((k) => STICKERS.some((x) => x.id === k) && st[k] > 0).length;
}

function stickerBonus(s) {
  return stickerUniqueCount(s) * 0.005;
}

function taxInfo(s) {
  const t = s.tax || 20;
  const c = s.carbon || 0;
  const l = s.luxury || 0;
  const co = s.corp || 0;
  const g = s.gst || 0;
  const p = s.prop || 0;
  const d = s.duty || 0;
  const f = s.fuel || 0;
  const tr = s.tourism || 0;
  const dg = s.digital || 0;
  const w = s.wealth || 0;

  const raw =
    0.4 +
    t / 50 +
    c / 100 +
    l / 120 +
    (co / 150) * (1 + (s.b.stock || 0) * 0.05) +
    g / 70 +
    (p / 60) * Math.max(0.6, Math.min(2, (s.pop || 48) / 50)) +
    (d / 90) * (1 + ((s.b.port || 0) + (s.b.logistics || 0)) * 0.08) +
    (tr / 85) * (1 + ((s.b.airport || 0) + (s.b.stadium || 0)) * 0.06) +
    (dg / 90) * (1 + ((s.b.tech || 0) + (s.b.data || 0) + (s.b.semicon || 0)) * 0.05) +
    (w / 105) * (1 + (s.b.bank || 0) * 0.04);
  const burden =
    t + co * 0.8 + g + p + d * 0.6 + c * 0.7 + l * 0.5 + f * 0.4 + tr * 0.4 + dg * 0.5 + w * 0.35;
  const ev = Math.max(0, Math.min(0.75, (burden - 30) / 70 + Math.max(0, 50 - (s.appr ?? 50)) / 400));
  return { mult: raw * (1 - ev), raw, burden, ev };
}

function hasTech(s, techId) {
  return Boolean(s.tech && s.tech[techId] > 0);
}

function techCount(s) {
  return Object.keys(s.tech || {}).filter((id) => TECH_TREE.some((t) => t.id === id) && (s.tech?.[id] || 0) > 0).length;
}

function canUnlockTech(s, techId) {
  const def = TECH_TREE.find((t) => t.id === techId);
  if (!def) return { ok: false, reason: 'Unknown doctrine' };
  if (hasTech(s, techId)) return { ok: false, reason: 'Already researched' };
  const ownedBldgs = totalBuildings(s);
  if (ownedBldgs < def.reqBuildings) {
    return { ok: false, reason: `Requires ${def.reqBuildings} total buildings (${ownedBldgs}/${def.reqBuildings})` };
  }
  if (s.cash < def.cost) {
    return { ok: false, reason: 'Not enough cash' };
  }
  return { ok: true };
}

function applyUnlockTech(s, techId) {
  const check = canUnlockTech(s, techId);
  if (!check.ok) return { ok: false, state: s, reason: check.reason };
  const def = TECH_TREE.find((t) => t.id === techId);
  return {
    ok: true,
    state: {
      ...s,
      cash: s.cash - def.cost,
      tech: { ...(s.tech || {}), [techId]: 1 },
    },
  };
}

function getTechIncomeMult(s) {
  let bonus = 0;
  if (hasTech(s, 'smart_grid')) bonus += 0.04;
  if (hasTech(s, 'auto_customs')) bonus += 0.03;
  if (hasTech(s, 'sovereign_vault')) bonus += 0.04;
  return 1 + bonus;
}

function getInfraDecayMult(s) {
  return hasTech(s, 'smart_grid') ? 0.8 : 1;
}

function getTaxPoolCapSeconds(s) {
  return hasTech(s, 'sovereign_vault') ? 2400 : 1800;
}

function getActiveSubscription(s, nowMs = Date.now()) {
  const sub = s.sub;
  if (!sub?.tier || !sub.exp || sub.exp <= nowMs) return null;
  const def = SUBSCRIPTIONS.find((x) => x.id === sub.tier);
  if (!def) return null;
  return {
    def,
    exp: sub.exp,
    leftMs: Math.max(0, sub.exp - nowMs),
    lastClaimDay: sub.lastClaimDay || '',
  };
}

function isProfileSubActive(profile, nowMs = Date.now()) {
  if (!profile?.subTier || !profile.subExp || profile.subExp <= nowMs) return null;
  return SUBSCRIPTIONS.some((x) => x.id === profile.subTier) ? profile.subTier : null;
}

function getDevelopmentDiscount(s, nowMs = Date.now()) {
  const active = getActiveSubscription(s, nowMs);
  const subDisc = active ? active.def.discountRate : 0;
  const techDisc = hasTech(s, 'civil_corps') ? 0.05 : 0;
  return Math.min(0.35, subDisc + techDisc);
}

function getSubscriptionProjectSpeedMult(s, nowMs = Date.now()) {
  const active = getActiveSubscription(s, nowMs);
  return active ? active.def.projectSpeedMult : 1;
}

function getProjectSpeedMult(s, nowMs = Date.now()) {
  const subMult = getSubscriptionProjectSpeedMult(s, nowMs);
  const techBonus = hasTech(s, 'civil_corps') ? 0.15 : 0;
  return subMult + techBonus;
}

function getActiveShopIncomeBooster(s, nowMs = Date.now()) {
  const fx = s.activeFx || {};
  if (fx.incomeBoostEnd && fx.incomeBoostEnd > nowMs && fx.incomeBoostMult && fx.incomeBoostMult > 1) {
    return {
      active: true,
      id: fx.incomeBoostId || '',
      mult: Math.min(1.75, fx.incomeBoostMult),
      leftSec: Math.ceil((fx.incomeBoostEnd - nowMs) / 1000),
    };
  }
  return { active: false, id: '', mult: 1, leftSec: 0 };
}

function calculateIncome(s, options) {
  const tradeTier = options?.tradeTier ?? 0;
  const nowMs = options?.nowMs ?? Date.now();
  const ignoreTemp = options?.ignoreTempBoosters ?? false;

  let gross = 2;
  for (const d of BUILDINGS) {
    gross += d.inc * (s.b[d.id] || 0) * gxLevelMult(s, d.id);
  }

  const worldEv = currentWorldEvent(nowMs);
  const evMult = worldEv ? worldEv.ev.m : 1;
  const gov = getGovDefinition(s);
  const subMult = getActiveSubscription(s, nowMs)?.def.incomeMult ?? 1;

  const shopBoost = ignoreTemp ? 1 : getActiveShopIncomeBooster(s, nowMs).mult;
  const gemBoost = ignoreTemp ? 1 : s.boost > 0 ? 2 : 1;
  const tempMult = Math.min(2.5, shopBoost * gemBoost);

  const permMult = gxMultiplier(s) * evMult * gov.inc * subMult * getTechIncomeMult(s);
  const taxMult = taxInfo(s).mult;

  const cleanGreenCount = (s.b.solar || 0) + (s.b.hydro || 0) + (s.b.fusion || 0);
  const greenSynergy = 1 + Math.min(0.5, cleanGreenCount * (s.green || 0) * 0.002);
  const transitSynergy = 1 + Math.min(0.45, ((s.b.transit || 0) + (s.b.rail || 0)) * (s.transitSub || 0) * 0.002);
  const quantumSynergy = 1 + Math.min(0.4, (s.b.quantum || 0) * 0.02);

  const mult =
    taxMult *
    (1 + (s.hap - 50) / 200) *
    (1 + (s.b.pow || 0) * 0.015 + (s.b.fusion || 0) * 0.025) *
    quantumSynergy *
    tempMult *
    (1 + s.edu / 200) *
    (1 + (s.rd || 0) / 140) *
    greenSynergy *
    transitSynergy *
    (1 + (s.fuel || 0) / 150) *
    (1 + tradeTier * 0.05) *
    (1 + stickerBonus(s)) *
    (1 + (s.rank || 0) * 0.01) *
    permMult;

  gross *= mult;
  const upkeepRate = Math.min(0.35, 0.03 + totalBuildings(s) * 0.0015);
  const upkeep = gross * upkeepRate;
  const policySpendShare = Math.min(
    0.6,
    (((s.wel + s.edu) * 0.7 + (s.rd || 0) * 0.55 + (s.green || 0) * 0.45 + (s.transitSub || 0) * 0.4) / 100) * gov.wel,
  );
  const welfareCost = gross * policySpendShare;
  const net = gross - welfareCost - upkeep;

  return {
    gross,
    net,
    welfareCost,
    upkeep,
    upkeepRate,
    policySpendShare,
  };
}

function calculateGdp(s) {
  return Math.max(1, Math.floor(s.cash || 0));
}

function calculateOfflineRank(s) {
  const g = calculateGdp(s);
  const me = s.country?.[0];
  return 1 + Object.keys(REAL_GDP_SCALED).filter((c) => c !== me && REAL_GDP_SCALED[c] > g).length;
}

function calculateOnlineRank(s, uid, activeLeaderboard) {
  const g = calculateGdp(s);
  return 1 + activeLeaderboard.filter((p) => p.id !== uid && (p.gdp || 0) > g).length;
}

function playerLevel(s) {
  return 1 + Math.floor(Math.sqrt(calculateGdp(s) / 1000));
}

function targetHappiness(s) {
  const carbonOffset = (s.b.solar || 0) * 3 + (s.b.hydro || 0) * 2 + (s.b.fusion || 0) * 5 + (s.green || 0) * 0.5;
  const carbonPen = Math.max(0, (s.carbon || 0) - carbonOffset) * 0.5;
  const ecoTech = hasTech(s, 'eco_catalysis');
  const careTech = hasTech(s, 'healthcare_act');
  const factPenaltyPer = ecoTech ? 1.05 : 1.5;
  const hospBonusPer = careTech ? 1.5 : 1.2;
  const techFlatHap = (ecoTech ? 2 : 0) + (careTech ? 5 : 0);
  return Math.max(
    5,
    Math.min(
      100,
      40 +
        techFlatHap +
        gxHappinessMod(s) +
        s.wel * 1.5 +
        s.edu * 0.6 +
        (s.rd || 0) * 0.25 +
        (s.green || 0) * 0.7 +
        (s.transitSub || 0) * 0.55 -
        (s.tax - 20) * 1.8 -
        (s.fuel || 0) * 0.6 -
        (s.carbon || 0) * 0.4 -
        carbonPen -
        (s.luxury || 0) * 0.3 -
        (s.corp || 0) * 0.35 -
        (s.gst || 0) * 0.45 -
        (s.prop || 0) * 0.7 -
        (s.duty || 0) * 0.2 -
        (s.tourism || 0) * 0.15 -
        (s.digital || 0) * 0.25 -
        (s.wealth || 0) * 0.15 -
        (s.b.fact || 0) * factPenaltyPer +
        (s.b.farm || 0) * 0.8 +
        (s.b.hosp || 0) * hospBonusPer +
        (s.b.stadium || 0) * 0.8 +
        (s.b.solar || 0) * 0.5 +
        (s.b.water || 0) * 0.7 +
        (s.b.univ || 0) * 0.4 +
        (s.b.space || 0) * 0.8 +
        (s.b.hydro || 0) * 0.6 +
        (s.b.evplant || 0) * 0.2 +
        (s.b.transit || 0) * 0.6 +
        (s.b.quantum || 0) * 0.5 -
        (s.b.data || 0) * 0.3 -
        (s.b.logistics || 0) * 0.2,
    ),
  );
}

function calculateTaxCollect(s, tradeTier = 0, nowMs = Date.now()) {
  const pool = Math.floor(s.taxPool || 0);
  if (pool < 1) return { collected: 0, bonusApplied: false, bonusAmount: 0, baseNet: 0, poolAmount: 0 };

  const baseNet = Math.max(0, calculateIncome(s, { tradeTier, nowMs, ignoreTempBoosters: true }).net);
  const hasSurge = !!(s.activeFx && s.activeFx.taxSurge);
  if (!hasSurge) {
    return { collected: pool, bonusApplied: false, bonusAmount: 0, baseNet, poolAmount: pool };
  }

  const bonusAmount = Math.floor(Math.min(pool * 0.35, baseNet * 120));
  return {
    collected: pool + bonusAmount,
    bonusApplied: true,
    bonusAmount,
    baseNet,
    poolAmount: pool,
  };
}

function rollTradePortExport(s, poolCollected, baseNet, rng = Math.random) {
  const ports = s.b?.port || 0;
  if (ports <= 0 || poolCollected < Math.max(50, baseNet * 30)) {
    return { gems: 0, sticker: null };
  }
  const maxCap = hasTech(s, 'auto_customs') ? 0.33 : 0.25;
  const bonus = hasTech(s, 'auto_customs') ? 0.08 : 0;
  const chance = Math.min(maxCap, 0.05 + ports * 0.02 + bonus);
  if (rng() >= chance) {
    return { gems: 0, sticker: null };
  }
  if (rng() < 0.75) {
    return { gems: 1, sticker: null };
  }
  const rRoll = rng();
  const rarity = rRoll < 0.7 ? 1 : rRoll < 0.95 ? 2 : 3;
  const pool = STICKERS.filter((x) => x.r === rarity);
  const picked = pool[Math.floor(rng() * pool.length) % pool.length];
  return { gems: 0, sticker: picked };
}

function canBuyBooster(s, booster, nowMs = Date.now()) {
  const cdStart = s.boosterCd?.[booster.id] || 0;
  const cdEnd = cdStart + booster.cd * 1000;
  const cooldownLeftSec = Math.max(0, Math.ceil((cdEnd - nowMs) / 1000));
  if (cooldownLeftSec > 0) {
    return { ok: false, reason: `Cooldown: ${cooldownLeftSec}s`, cooldownLeftSec };
  }
  if (booster.isIncomeBoost && getActiveShopIncomeBooster(s, nowMs).active) {
    return { ok: false, reason: 'Another income booster is already active', cooldownLeftSec: 0 };
  }
  if (booster.fx === 'tax15x' && s.activeFx?.taxSurge) {
    return { ok: false, reason: 'Tax Surge is already active', cooldownLeftSec: 0 };
  }
  if (booster.fx === 'hap10' && s.hap >= 100) {
    return { ok: false, reason: 'Happiness is already at 100%', cooldownLeftSec: 0 };
  }
  if (booster.fx === 'rally' && s.hap >= 100 && s.appr >= 100) {
    return { ok: false, reason: 'Happiness & Approval are already at 100%', cooldownLeftSec: 0 };
  }
  if (s.cash < booster.cost) {
    return { ok: false, reason: 'Not enough cash', cooldownLeftSec: 0 };
  }
  return { ok: true, cooldownLeftSec: 0 };
}

function applyBuyBooster(s, booster, nowMs = Date.now()) {
  const check = canBuyBooster(s, booster, nowMs);
  if (!check.ok) return { ok: false, state: s, reason: check.reason };

  const next = {
    ...s,
    cash: s.cash - booster.cost,
    boosterCd: { ...(s.boosterCd || {}), [booster.id]: nowMs },
    activeFx: { ...(s.activeFx || {}) },
  };

  if (booster.fx === 'income25') {
    next.activeFx.incomeBoostEnd = nowMs + booster.dur * 1000;
    next.activeFx.incomeBoostMult = 1.25;
    next.activeFx.incomeBoostId = booster.id;
  } else if (booster.fx === 'income50') {
    next.activeFx.incomeBoostEnd = nowMs + booster.dur * 1000;
    next.activeFx.incomeBoostMult = 1.5;
    next.activeFx.incomeBoostId = booster.id;
  } else if (booster.fx === 'income75') {
    next.activeFx.incomeBoostEnd = nowMs + booster.dur * 1000;
    next.activeFx.incomeBoostMult = 1.75;
    next.activeFx.incomeBoostId = booster.id;
  } else if (booster.fx === 'tax15x') {
    next.activeFx.taxSurge = 1;
  } else if (booster.fx === 'hap10') {
    next.hap = Math.min(100, next.hap + 15);
  } else if (booster.fx === 'rally') {
    next.hap = Math.min(100, next.hap + 10);
    next.appr = Math.min(100, next.appr + 12);
  }

  return { ok: true, state: next };
}

function canBuyRank(s, rankId) {
  const r = RANKS[rankId];
  if (!r || !r.cost) return { ok: false, reason: 'Invalid rank' };
  if (rankId !== (s.rank || 0) + 1) return { ok: false, reason: 'Buy ranks in order' };
  if (s.cash < r.cost) return { ok: false, reason: 'Not enough cash' };
  return { ok: true };
}

function applyBuyRank(s, rankId) {
  const check = canBuyRank(s, rankId);
  if (!check.ok) return { ok: false, state: s, reason: check.reason };
  const r = RANKS[rankId];
  return {
    ok: true,
    state: {
      ...s,
      cash: s.cash - r.cost,
      rank: rankId,
    },
  };
}

function applyOfflineEarnings(s, nowMs = Date.now(), tradeTier = 0) {
  const clampedT = !s.t || s.t > nowMs + 60000 ? nowMs : s.t;
  const rawAway = Math.max(0, (nowMs - clampedT) / 1000);
  if (!Number.isFinite(rawAway) || rawAway <= 60 || totalBuildings(s) === 0) {
    return { state: { ...s, t: nowMs }, credited: 0, awaySec: 0, wasCapped: false };
  }

  const away = Math.min(OFFLINE_CAP_SEC, rawAway);
  const net = Math.max(0, calculateIncome(s, { tradeTier, nowMs, ignoreTempBoosters: true }).net);
  const credited = net * away * OFFLINE_RATE;
  if (net <= 0 || credited < 1) {
    return { state: { ...s, t: nowMs }, credited: 0, awaySec: away, wasCapped: rawAway > OFFLINE_CAP_SEC };
  }

  const capPool = net * getTaxPoolCapSeconds(s);
  const prevPool = s.taxPool || 0;
  const newPool = prevPool >= capPool ? prevPool : Math.min(capPool, prevPool + credited);

  return {
    state: { ...s, taxPool: newPool, t: nowMs },
    credited,
    awaySec: away,
    wasCapped: rawAway > OFFLINE_CAP_SEC,
  };
}

const KARACHI_YMD_FORMATTER = new Intl.DateTimeFormat('en-CA', {
  timeZone: TZ,
  year: 'numeric',
  month: '2-digit',
  day: '2-digit',
});

function weekKeyFor(nowMs) {
  const ymd = KARACHI_YMD_FORMATTER.format(new Date(nowMs));
  const [y, m, d] = ymd.split('-').map((n) => Number(n));
  const utcDate = new Date(Date.UTC(y, m - 1, d));
  const dayNum = utcDate.getUTCDay() || 7;
  utcDate.setUTCDate(utcDate.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(utcDate.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((utcDate.getTime() - yearStart.getTime()) / 86400000) + 1) / 7);
  return `${utcDate.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
}

const WEEKLY_PROMO_PCTS = [15, 20, 25, 30, 35];

function rollWeeklySubPromo(s, nowMs = Date.now(), rng = Math.random) {
  const wk = weekKeyFor(nowMs);
  if (s.subPromo?.weekKey === wk) {
    return { state: s, rolled: false, promo: s.subPromo };
  }
  const tierDef = SUBSCRIPTIONS[Math.floor(rng() * SUBSCRIPTIONS.length) % SUBSCRIPTIONS.length];
  const pct = WEEKLY_PROMO_PCTS[Math.floor(rng() * WEEKLY_PROMO_PCTS.length) % WEEKLY_PROMO_PCTS.length];
  const promo = {
    weekKey: wk,
    tier: tierDef.id,
    pct,
    exp: nowMs + 72 * 3600000,
  };
  return {
    state: { ...s, subPromo: promo },
    rolled: true,
    promo,
  };
}

function getSubscriptionPrice(s, subDef, nowMs = Date.now()) {
  const p = s.subPromo;
  const promoActive = Boolean(
    p &&
      p.tier === subDef.id &&
      typeof p.pct === 'number' &&
      Number.isFinite(p.pct) &&
      p.pct >= 5 &&
      p.pct <= 40 &&
      typeof p.exp === 'number' &&
      p.exp > nowMs,
  );
  const discountPct = promoActive ? Math.round(p.pct) : 0;
  const finalCost = promoActive ? Math.max(1, Math.ceil(subDef.cost * (1 - discountPct / 100))) : subDef.cost;
  const msLeft = promoActive ? Math.max(0, (p.exp || 0) - nowMs) : 0;
  return {
    baseCost: subDef.cost,
    finalCost,
    discountPct,
    promoActive,
    msLeft,
  };
}

function canBuySubscription(s, subDef, nowMs = Date.now()) {
  const active = getActiveSubscription(s, nowMs);
  if (active) {
    const curIdx = SUBSCRIPTIONS.findIndex((x) => x.id === active.def.id);
    const nextIdx = SUBSCRIPTIONS.findIndex((x) => x.id === subDef.id);
    if (nextIdx <= curIdx) {
      return {
        ok: false,
        reason: `${active.def.n} is already active`,
      };
    }
  }
  const { finalCost } = getSubscriptionPrice(s, subDef, nowMs);
  if (s.cash < finalCost) {
    return { ok: false, reason: 'Not enough cash' };
  }
  return { ok: true };
}

function applyBuySubscription(s, subDef, nowMs = Date.now()) {
  const check = canBuySubscription(s, subDef, nowMs);
  if (!check.ok) return { ok: false, state: s, reason: check.reason };
  const { finalCost } = getSubscriptionPrice(s, subDef, nowMs);
  return {
    ok: true,
    paidCost: finalCost,
    state: {
      ...s,
      cash: s.cash - finalCost,
      sub: {
        tier: subDef.id,
        exp: nowMs + subDef.durMs,
        lastClaimDay: s.sub?.lastClaimDay || '',
      },
    },
  };
}

function claimSubscriptionDaily(s, dayKey, nowMs = Date.now()) {
  const active = getActiveSubscription(s, nowMs);
  if (!active) {
    return { ok: false, state: s, cashAdded: 0, gemsAdded: 0, reason: 'No active subscription' };
  }
  if (active.lastClaimDay === dayKey) {
    return { ok: false, state: s, cashAdded: 0, gemsAdded: 0, reason: 'Already claimed today' };
  }
  return {
    ok: true,
    cashAdded: active.def.dailyCash,
    gemsAdded: active.def.dailyGems,
    state: {
      ...s,
      cash: Math.min(1e13, s.cash + active.def.dailyCash),
      gems: Math.min(1e9, Math.floor(s.gems) + active.def.dailyGems),
      sub: {
        ...s.sub,
        tier: active.def.id,
        exp: active.exp,
        lastClaimDay: dayKey,
      },
    },
  };
}

function gxBuildDevelopment(s) {
  let dev = 0;
  for (const d of BUILDINGS) {
    dev += d.inc * (s.b?.[d.id] || 0) * gxLevelMult(s, d.id);
  }
  return dev;
}

function gxRepairUnit(s) {
  return Math.max(2, gxBuildDevelopment(s) * 0.2);
}

function gxRepairCost(s, key, full, nowMs = Date.now()) {
  const item = [...GX_GOV_BUILDINGS, ...GX_ROADS].find((x) => x[0] === key);
  if (!item) return 0;
  const c = s.gx.cond[key] ?? 100;
  const add = full ? 100 - c : Math.min(20, 100 - c);
  if (add <= 0.01) return 0;
  const disc = getDevelopmentDiscount(s, nowMs);
  return Math.max(1, Math.ceil(add * gxRepairUnit(s) * item[3] * (1 - disc)));
}

function gxUpgradeCost(s, buildingId, nowMs = Date.now()) {
  const def = BUILDINGS.find((b) => b.id === buildingId);
  const count = s.b[buildingId] || 0;
  const lvl = s.gx.lvl[buildingId] || 1;
  if (!def || count < 1 || lvl >= 5) return 0;
  const disc = getDevelopmentDiscount(s, nowMs);
  return Math.max(1, Math.ceil(def.cost * count * GX_UPGRADE_MULTS[lvl - 1] * (1 - disc)));
}

function fuseSticker(s, stickerId, rng = Math.random) {
  const own = s.stk || {};
  if ((own[stickerId] || 0) < 3) {
    return { ok: false, state: s, reason: 'Need 3 duplicates to fuse' };
  }
  const src = STICKERS.find((x) => x.id === stickerId);
  if (!src) return { ok: false, state: s, reason: 'Invalid sticker' };

  const nextStk = { ...own, [stickerId]: own[stickerId] - 3 };
  if (nextStk[stickerId] <= 0) delete nextStk[stickerId];

  const targetRarity = Math.min(3, src.r + 1);
  const pool = STICKERS.filter((x) => x.r === targetRarity);
  const granted = pool[Math.floor(rng() * pool.length) % pool.length];
  nextStk[granted.id] = (nextStk[granted.id] || 0) + 1;

  return {
    ok: true,
    granted,
    state: {
      ...s,
      stk: nextStk,
      fused: Math.min(1000000, Math.floor(s.fused || 0) + 1),
    },
  };
}

function pickStickerByRarity(rarity, rng) {
  const pool = STICKERS.filter((x) => x.r === rarity);
  return pool[Math.floor(rng() * pool.length) % pool.length];
}

function buyStickerCrate(s, kind, nowMs = Date.now(), rng = Math.random) {
  const nextStk = { ...(s.stk || {}) };
  if (kind === 'cash') {
    const cdLeft = Math.max(0, Math.ceil(((s.crateCd || 0) - nowMs) / 1000));
    if (cdLeft > 0) {
      return { ok: false, state: s, granted: [], reason: `Crate cooldown: ${cdLeft}s` };
    }
    if (s.cash < CRATE_COST_CASH) {
      return { ok: false, state: s, granted: [], reason: 'Not enough cash' };
    }
    const r = rng();
    const rarity = r < 0.72 ? 1 : r < 0.96 ? 2 : 3;
    const picked = pickStickerByRarity(rarity, rng);
    nextStk[picked.id] = (nextStk[picked.id] || 0) + 1;
    return {
      ok: true,
      granted: [picked],
      state: {
        ...s,
        cash: s.cash - CRATE_COST_CASH,
        crateCd: nowMs + CRATE_CD_MS,
        stk: nextStk,
      },
    };
  }

  if (s.gems < CRATE_COST_GEMS) {
    return { ok: false, state: s, granted: [], reason: 'Not enough diamonds' };
  }
  const firstRarity = rng() < 0.8 ? 2 : 3;
  const secondRoll = rng();
  const secondRarity = secondRoll < 0.55 ? 1 : secondRoll < 0.9 ? 2 : 3;
  const first = pickStickerByRarity(firstRarity, rng);
  const second = pickStickerByRarity(secondRarity, rng);
  nextStk[first.id] = (nextStk[first.id] || 0) + 1;
  nextStk[second.id] = (nextStk[second.id] || 0) + 1;

  return {
    ok: true,
    granted: [first, second],
    state: {
      ...s,
      gems: s.gems - CRATE_COST_GEMS,
      stk: nextStk,
    },
  };
}

function applyPolicyPreset(s, presetId) {
  const preset = POLICY_PRESETS.find((p) => p.id === presetId);
  if (!preset) return s;
  const next = { ...s };
  for (const [k, rawVal] of Object.entries(preset.values)) {
    const bounds = POLICY_BOUNDS[k];
    if (bounds && typeof rawVal === 'number') {
      next[k] = Math.round(Math.max(bounds[0], Math.min(bounds[1], rawVal)));
    }
  }
  return next;
}

function claimMilestone(s, milestoneId) {
  const m = MILESTONES.find((x) => x.id === milestoneId);
  if (!m) return { ok: false, state: s, gemsAdded: 0, reason: 'Unknown milestone' };
  if (s.milestones?.[milestoneId]) {
    return { ok: false, state: s, gemsAdded: 0, reason: 'Already claimed' };
  }
  if (m.f(s) < m.g) {
    return { ok: false, state: s, gemsAdded: 0, reason: 'Milestone not yet completed' };
  }
  return {
    ok: true,
    gemsAdded: m.r,
    state: {
      ...s,
      gems: Math.min(1e9, Math.floor(s.gems) + m.r),
      milestones: { ...(s.milestones || {}), [milestoneId]: 1 },
    },
  };
}

function selectDailyQuestIds(dateStr) {
  let seed = 0;
  for (let i = 0; i < dateStr.length; i++) {
    seed = (seed * 31 + dateStr.charCodeAt(i)) >>> 0;
  }
  const rnd = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const idx = [...Array(QUEST_POOL.length).keys()];
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = idx[i];
    idx[i] = idx[j];
    idx[j] = tmp;
  }
  return idx.slice(0, 3);
}

function sanitizeStats(raw, overrides) {
  const capStat = (val, max) => Math.max(0, Math.min(max, Math.floor(Number(val) || 0)));
  const merged = {
    buildings: overrides?.buildings ?? raw?.buildings,
    completedTrades: overrides?.completedTrades ?? raw?.completedTrades,
    tradesSent: overrides?.tradesSent ?? raw?.tradesSent,
    tradesReceived: overrides?.tradesReceived ?? raw?.tradesReceived,
    cashTraded: overrides?.cashTraded ?? raw?.cashTraded,
    gemsTraded: overrides?.gemsTraded ?? raw?.gemsTraded,
  };
  return {
    buildings: capStat(merged.buildings, 1000000),
    completedTrades: capStat(merged.completedTrades, 1000000),
    tradesSent: capStat(merged.tradesSent, 1000000),
    tradesReceived: capStat(merged.tradesReceived, 1000000),
    cashTraded: capStat(merged.cashTraded, 1e14),
    gemsTraded: capStat(merged.gemsTraded, 1e12),
  };
}

function tierOfCompletedTrades(count) {

function getExecDecisionQuote(s, decisionId, tradeTier = 0, nowMs = Date.now()) {
  const baseNet = Math.max(10, calculateIncome(s, { tradeTier, nowMs, ignoreTempBoosters: true }).net);
  const spendCost = Math.min(Math.floor(s.cash * 0.12), Math.max(250, Math.floor(baseNet * 35)));
  const gainCash = Math.max(200, Math.floor(baseNet * 48));
  const poolBonus = Math.max(150, Math.floor(baseNet * 30));
  void decisionId;
  return { spendCost, gainCash, poolBonus };
}

function resolveExecutiveDecision(s, decisionId, choiceIdx, tradeTier = 0, nowMs = Date.now(), rng = Math.random) {
  const def = EXEC_DECISIONS.find((d) => d.id === decisionId);
  if (!def) return { ok: false, state: s, summary: '' };
  const quote = getExecDecisionQuote(s, decisionId, tradeTier, nowMs);

  if (choiceIdx === 1) {
    const hapPen = decisionId === 'grid_crunch' ? 5 : decisionId === 'green_bonds' ? 0 : 4;
    const apprPen = decisionId === 'grid_crunch' ? 4 : decisionId === 'green_bonds' ? 3 : 0;
    const next = {
      ...s,
      cash: Math.min(1e13, s.cash + quote.gainCash),
      hap: Math.max(0, s.hap - hapPen),
      appr: Math.max(0, s.appr - apprPen),
    };
    return {
      ok: true,
      state: next,
      summary: `${def.title}: +₨ ${formatNumber(quote.gainCash)}${hapPen ? `, −${hapPen}% Hap` : ''}${apprPen ? `, −${apprPen}% Appr` : ''}`,
    };
  }

  if (s.cash < quote.spendCost) {
    return { ok: false, state: s, summary: 'Not enough cash for this option' };
  }

  const next = { ...s, cash: Math.max(0, s.cash - quote.spendCost) };
  if (decisionId === 'tech_expo') {
    next.hap = Math.min(100, next.hap + 8);
    next.appr = Math.min(100, next.appr + 6);
    next.gems = Math.min(1e9, next.gems + 1);
    return { ok: true, state: next, summary: `Sponsored Tech Expo (−₨ ${formatNumber(quote.spendCost)}): +8% Hap, +6% Appr, +1 Gem!` };
  }
  if (decisionId === 'grid_crunch') {
    next.hap = Math.min(100, next.hap + 6);
    const cond = { ...next.gx.cond };
    for (const k of Object.keys(cond)) cond[k] = Math.min(100, (cond[k] ?? 100) + 12);
    next.gx = { ...next.gx, cond };
    return { ok: true, state: next, summary: `Grid Subsidized (−₨ ${formatNumber(quote.spendCost)}): +6% Hap & +12% Infra condition!` };
  }
  if (decisionId === 'port_backlog') {
    next.appr = Math.min(100, next.appr + 5);
    const pool = STICKERS.filter((x) => x.r <= 2);
    const picked = pool[Math.floor(rng() * pool.length) % pool.length];
    next.stk = { ...(next.stk || {}), [picked.id]: (next.stk?.[picked.id] || 0) + 1 };
    return { ok: true, state: next, summary: `Customs Cleared (−₨ ${formatNumber(quote.spendCost)}): +5% Appr & ${picked.n} sticker!` };
  }
  if (decisionId === 'green_bonds') {
    next.hap = Math.min(100, next.hap + 10);
    const capPool = Math.max(0, calculateIncome(next, { tradeTier, nowMs, ignoreTempBoosters: true }).net * getTaxPoolCapSeconds(next));
    next.taxPool = next.taxPool >= capPool ? next.taxPool : Math.min(capPool, next.taxPool + quote.poolBonus);
    return { ok: true, state: next, summary: `Green Bonds (−₨ ${formatNumber(quote.spendCost)}): +10% Hap & +₨ ${formatNumber(quote.poolBonus)} Tax Pool!` };
  }
  next.hap = Math.min(100, next.hap + 7);
  next.appr = Math.min(100, next.appr + 7);
  return { ok: true, state: next, summary: `Heritage Week (−₨ ${formatNumber(quote.spendCost)}): +7% Hap & +7% Appr!` };
}

const HAPPY_BUILDINGS = new Set(['farm', 'hosp', 'water', 'solar', 'hydro', 'transit', 'stadium', 'space', 'quantum']);

function getRecommendedBuildings(s, qty = 1, nowMs = Date.now()) {
  const rec = {};
  const disc = getDevelopmentDiscount(s, nowMs);
  const scored = BUILDINGS.map((d) => {
    const count = s.b?.[d.id] || 0;
    const cost = bulkBuildingCost(d, count, qty, disc);
    const upgMult = gxLevelMult(s, d.id);
    const roi = (d.inc * upgMult * qty) / Math.max(1, cost);
    return { def: d, cost, roi, count, affordable: s.cash >= cost };
  });

  const affordable = scored.filter((x) => x.affordable).sort((a, b) => b.roi - a.roi);
  if (affordable.length > 0) {
    rec[affordable[0].def.id] = 'Best ROI';
  }

  if ((s.hap ?? 60) < 55) {
    const hapPick = affordable.find((x) => HAPPY_BUILDINGS.has(x.def.id) && !rec[x.def.id]);
    if (hapPick) rec[hapPick.def.id] = 'Happiness Fix';
  } else if ((s.b?.port || 0) === 0) {
    const portPick = affordable.find((x) => x.def.id === 'port' && !rec[x.def.id]);
    if (portPick) rec[portPick.def.id] = 'Gems & Stickers';
  }

  if (Object.keys(rec).length === 0) {
    const nextGoal = scored.slice().sort((a, b) => a.cost - b.cost)[0];
    if (nextGoal) rec[nextGoal.def.id] = 'Next Target';
  }
  return rec;
}

function getRecommendedBoosters(s, nowMs = Date.now()) {
  const rec = {};
  const ready = BOOSTERS.filter((b) => canBuyBooster(s, b, nowMs).ok);
  if (ready.length === 0) return rec;

  if ((s.hap ?? 60) < 55) {
    const hap = ready.find((b) => b.fx === 'hap10');
    if (hap) rec[hap.id] = 'Happiness Fix';
  }
  if ((s.appr ?? 55) < 55) {
    const rally = ready.find((b) => b.fx === 'rally');
    if (rally) rec[rally.id] = 'Approval Boost';
  }

  const baseNet = Math.max(0, calculateIncome(s, { nowMs, ignoreTempBoosters: true }).net);
  if ((s.taxPool || 0) >= Math.max(500, baseNet * 45)) {
    const surge = ready.find((b) => b.fx === 'tax15x');
    if (surge) rec[surge.id] = 'Tax Cashout';
  }

  const incomeOrder = ['boom_surge', 'golden_treasury', 'quick_profit'];
  for (const id of incomeOrder) {
    const pick = ready.find((b) => b.id === id);
    if (pick) {
      rec[pick.id] = 'Top Income';
      break;
    }
  }
  return rec;
}

function getRecommendedTech(s) {
  const rec = {};
  const unlockable = TECH_TREE.filter((t) => canUnlockTech(s, t.id).ok);
  if (unlockable.length > 0) {
    if ((s.hap ?? 60) < 60) {
      const civic = unlockable.find((t) => t.cat === 'civic');
      if (civic) {
        rec[civic.id] = 'Happiness Fix';
        return rec;
      }
    }
    rec[unlockable[0].id] = 'Unlock Now';
    return rec;
  }
  const nextLocked = TECH_TREE.find((t) => !hasTech(s, t.id));
  if (nextLocked) {
    rec[nextLocked.id] = 'Next Research';
  }
  return rec;
}

function getRecommendedShopItems(s, nowMs = Date.now()) {
  let nextRankId = null;
  let rankReason = '';
  const candidateRank = (s.rank || 0) + 1;
  if (candidateRank <= MAX_RANK && canBuyRank(s, candidateRank).ok) {
    nextRankId = candidateRank;
    rankReason = 'Ready Upgrade';
  }

  let subTier = null;
  let subReason = '';
  for (const sub of [...SUBSCRIPTIONS].reverse()) {
    const price = getSubscriptionPrice(s, sub, nowMs);
    const check = canBuySubscription(s, sub, nowMs);
    if (price.promoActive && check.ok) {
      subTier = sub.id;
      subReason = `Weekly Deal −${price.discountPct}%`;
      break;
    }
  }
  if (!subTier) {
    for (const sub of [...SUBSCRIPTIONS].reverse()) {
      if (canBuySubscription(s, sub, nowMs).ok) {
        subTier = sub.id;
        subReason = 'Best Value';
        break;
      }
    }
  }
  if (!subTier) {
    for (const sub of SUBSCRIPTIONS) {
      const price = getSubscriptionPrice(s, sub, nowMs);
      if (price.promoActive) {
        subTier = sub.id;
        subReason = `Weekly Deal −${price.discountPct}%`;
        break;
      }
    }
  }

  return { nextRankId, rankReason, subTier, subReason };
}

function getRecommendedPolicyHint(s) {
  const ti = taxInfo(s);
  const hap = targetHappiness(s);
  if (ti.ev > 0.12) {
    return { id: 'balanced', reason: 'Cuts High Evasion' };
  }
  if (hap < 50) {
    return { id: 'welfare', reason: 'Boosts Happiness' };
  }
  if (s.hap >= 75 && ti.ev === 0 && calculateGdp(s) >= 20000 && s.tax < 20) {
    return { id: 'revenue', reason: 'Max Net Yield' };
  }
  return { id: null, reason: '' };
}

function applyCollectTax(s, tradeTier = 0, nowMs = Date.now(), rng = Math.random) {
  const res = calculateTaxCollect(s, tradeTier, nowMs);
  if (res.collected < 1) {
    return {
      ok: false,
      state: s,
      collected: 0,
      bonusApplied: false,
      bonusAmount: 0,
      portDrop: { gems: 0, sticker: null },
    };
  }
  const portDrop = rollTradePortExport(s, res.poolAmount, res.baseNet, rng);
  const nextStk = portDrop.sticker
    ? { ...(s.stk || {}), [portDrop.sticker.id]: ((s.stk || {})[portDrop.sticker.id] || 0) + 1 }
    : s.stk;
  return {
    ok: true,
    collected: res.collected,
    bonusApplied: res.bonusApplied,
    bonusAmount: res.bonusAmount,
    portDrop,
    state: {
      ...s,
      cash: Math.min(1e13, s.cash + res.collected),
      gems: Math.min(1e9, Math.floor(s.gems) + portDrop.gems),
      stk: nextStk,
      taxPool: 0,
      activeFx: res.bonusApplied ? { ...(s.activeFx || {}), taxSurge: 0 } : s.activeFx,
    },
  };
}

function applyActivateGemBoost(s) {
  if (s.boost > 0) return { ok: false, state: s, reason: 'Boost is already active' };
  if (s.gems < 5) return { ok: false, state: s, reason: 'Need 5 diamonds' };
  return {
    ok: true,
    state: {
      ...s,
      gems: Math.max(0, Math.floor(s.gems) - 5),
      boost: 30,
    },
  };
}

function applyBuyBuilding(s, id, qty, nowMs = Date.now()) {
  const def = BUILDINGS.find((b) => b.id === id);
  if (!def) return { ok: false, state: s, newCount: 0, cost: 0, reason: 'Unknown building' };
  const count = s.b[id] || 0;
  if (count >= 10000) return { ok: false, state: s, newCount: count, cost: 0, reason: 'Max building count reached' };
  const clampedQty = Math.min(qty, 10000 - count);
  const cost = bulkBuildingCost(def, count, clampedQty, getDevelopmentDiscount(s, nowMs));
  if (s.cash < cost) return { ok: false, state: s, newCount: count, cost, reason: 'Not enough cash' };
  const newCount = count + clampedQty;
  return {
    ok: true,
    newCount,
    cost,
    state: {
      ...s,
      cash: Math.max(0, s.cash - cost),
      b: { ...s.b, [id]: newCount },
    },
  };
}

function applyFixInfra(s, key, full, nowMs = Date.now()) {
  const cost = gxRepairCost(s, key, full, nowMs);
  if (cost <= 0) return { ok: false, state: s, cost: 0, reason: 'Already at full condition' };
  if (s.cash < cost) return { ok: false, state: s, cost, reason: 'Not enough cash' };
  return {
    ok: true,
    cost,
    state: {
      ...s,
      cash: Math.max(0, s.cash - cost),
      gx: {
        ...s.gx,
        cond: {
          ...s.gx.cond,
          [key]: full ? 100 : Math.min(100, (s.gx.cond[key] ?? 100) + 20),
        },
      },
    },
  };
}

function applyUpgradeBuilding(s, id, nowMs = Date.now()) {
  const lvl = s.gx?.lvl?.[id] || 1;
  const cost = gxUpgradeCost(s, id, nowMs);
  if (lvl >= 5 || cost <= 0) return { ok: false, state: s, newLevel: lvl, cost: 0, reason: 'Already at max level' };
  if (s.cash < cost) return { ok: false, state: s, newLevel: lvl, cost, reason: 'Not enough cash' };
  return {
    ok: true,
    newLevel: lvl + 1,
    cost,
    state: {
      ...s,
      cash: Math.max(0, s.cash - cost),
      gx: {
        ...s.gx,
        lvl: { ...s.gx.lvl, [id]: lvl + 1 },
      },
    },
  };
}

function applyChangeGov(s, govId, nowMs = Date.now()) {
  const g = GOVS.find((x) => x.id === govId);
  if (!g) return { ok: false, state: s, reason: 'Unknown government type' };
  if (s.gov === govId) return { ok: false, state: s, reason: 'Already active' };
  if ((s.govT || 0) + GOV_CHANGE_CD_MS > nowMs) return { ok: false, state: s, reason: 'Government change on cooldown' };
  if (s.cash < g.cost) return { ok: false, state: s, reason: 'Not enough cash' };
  return {
    ok: true,
    govName: g.n,
    state: {
      ...s,
      cash: Math.max(0, s.cash - g.cost),
      gov: govId,
      govT: nowMs,
    },
  };
}

function applyClaimQuest(s, questId, todayKey, rankPos) {
  if (s.claimed?.[questId]) return { ok: false, state: s, gemsAdded: 0, reason: 'Already claimed' };
  const activeIds =
    s.questIds?.length === 3 && s.questDay === todayKey ? s.questIds : selectDailyQuestIds(todayKey);
  const qIndex = QUEST_POOL.findIndex((q) => q.id === questId);
  if (qIndex < 0 || !activeIds.includes(qIndex)) {
    return { ok: false, state: s, gemsAdded: 0, reason: 'Quest not active today' };
  }
  const q = QUEST_POOL[qIndex];
  if (q.f(s, { rank: rankPos }) < q.g) {
    return { ok: false, state: s, gemsAdded: 0, reason: 'Objective not yet completed' };
  }
  const cleanClaimed = {};
  for (const [k, v] of Object.entries(s.claimed || {}).slice(0, 19)) {
    if (Number(v) > 0) cleanClaimed[k] = 1;
  }
  cleanClaimed[questId] = 1;
  return {
    ok: true,
    gemsAdded: q.r,
    state: {
      ...s,
      gems: Math.min(1e9, Math.floor(s.gems) + q.r),
      claimed: cleanClaimed,
    },
  };
}
